  </div>`;

  // All items with any orders
  const allProducts = new Set();
  smIds.forEach(function(id){Object.keys(stockOrders[id].items||{}).forEach(function(n){allProducts.add(n);});});

  // Group by category
  const grouped = {};
  cats.forEach(function(cat){
    cat.items.forEach(function(item){
      if(allProducts.has(item.name)){
        if(!grouped[cat.label]) grouped[cat.label]={cat:cat,items:[]};
        grouped[cat.label].items.push(item);
      }
    });
  });

  // Table: Product × Salesman
  html += `<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05)">
    <div style="overflow-x:auto;max-height:560px;overflow-y:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead style="position:sticky;top:0;z-index:5">
    <tr style="background:linear-gradient(90deg,#1e1b4b,#312e81)">
      <th style="padding:10px 14px;text-align:left;color:rgba(255,255,255,0.9);font-size:11px;font-weight:700;min-width:140px;position:sticky;left:0;background:#1e1b4b">Product</th>
      ${smIds.map(function(id){
        const name = (stockOrders[id]&&stockOrders[id].name)||creds[id]?.name||id;
        return `<th style="padding:8px 10px;text-align:center;color:rgba(255,255,255,0.9);font-size:11px;font-weight:700;min-width:80px;border-left:1px solid rgba(255,255,255,0.1)">${name.split(' ')[0]}</th>`;
      }).join('')}
      <th style="padding:10px 10px;text-align:center;color:#fff;font-size:11px;font-weight:700;min-width:70px;border-left:1px solid rgba(255,255,255,0.2)">Total</th>
      <th style="padding:10px 10px;text-align:center;color:#fff;font-size:11px;font-weight:700;min-width:80px">Available</th>
    </tr>
    </thead><tbody>`;

  let grandTotal = 0;
  const smTotals = {};
  smIds.forEach(function(id){smTotals[id]=0;});

  Object.keys(grouped).forEach(function(catLabel){
    const g = grouped[catLabel];
    html += `<tr style="background:#f8fafc"><td colspan="${smIds.length+3}" style="padding:7px 14px;font-size:11px;font-weight:700;color:${g.cat.color};text-transform:uppercase;letter-spacing:0.05em;position:sticky;left:0">▸ ${catLabel}</td></tr>`;
    g.items.forEach(function(item){
      let rowTotal = 0;
      const d = wmsGetAvail(item.name);
      const src = (lsGet('g_photos',{})||{})[item.name]||'';
      const cells = smIds.map(function(id){
        const ord = stockOrders[id]&&stockOrders[id].items&&stockOrders[id].items[item.name];
        const bpb = item.packRate||g.cat.bunchesPerBox||25;
        const bn = ord?((ord.box||0)*bpb+(ord.bunch||0)):0;
        rowTotal+=bn; smTotals[id]+=bn;
        return `<td style="padding:8px 10px;text-align:center;font-weight:${bn>0?'700':'400'};color:${bn>0?'#5b21b6':'#cbd5e1'};border-left:1px solid #f1f5f9">${bn>0?bn:'—'}</td>`;
      }).join('');
      grandTotal+=rowTotal;
      const over = rowTotal>d.avail&&d.avail>0;
      html += `<tr style="border-bottom:1px solid #f1f5f9">
        <td style="padding:8px 14px;position:sticky;left:0;background:#fff;box-shadow:2px 0 4px rgba(0,0,0,0.04)">
          <div style="display:flex;align-items:center;gap:8px">
            ${src?`<img src="${src}" style="width:22px;height:22px;border-radius:4px;object-fit:cover"/>`:`<span>${item.emoji}</span>`}
            <span style="font-weight:500;color:var(--text)">${item.name}</span>
            ${over?'<span style="font-size:10px;color:#d97706">⚠️</span>':''}
          </div>
        </td>
        ${cells}
        <td style="padding:8px 10px;text-align:center;font-weight:700;color:#1e1b4b;border-left:1px solid #e8edf5">${rowTotal||'—'}</td>
        <td style="padding:8px 10px;text-align:center;font-weight:600;color:${d.avail<=0?'#dc2626':over?'#d97706':'#059669'}">${d.avail}</td>
      </tr>`;
    });
  });

  // Grand total row
  html += `<tr style="background:linear-gradient(90deg,#1e1b4b,#312e81)">
    <td style="padding:10px 14px;font-weight:700;color:#fff;position:sticky;left:0;background:#1e1b4b">🌸 Grand Total</td>
    ${smIds.map(function(id){return `<td style="padding:10px 10px;text-align:center;font-weight:800;color:#fff;border-left:1px solid rgba(255,255,255,0.1)">${smTotals[id]||'—'}</td>`;}).join('')}
    <td style="padding:10px 10px;text-align:center;font-weight:800;color:#fff;border-left:1px solid rgba(255,255,255,0.2)">${grandTotal}</td>
    <td></td>
  </tr>`;
  html += '</tbody></table></div></div>';
  body.innerHTML = html;
}

// ── ORDERS EXCEL ──────────────────────────────────────────────────
function wmsDownloadOrdersExcel(){
  const smIds = Object.keys(stockOrders||{}).filter(function(id){
    return stockOrders[id]&&stockOrders[id].submittedAt&&Object.keys(stockOrders[id].items||{}).length;
  });
  if(!smIds.length){toast('⚠️ No orders to download.');return;}
  const smNames = smIds.map(function(id){return (stockOrders[id]&&stockOrders[id].name)||creds[id]?.name||id;});
  const allProducts = new Set();
  smIds.forEach(function(id){Object.keys(stockOrders[id].items||{}).forEach(function(n){allProducts.add(n);});});

  let csv = 'Greena WMS — Stock Orders\n';
  csv += 'Date,'+ new Date().toLocaleDateString('en-GB')+'\n\n';
  csv += 'Category,Product,Available (Bn),'+smNames.join(',')+',Total\n';

  cats.forEach(function(cat){
    const catItems = cat.items.filter(function(i){return allProducts.has(i.name);});
    if(!catItems.length) return;
    let catTotal=0;
    const smCatTotals = smIds.map(function(){return 0;});
    csv+='"--- '+cat.label+' ---"\n';
    catItems.forEach(function(item){
      const d = wmsGetAvail(item.name);
      const bpb = item.packRate||cat.bunchesPerBox||25;
      let rowTotal=0;
      const vals = smIds.map(function(id,i){
        const ord = stockOrders[id]&&stockOrders[id].items&&stockOrders[id].items[item.name];
        const bn = ord?((ord.box||0)*bpb+(ord.bunch||0)):0;
        rowTotal+=bn; smCatTotals[i]+=bn;
        return bn||0;
      });
      catTotal+=rowTotal;
      csv+=','+item.name+','+d.avail+','+vals.join(',')+','+rowTotal+'\n';
    });
    csv+=','+cat.label+' SUBTOTAL,,'+smCatTotals.join(',')+','+catTotal+'\n\n';
  });

  // Grand total
  const grandTotals = smIds.map(function(id){
    const bns = Object.entries(stockOrders[id].items||{}).reduce(function(a,e){
      const bpb = getCatBpbForProduct(e[0]);
      return a+(e[1].box||0)*bpb+(e[1].bunch||0);
    },0);
    return bns;
  });
  csv+=',GRAND TOTAL,,'+grandTotals.join(',')+','+grandTotals.reduce(function(a,v){return a+v;},0)+'\n';

  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'WMS_Orders_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
  toast('✅ Excel downloaded!');
}

function wmsRenderPlaceGrid(){
  const f = window.wmsPlaceFilters;
  const catF = (f.cat||'').trim();
  const search = (f.search||'').trim().toLowerCase();
  const statusF = (f.status||'').trim();
  const photos = lsGet('g_photos',{})||{};
  const smId = currentUser.id;
  const existing = (stockOrders[smId]&&stockOrders[smId].submittedAt&&!stockOrders[smId].fulfilledAt&&stockOrders[smId].items)||{};
  const grid = document.getElementById('wms-place-grid');
  if(!grid) return;

  let totalProducts=0, html='';

  cats.forEach(function(cat){
    if(catF&&cat.label!==catF) return;
    const items = cat.items.filter(function(item){
      if(search && item.name.toLowerCase().indexOf(search)===-1) return false;
      if(statusF){
        const d = wmsGetAvail(item.name);
        const s = wmsStockStatus(d.avail, d.total);
        if(s !== statusF) return false;
      }
      return true;
    });
    if(!items.length) return;

    html += '<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05)">'
      // Category header
      +'<div style="padding:10px 16px;background:linear-gradient(90deg,#1e1b4b,#312e81);display:flex;align-items:center;gap:8px">'
      +'<span style="width:10px;height:10px;border-radius:50%;background:'+cat.color+'"></span>'
      +'<span style="font-size:13px;font-weight:700;color:#fff">'+cat.label+'</span>'
      +'<span style="font-size:11px;color:rgba(255,255,255,0.45)">'+items.length+' products</span>'
      +'</div>'
      // Product grid
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1px;background:var(--border)">';

    items.forEach(function(item){
      totalProducts++;
      const d = wmsGetAvail(item.name);
      const s = wmsStockStatus(d.avail, d.total);
      const bpb = item.packRate||cat.bunchesPerBox||25;
      const src = photos[item.name]||'';
      const existingQty = existing[item.name];
      const existBox = existingQty?existingQty.box||0:0;
      const existBunch = existingQty?existingQty.bunch||0:0;
      const hasOrder = existBox>0||existBunch>0;
      const sid = item.name.replace(/\W+/g,'_');

      const statusColor = s==='out'?'#dc2626':s==='low'?'#d97706':'#059669';
      const statusBg = s==='out'?'#fee2e2':s==='low'?'#fef3c7':'#dcfce7';
      const statusLbl = s==='out'?'Out of Stock':s==='low'?'Low Stock':'Available';

      html += '<div style="background:#fff;padding:14px 12px;display:flex;flex-direction:column;gap:8px;position:relative;cursor:default'+(hasOrder?';outline:2px solid #4f46e5;outline-offset:-2px;border-radius:0':'')+'" id="wms-place-card-'+sid+'">'
        // Ordered badge
        +(hasOrder?'<div style="position:absolute;top:8px;right:8px;background:#4f46e5;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px">'+( existBox>0?existBox+'B':'')+(existBox>0&&existBunch>0?' + ':'')+( existBunch>0?existBunch+'bn':'')+'</div>':'')
        // Product image
        +'<div style="width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f8fafc;border:1px solid var(--border);flex-shrink:0">'
        +(src?'<img src="'+src+'" style="width:100%;height:100%;object-fit:cover"/>'
          :'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px">'+item.emoji+'</div>')
        +'</div>'
        // Name
        +'<div style="font-size:12px;font-weight:700;color:var(--text);line-height:1.3;min-height:32px">'+item.name+'</div>'
        // Stock status
        +'<div style="display:flex;align-items:center;justify-content:space-between">'
        +'<span style="background:'+statusBg+';color:'+statusColor+';padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700">'+statusLbl+'</span>'
        +'<span style="font-size:11px;font-weight:600;color:var(--text2)">'+d.avail+' Bn</span>'
        +'</div>'
        // Qty inputs
        +(s!=='out'?
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'
          +'<div>'
          +'<div style="font-size:9px;font-weight:700;color:var(--text2);margin-bottom:3px;text-align:center">BOX</div>'
          +'<input type="number" min="0" placeholder="0" value="'+(existBox||'')+'" class="wms-place-box" data-name="'+item.name+'" data-bpb="'+bpb+'" data-sid="'+sid+'" oninput="wmsOnPlaceChange(this)" style="width:100%;border:1.5px solid var(--border);border-radius:7px;padding:6px;font-size:13px;font-weight:700;text-align:center;font-family:Inter,sans-serif;outline:none;background:#fafbff"/>'
          +'</div>'
          +'<div>'
          +'<div style="font-size:9px;font-weight:700;color:var(--text2);margin-bottom:3px;text-align:center">BUNCH</div>'

    html += '</div></div>';

  grid.innerHTML = html;
  const countEl = document.getElementById('wms-place-count');
  if(countEl) countEl.textContent = totalProducts+' products';
}

function wmsOnPlaceChange(inp){
  const sid = inp.dataset.sid;
  const name = inp.dataset.name;
  const bpb = parseInt(inp.dataset.bpb)||25;
  const row = inp.closest('[id^="wms-place-card-"]');
  if(!row) return;
  const box = parseInt(row.querySelector('.wms-place-box')?.value)||0;
  const bunch = parseInt(row.querySelector('.wms-place-bunch')?.value)||0;
  const total = box*bpb+bunch;
  const d = wmsGetAvail(name);
  const totalEl = document.getElementById('wms-place-total-'+sid);

  // Warn if over-ordering
  const isOver = total > d.avail;
  if(totalEl){
    if(total>0){
      if(isOver){
        totalEl.innerHTML='<span style="color:#dc2626;font-weight:700">⚠️ '+total+' Bn (over by '+(total-d.avail)+')</span>';
      } else {
        totalEl.innerHTML='<span style="color:#4f46e5;font-weight:700">= '+total+' Bn ordered</span>';
      }
    } else {
      totalEl.textContent=bpb+' Bn/Box';
    }
  }
  // Highlight card
  if(row){
    if(isOver) row.style.outline='2px solid #dc2626';
    else if(total>0) row.style.outline='2px solid #4f46e5';
    else row.style.outline='none';
  }
  // Warn on inputs
  row.querySelectorAll('.wms-place-box,.wms-place-bunch').forEach(function(i){
    i.style.borderColor = isOver?'#dc2626':total>0?'#4f46e5':'var(--border)';
    i.style.background = isOver?'#fef2f2':total>0?'#f5f3ff':'#fafbff';
  });
  wmsUpdatePlaceSummary();
}

function wmsUpdatePlaceSummary(){
  let totalBn=0, totalProducts=0, overOrders=0;
  document.querySelectorAll('.wms-place-box').forEach(function(inp){
    const bpb=parseInt(inp.dataset.bpb)||25;
    const name=inp.dataset.name;
    const row=inp.closest('[id^="wms-place-card-"]');
    const box=parseInt(row?.querySelector('.wms-place-box')?.value)||0;
    const bunch=parseInt(row?.querySelector('.wms-place-bunch')?.value)||0;
    const total=box*bpb+bunch;
    if(total>0){
      totalBn+=total;totalProducts++;
      const d=wmsGetAvail(name);
      if(total>d.avail) overOrders++;
    }
  });
  const s=document.getElementById('wms-place-summary');
  if(s){
    if(totalBn>0){
      s.style.display='block';
      if(overOrders>0){
        s.innerHTML='<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;color:#dc2626">⚠️ '+overOrders+' product(s) exceed available stock — please reduce quantities before submitting</div>';
      } else {
        s.innerHTML='<div style="background:#ecfdf5;border:1.5px solid #86efac;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;color:#15803d">🛒 '+totalBn+' Bn across '+totalProducts+' products — ready to submit</div>';
      }
    } else {
      s.style.display='none';
    }
  }
  // Enable/disable submit button
  const btn=document.getElementById('wms-place-submit-btn');
  if(btn){
    btn.disabled=overOrders>0;
    btn.style.opacity=overOrders>0?'0.5':'1';
    btn.style.cursor=overOrders>0?'not-allowed':'pointer';
    btn.title=overOrders>0?'Reduce quantities to available stock first':'';
  }
}

function wmsClearPlaceOrder(){
  document.querySelectorAll('.wms-place-box,.wms-place-bunch').forEach(function(i){i.value='';});
  document.querySelectorAll('[id^="wms-place-card-"]').forEach(function(card){
    card.style.outline='none';
  });
  document.querySelectorAll('[id^="wms-place-total-"]').forEach(function(el){
    const bpbEl=el.closest('[id^="wms-place-card-"]')?.querySelector('.wms-place-box');
    if(bpbEl) el.textContent=(bpbEl.dataset.bpb||25)+' Bn/Box';
  });
  const s=document.getElementById('wms-place-summary');
  if(s) s.style.display='none';
}

function wmsSubmitPlaceOrder(){
  const smId=currentUser.id;
  const items={};
  let total=0;
  document.querySelectorAll('.wms-place-box').forEach(function(inp){
    const name=inp.dataset.name;
    const bpb=parseInt(inp.dataset.bpb)||25;
    const row=inp.closest('[id^="wms-place-card-"]');
    const box=parseInt(row?.querySelector('.wms-place-box')?.value)||0;
    const bunch=parseInt(row?.querySelector('.wms-place-bunch')?.value)||0;
    if(box>0||bunch>0){
      items[name]={box,bunch};
      total+=box*bpb+bunch;
    }
  });
  if(!total){toast('⚠️ Add at least one product.');return;}
  // Check if any product exceeds available stock
  let overCount=0;
  Object.entries(items).forEach(function(e){
    const name=e[0],q=e[1];
    const bpb=getCatBpbForProduct(name);
    const bn=(q.box||0)*bpb+(q.bunch||0);
    const d=wmsGetAvail(name);
    if(bn>d.avail) overCount++;
  });
  if(overCount>0){toast('⚠️ '+overCount+' product(s) exceed available stock. Please reduce quantities.');return;}

  // Save to stockOrders (for fulfill) — reset any previous fulfilled state
  stockOrders[smId]={
    items,
    submittedAt:new Date().toISOString(),
    name:currentUser.name,
    fulfilledAt:null,
    fulfilledQty:null,
    fulfilledItems:null,
    status:'pending'
  };
  saveStockOrders();

  // Save to greena_stock_history (for My History + Admin History)
  const histId='wms-'+smId+'-'+Date.now();
  const histRecord={
    id:histId,
    userId:smId,
    userName:currentUser.name,
    items:items,
    doneAt:new Date().toISOString(),
    stockDate:new Date().toISOString().split('T')[0],
    source:'wms'
  };
  fetch(SB_URL+'/rest/v1/greena_stock_history',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:histId,data:histRecord}])
  }).then(function(){
    toast('✅ Order submitted! '+total+' Bn across '+Object.keys(items).length+' products.');
  }).catch(function(){
    toast('✅ Order saved locally!');
  });

  WMS_HIST.unshift({type:'order',desc:'Order placed — '+currentUser.name,meta:Object.keys(items).length+' products · '+total+' Bn',qty:'-'+total+' Bn reserved'});
  wmsRenderPlaceOrder(document.getElementById('wms-body'));
}

// Hook 1: Arrival published/qty saved → auto-add stock to WMS
function syncArrivalToWmsStock(arr){
  if(!arr||!arr.arrivals) return;
  Object.entries(arr.arrivals).forEach(function(e){
    const name=e[0], q=e[1];
    if(!q) return;
    const bpb=getCatBpbForProduct(name);
    const arrBn=(q.box||0)*bpb+(q.bunch||0);
    if(!arrBn) return;
    // Set stock to arrival qty (this arrival's contribution)
    // Key: track per-arrival so re-saving doesn't double-add
    if(!stockData[name]||typeof stockData[name]!=='object') stockData[name]={box:0,bunch:0};
    // Use arrival id as key to avoid double-add on re-save
    const trackKey='_arr_'+arr.id;
    const prev=stockData[name][trackKey]||0;
    const diff=arrBn-prev;
    if(diff===0) return;
    const curBn=(stockData[name].box||0)*bpb+(stockData[name].bunch||0);
    const newBn=Math.max(0,curBn+diff);
    stockData[name].box=Math.floor(newBn/bpb);
    stockData[name].bunch=newBn%bpb;
    stockData[name][trackKey]=arrBn; // track what this arrival contributed
  });
  saveStockToDB();
  // Refresh WMS live stock if visible
  if(wmsTab==='live') wmsRenderLiveTable();
}

// Hook 2: Salesman arrival order submit → also save to WMS stockOrders
function syncArrivalOrderToWms(arr, uid){
  if(!arr||!uid) return;
  const smOrder=arr.orders[uid];
  if(!smOrder) return;
  const items={};
  Object.entries(smOrder).forEach(function(e){
    if(e[0]==='_submittedAt') return;
    const name=e[0], q=e[1];
    if(q&&(q.box>0||q.bunch>0)){
      items[name]={box:q.box||0,bunch:q.bunch||0};
    }
  });
  if(!Object.keys(items).length) return;
  const key=uid+'__'+arr.id;
  stockOrders[key]={
    items:items,
    submittedAt:new Date().toISOString(),
    name:creds[uid]?.name||uid,
    smId:uid,
    fulfilledAt:null,
    status:'pending',
    source:'arrival',
    arrivalId:arr.id,
    arrDate:arr.arrDate
  };
  saveStockOrders();
}

function saveStockOrders(){
  lsSet('g_stockOrders',stockOrders);
  fetch(SB_URL+'/rest/v1/greena_settings',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{key:'stockOrders',value:JSON.stringify(stockOrders)}])
  }).catch(function(){});
}

function wmsSaveArrivalStockEdit(arrId){
  const arr=arrivalsDB.find(function(a){return a.id===arrId;});
  if(!arr) return;
  const isResync=arr._wmsStockConfirmed;
  const msg=isResync
    ?'Re-sync stock for '+arrId+'?\n\nThis will update Live Stock with the edited quantities.'
    :'Confirm arrival stock for '+arrId+'?\n\nThis will add these quantities to Live Stock.';
  if(!confirm(msg)) return;
  document.querySelectorAll('.wms-arr-inp[data-arreid="'+arrId+'"]').forEach(function(inp){
    const name=inp.dataset.name, type=inp.dataset.type, val=parseInt(inp.value)||0;

  });

  fetch(SB_URL+'/rest/v1/greena_arrivals',{
    method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:arr.id,data:arr}])

function wmsConfirmArrivalStock(arrId){
  const arr=arrivalsDB.find(function(a){return a.id===arrId;});
  if(!arr) return;
  let totalAdded=0;
  Object.entries(arr.arrivals||{}).forEach(function(e){
    const name=e[0],q=e[1];
    const bpb=getCatBpbForProduct(name);
    const bn=(q.box||0)*bpb+(q.bunch||0);
    if(!bn) return;
    if(!stockData[name]||typeof stockData[name]!=='object') stockData[name]={box:0,bunch:0};
    const trackKey='_arr_'+arrId;
    const prev=stockData[name][trackKey]||0;
    const curBn=(stockData[name].box||0)*bpb+(stockData[name].bunch||0);
    const newBn=Math.max(0,curBn-prev+bn);
    stockData[name].box=Math.floor(newBn/bpb);
    stockData[name].bunch=newBn%bpb;
    stockData[name][trackKey]=bn;
    totalAdded+=bn;
  });
  arr._wmsStockConfirmed=true;
  arr._wmsConfirmedAt=new Date().toISOString();
  saveStockToDB();
  lsSet('g_arrivals_db',arrivalsDB);
  toast('✅ '+totalAdded+' Bn added to Live Stock!');
  wmsRenderArrivalStock(document.getElementById('wms-body'));
}

      +wmsArrivalOrdersBody(arr, smIds, stockConfirmed)

      +'</div>';
  });

}

function wmsArrivalOrdersBody(arr, smIds, stockConfirmed){
  const photos=lsGet('g_photos',{})||{};
  const orders=arr.orders||{};

  let html='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
    +'<thead><tr style="background:linear-gradient(90deg,#1e1b4b,#312e81)">'
    +'<th style="padding:11px 16px;text-align:left;color:rgba(255,255,255,0.85);font-size:11px;font-weight:700;min-width:160px">Salesman</th>'
    +'<th style="padding:11px 10px;text-align:center;color:rgba(255,255,255,0.85);font-size:11px;font-weight:700">Products</th>'
    +'<th style="padding:11px 10px;text-align:center;color:rgba(255,255,255,0.85);font-size:11px;font-weight:700;min-width:80px">Total Bn</th>'
    +'<th style="padding:11px 10px;text-align:center;color:rgba(255,255,255,0.85);font-size:11px;font-weight:700">Status</th>'
    +(stockConfirmed?'<th style="padding:11px 10px;text-align:center;color:rgba(255,255,255,0.85);font-size:11px;font-weight:700">Action</th>':'')
    +'</tr></thead><tbody>';

  smIds.forEach(function(uid,idx){
    const smOrder=orders[uid]||{};
    const smName=arr.credSnapshot?.[uid]?.name||creds[uid]?.name||uid;
    const isSubmitted=!!smOrder._submittedAt;
    const items=Object.entries(smOrder).filter(function(e){
      return e[0]!=='_submittedAt'&&e[1]&&((e[1].box||0)+(e[1].bunch||0))>0;
    });
    const totalBn=items.reduce(function(a,e){
      return a+(e[1].box||0)*getCatBpbForProduct(e[0])+(e[1].bunch||0);
    },0);
    const colors=['#4f46e5','#059669','#d97706','#dc2626','#7c3aed','#0891b2'];
    const color=colors[Math.abs(uid.charCodeAt(0))%colors.length];
    const rowBg=idx%2===0?'#fff':'#fafbff';
    const detailId='arr-ord-detail-'+arr.id+'-'+uid.replace(/\W/g,'_');

    // Group items by category for display
    const byCat={};
    items.forEach(function(e){
      const name=e[0],q=e[1];
      const cat=cats.find(function(c){return c.items.find(function(i){return i.name===name;});});
      const cl=cat?cat.label:'Other';
      const cc=cat?cat.color:'#94a3b8';
      if(!byCat[cl]) byCat[cl]={color:cc,items:[]};
      const bn=(q.box||0)*getCatBpbForProduct(name)+(q.bunch||0);
      byCat[cl].items.push({name,bn,emoji:cat?.items.find(function(i){return i.name===name;})?.emoji||'🌸'});
    });

    html+='<tr style="border-bottom:1px solid #f1f5f9;background:'+rowBg+'">'
      // Salesman
      +'<td style="padding:12px 16px">'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<div style="width:36px;height:36px;border-radius:10px;background:'+color+';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0">'+smName.substring(0,2).toUpperCase()+'</div>'
      +'<div><div style="font-size:13px;font-weight:700;color:var(--text)">'+smName+'</div>'
      +'<div style="font-size:10px;color:var(--text2);margin-top:1px">'+items.length+' varieties</div>'
      +'</div></div></td>'
      // Products — category summary chips + expand
      +'<td style="padding:10px 12px">'
      +'<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">'
      +Object.entries(byCat).map(function(ge){
        const catLbl=ge[0],grp=ge[1];
        const catBn=grp.items.reduce(function(a,i){return a+i.bn;},0);
        return '<span style="background:'+grp.color+'18;color:'+grp.color+';border:1px solid '+grp.color+'44;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap">'+catLbl+' <b>'+catBn+' Bn</b></span>';
      }).join('')
      +'<button type="button" onclick="wmsToggleOrdDetail(\''+detailId+'\')" style="background:#f1f5f9;border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;color:var(--text2);font-family:Inter,sans-serif">▾ Details</button>'
      +'</div>'
      // Expandable detail rows per category
      +'<div id="'+detailId+'" style="display:none;margin-top:10px">'
      +Object.entries(byCat).map(function(ge){
        const catLbl=ge[0],grp=ge[1];
        return '<div style="margin-bottom:8px">'
          +'<div style="font-size:10px;font-weight:700;color:'+grp.color+';text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">'+catLbl+'</div>'
          +'<div style="display:flex;gap:4px;flex-wrap:wrap">'
          +grp.items.map(function(i){
            const src=photos[i.name]||'';
            return '<span style="display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid '+grp.color+'33;padding:4px 9px;border-radius:8px;font-size:11px;font-weight:600;color:var(--text)">'
              +(src?'<img src="'+src+'" style="width:16px;height:16px;border-radius:3px;object-fit:cover"/>':'<span style="font-size:12px">'+i.emoji+'</span>')
              +i.name+' <b style="color:'+grp.color+'">'+i.bn+'</b></span>';
          }).join('')
          +'</div></div>';
      }).join('')
      +'</div>'
      +'</td>'
      // Total
      +'<td style="padding:12px 10px;text-align:center">'
      +'<div style="font-size:18px;font-weight:800;color:#1e1b4b">'+totalBn+'</div>'
      +'<div style="font-size:10px;color:var(--text2);margin-top:1px">Bn</div>'
      +'</td>'
      // Status
      +'<td style="padding:12px 10px;text-align:center">'
      +(isSubmitted
        ?'<span style="background:#dcfce7;color:#15803d;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block">✅ Submitted</span>'
        :'<span style="background:#f1f5f9;color:#64748b;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block">📝 Draft</span>')
      +'</td>'
      // Action
      +(stockConfirmed
        ?'<td style="padding:12px 10px;text-align:center">'
        +'<button type="button" onclick="wmsConfirmOneArrivalOrder(\''+arr.id+'\',\''+uid+'\')" style="background:linear-gradient(135deg,#4f46e5,#6366f1);border:none;color:#fff;border-radius:8px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">→ Fulfill</button>'
        +'</td>'
        :'')
      +'</tr>';
  });

  html+='</tbody></table></div>';
  return html;
}

function wmsToggleOrdDetail(id){
  const el=document.getElementById(id);

}

function wmsConfirmOneArrivalOrder(arrId,uid){
  const arr=[...(arrivalsDB||[]),...(window._historyDB||lsGet('g_history',[])||[])]
    .find(function(a){return a.id===arrId;});
  if(!arr||!arr._wmsStockConfirmed){toast('⚠️ Confirm stock first!');return;}
  const smOrder=arr.orders[uid]||{};
  const items={};
  Object.entries(smOrder).forEach(function(e){
    if(e[0]==='_submittedAt') return;
    const name=e[0],q=e[1];
    if(q&&((q.box||0)+(q.bunch||0))>0) items[name]={box:q.box||0,bunch:q.bunch||0};
  });
  if(!Object.keys(items).length) return;
  const smName=arr.credSnapshot?.[uid]?.name||creds[uid]?.name||uid;
  // Key: uid__arrId to support multiple arrivals per salesman
  const key=uid+'__'+arrId;
  stockOrders[key]={items,submittedAt:new Date().toISOString(),name:smName,smId:uid,fulfilledAt:null,status:'pending',source:'arrival',arrivalId:arrId,arrDate:arr.arrDate};
  saveStockOrders();
  toast('✅ '+smName+' → Fulfill!');
  renderStockPage();
  wmsRenderArrivalOrders(document.getElementById('wms-body'));
}

function wmsConfirmArrivalOrders(arrId){
  const arr=[...(arrivalsDB||[]),...(window._historyDB||lsGet('g_history',[])||[])]
    .find(function(a){return a.id===arrId;});
  if(!arr){toast('⚠️ Arrival not found.');return;}
  if(!arr._wmsStockConfirmed){toast('⚠️ Confirm arrival stock first!');return;}
  let count=0;
  Object.keys(arr.orders||{}).forEach(function(uid){
    if(uid==='_submittedAt') return;
    const key=uid+'__'+arrId;
    // Skip if already in fulfill queue
    if(stockOrders[key]&&stockOrders[key].submittedAt&&!stockOrders[key].fulfilledAt) return;
    const smOrder=arr.orders[uid]||{};
    const items={};
    Object.entries(smOrder).forEach(function(e){
      if(e[0]==='_submittedAt') return;
      const name=e[0],q=e[1];
      if(q&&((q.box||0)+(q.bunch||0))>0) items[name]={box:q.box||0,bunch:q.bunch||0};
    });
    if(!Object.keys(items).length) return;
    const smName=arr.credSnapshot?.[uid]?.name||creds[uid]?.name||uid;
    stockOrders[key]={items,submittedAt:new Date().toISOString(),name:smName,smId:uid,fulfilledAt:null,status:'pending',source:'arrival',arrivalId:arrId,arrDate:arr.arrDate};
    count++;
  });
  saveStockOrders();
  toast('✅ '+count+' orders → Fulfill!');
  renderStockPage();
  wmsRenderArrivalOrders(document.getElementById('wms-body'));
}


function wmsRenderFulfill(body){
  const photos=lsGet('g_photos',{})||{};
  const isAdm=currentUser.role==='admin';
  if(!window.wmsFulfillFilters) window.wmsFulfillFilters={cat:''};
  const catF=window.wmsFulfillFilters.cat||'';

  // Get pending orders — FIFO sorted by submittedAt
  const pending = Object.entries(stockOrders||{})
    .filter(function(e){
      const ord=e[1];
      return ord&&ord.submittedAt&&Object.keys(ord.items||{}).length&&!ord.fulfilledAt;
    })
    .sort(function(a,b){
      return (a[1].submittedAt||'').localeCompare(b[1].submittedAt||'');
    });

  if(!pending.length){
    body.innerHTML='<div style="text-align:center;padding:3rem;background:#fff;border:1.5px solid var(--border);border-radius:14px;color:var(--text2)"><div style="font-size:48px;opacity:0.4;margin-bottom:12px">🎉</div><div style="font-size:14px;font-weight:600">All orders fulfilled!</div></div>';
    return;
  }

  // Collect all unique products across all orders
  const allProds=new Set();
  pending.forEach(function(e){Object.keys(e[1].items||{}).forEach(function(n){allProds.add(n);});});

  // Group by category — apply filter
  const catProds={};
  cats.forEach(function(cat){
    if(catF&&cat.label!==catF) return;
    cat.items.forEach(function(item){
      if(allProds.has(item.name)){
        if(!catProds[cat.label]) catProds[cat.label]={color:cat.color,items:[]};
        catProds[cat.label].items.push(item);
      }
    });
  });

  // Stats
  const totalOrders=pending.length;
  const totalBnAll=pending.reduce(function(a,e){
    return a+Object.entries(e[1].items||{}).reduce(function(b,ie){
      return b+(ie[1].box||0)*getCatBpbForProduct(ie[0])+(ie[1].bunch||0);
    },0);
  },0);

  // Available cats in this fulfill
  const availCats=[...new Set(cats.filter(function(c){
    return c.items.some(function(i){return allProds.has(i.name);});
  }).map(function(c){return c.label;}))];

  let html=''
    // Top bar
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'
    +'<div style="background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.05)">'
    +'<div style="font-size:18px;font-weight:800;color:#4f46e5">'+totalOrders+'</div>'
    +'<div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em">Pending Orders</div>'
    +'</div>'
    +'<div style="background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.05)">'
    +'<div style="font-size:18px;font-weight:800;color:#059669">'+totalBnAll+' Bn</div>'
    +'<div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em">Total to Dispatch</div>'
    +'</div>'
    // Category filter
    +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
    +'<span style="font-size:11px;font-weight:700;color:var(--text2)">CAT:</span>'
    +'<button type="button" onclick="window.wmsFulfillFilters.cat=\'\';wmsRenderFulfill(document.getElementById(\'wms-body\'))" style="padding:5px 12px;border-radius:8px;border:1.5px solid '+(catF?'var(--border)':'#4f46e5')+';background:'+(catF?'#f8fafc':'#ede9fe')+';color:'+(catF?'var(--text2)':'#4f46e5')+';font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">All</button>'
    +availCats.map(function(cl){
      const cat=cats.find(function(c){return c.label===cl;});
      const active=catF===cl;
      return '<button type="button" onclick="window.wmsFulfillFilters.cat=\''+cl+'\';wmsRenderFulfill(document.getElementById(\'wms-body\'))" style="padding:5px 12px;border-radius:8px;border:1.5px solid '+(active?cat.color:'var(--border)')+';background:'+(active?cat.color+'22':'#f8fafc')+';color:'+(active?cat.color:'var(--text2)')+';font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">'+cl+'</button>';
    }).join('')
    +'</div>'
    +'</div>'
    +'<div style="display:flex;gap:8px">'
    +(isAdm?'<button type="button" class="btn btn-ghost btn-sm" onclick="wmsClearAllOrders()">🗑️ Clear All</button>':'')
    +'<button type="button" class="btn btn-green btn-sm" onclick="wmsFulfillAll()">✅ Confirm All</button>'
    +'</div>'
    +'</div>'

    // Scrollable table wrapper — horizontal scroll, vertical page scroll
    +'<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05)">'
    +'<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px;min-width:'+(220+pending.length*110)+'px">'

    // Sticky double header
    +'<thead>'
    // Row 1: salesman names
    +'<tr style="background:linear-gradient(90deg,#0a0f1e,#1e1b4b)">'
    +'<th style="padding:10px 16px;text-align:left;color:rgba(255,255,255,0.4);font-size:10px;font-weight:700;min-width:170px;position:sticky;left:0;z-index:6;background:#0a0f1e">PRODUCT</th>'
    +'<th style="padding:10px 10px;text-align:center;color:rgba(255,255,255,0.4);font-size:10px;font-weight:700;min-width:65px">TOTAL</th>'
    +pending.map(function(e){
      const smId=e[0],ord=e[1];
      const realSmId=ord.smId||(smId.includes('__')?smId.split('__')[0]:smId);
      const smName=ord.name||creds[realSmId]?.name||realSmId;
      const isArrival=ord.source==='arrival';
      const t=new Date(ord.submittedAt);
      const timeStr=t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      return '<th style="padding:8px 6px;text-align:center;min-width:105px;border-left:1px solid rgba(255,255,255,0.07)">'
        +'<div style="font-size:12px;font-weight:700;color:#fff;white-space:nowrap">'+smName+'</div>'
        +'<div style="font-size:9px;color:rgba(255,255,255,0.4);margin-top:1px">'+(isArrival?'🌸 '+(ord.arrDate||'Arrival'):'🛒 WMS')+' · '+timeStr+'</div>'
        +(isAdm?'<button type="button" onclick="wmsDeleteFulfillOrder(\''+smId+'\')" style="background:rgba(239,68,68,0.18);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;margin-top:3px">🗑️ Remove</button>':'')
        +'</th>';
    }).join('')
    +'<th style="padding:10px 10px;text-align:center;color:#00c9a7;font-size:10px;font-weight:700;min-width:85px;border-left:1px solid rgba(255,255,255,0.15)">REMAINING</th>'
    +'</tr>'
    // Row 2: dispatch buttons
    +'<tr style="background:#131929;border-bottom:2px solid rgba(255,255,255,0.08)">'
    +'<td style="padding:8px 16px;font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.05em;position:sticky;left:0;z-index:6;background:#131929">DISPATCH QTY → REMAINING</td>'
    +'<td style="padding:6px 8px;text-align:center"></td>'
    +pending.map(function(e){
      const smId=e[0];
      return '<td style="padding:6px 6px;text-align:center;border-left:1px solid rgba(255,255,255,0.06)">'
        +'<button type="button" onclick="wmsFulfillOrder(\''+smId+'\')" style="background:#00c9a7;border:none;color:#0a0f1e;border-radius:7px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap">✅ Dispatch</button>'
        +'</td>';
    }).join('')
    +'<td style="border-left:1px solid rgba(255,255,255,0.1)"></td>'
    +'</tr>'
    +'</thead>'

    // Body rows
    +'<tbody>';

  let hasRows=false;
  Object.entries(catProds).forEach(function(ge){
    const catLabel=ge[0],grp=ge[1];
    html+='<tr style="background:'+grp.color+'12;border-top:2px solid '+grp.color+'33">'
      +'<td colspan="'+(pending.length+3)+'" style="padding:6px 16px;font-size:10px;font-weight:800;color:'+grp.color+';text-transform:uppercase;letter-spacing:0.06em;position:sticky;left:0">▸ '+catLabel+'</td>'
      +'</tr>';

    grp.items.forEach(function(item,idx){
      const d=wmsGetAvail(item.name);
      const totalStock=d.total; // show total, not available
      const src=photos[item.name]||'';
      const rowBg=idx%2===0?'#fff':'#fafbff';
      const remId='wms-ful-rem-'+item.name.replace(/\W/g,'_');

        +'<div style="display:flex;align-items:center;gap:8px">'
        +(src?'<img src="'+src+'" style="width:24px;height:24px;border-radius:5px;object-fit:cover"/>':'<span style="font-size:17px">'+item.emoji+'</span>')
        +'<span style="font-weight:600;color:var(--text);font-size:12px">'+item.name+'</span>'
        +'</div></td>'
        // Total stock column
        +'<td style="padding:9px 10px;text-align:center;font-weight:800;font-size:13px;color:#4f46e5">'+totalStock+'</td>'
        +pending.map(function(e){

function wmsFulInpChange(inp){
  const remId=inp.dataset.remid;
  const total=parseInt(inp.dataset.total)||0;
  const name=inp.dataset.name;
  if(!remId) return;
  // Sum all inputs for this product across all salesman
  let dispatching=0;
  document.querySelectorAll('.wms-ful-inp[data-name="'+name+'"]').forEach(function(i){
    dispatching+=parseInt(i.value)||0;
  });
  const remaining=total-dispatching;
  const el=document.getElementById(remId);
  if(el){
    el.textContent=remaining;
    el.style.color=remaining<0?'#dc2626':remaining===0?'#94a3b8':'#059669';
  }
  // Highlight input if over-dispatching
  inp.style.borderColor=remaining<0?'#dc2626':'var(--border)';
  inp.style.background=remaining<0?'#fef2f2':'#fff';
}

function wmsClearAllOrders(){
  if(!confirm('Clear ALL pending orders from fulfill queue?')) return;
  Object.keys(stockOrders||{}).forEach(function(k){
    if(stockOrders[k]&&stockOrders[k].submittedAt&&!stockOrders[k].fulfilledAt) delete stockOrders[k];
  });
  saveStockOrders();
  toast('🗑️ All pending orders cleared.');
  renderStockPage();
  wmsRenderFulfill(document.getElementById('wms-body'));
}

function wmsFulfillOrder(smId){
  const ord = stockOrders[smId];
  if(!ord) return;
  // Extract real salesman ID from composite key (uid__arrId) or plain uid
  const realSmId = ord.smId || (smId.includes('__') ? smId.split('__')[0] : smId);
  let anyFul=false, allFull=true, total=0;
  const fulfilledItems={};

  document.querySelectorAll('.wms-ful-inp[data-smid="'+smId+'"]').forEach(function(inp){
    const name = inp.dataset.name;
    const ordered = parseInt(inp.dataset.ordered)||0;
    const val = parseInt(inp.value)||0;
    if(val>0){
      anyFul=true; total+=val;
      fulfilledItems[name]=val;
      const bpb = getCatBpbForProduct(name);
      const raw = stockData[name];
      const stk = raw&&typeof raw==='object'?raw:{box:0,bunch:0};
      const curBn = (stk.box||0)*bpb+(stk.bunch||0);
      const newBn = Math.max(0, curBn-val);
      stockData[name] = {box:Math.floor(newBn/bpb), bunch:newBn%bpb};
    }
    if(val<ordered) allFull=false;
  });

  if(!anyFul){toast('⚠️ Enter at least one quantity.');return;}

  const now = new Date().toISOString();
  const nowDate = now.split('T')[0];

  // Mark order fulfilled
  ord.fulfilledAt = now;
  ord.fulfilledQty = total;
  ord.fulfilledItems = fulfilledItems;
  ord.fulfilledBy = currentUser.name;
  ord.status = allFull?'done':'partial';

  // 1. Save to wmsFulfillHistory (WMS History tab)
  const histId = 'wms-ful-'+smId+'-'+Date.now();
  const histRecord = {
    id:histId, type:'fulfill',
    smId:realSmId, smName:ord.name||realSmId,
    fulfilledBy:currentUser.name,
    fulfilledAt:now,
    items:fulfilledItems,
    totalBn:total,
    status:allFull?'full':'partial'
  };
  if(!window.wmsFulfillHistory) window.wmsFulfillHistory=[];
  window.wmsFulfillHistory.unshift(histRecord);
  fetch(SB_URL+'/rest/v1/greena_settings',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{key:'wmsFulfillHistory',value:JSON.stringify(window.wmsFulfillHistory)}])
  }).catch(function(){});

  // 2. Save to greena_stock_history so salesman My History icon shows it
  const smHistId = 'wms-disp-'+smId+'-'+Date.now();
  const smHistItems = {};
  Object.entries(fulfilledItems).forEach(function(e){
    const bpb = getCatBpbForProduct(e[0]);
    smHistItems[e[0]] = {box: Math.floor(e[1]/bpb), bunch: e[1]%bpb};
  });
  const smHistRecord = {
    id: smHistId,
    userId: realSmId,
    userName: ord.name||realSmId,
    items: smHistItems,
    doneAt: now,
    stockDate: nowDate,
    source: 'wms-dispatch',
    dispatchedBy: currentUser.name,
    status: allFull?'full':'partial',
    totalBn: total
  };
  fetch(SB_URL+'/rest/v1/greena_stock_history',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:smHistId, data:smHistRecord}])
  }).catch(function(){});
  // Also update local _stockHistoryDB
  if(!window._stockHistoryDB) window._stockHistoryDB=[];
  window._stockHistoryDB.unshift(smHistRecord);

  saveStockToDB();
  saveStockOrders();

  WMS_HIST.unshift({
    type:'fulfill',
    desc:'Dispatched — '+(ord.name||smId)+' ('+(allFull?'Full':'Partial')+')',
    meta:total+' Bn · By '+currentUser.name+' · '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
    qty:'-'+total+' Bn'
  });

  toast(allFull?'✅ Dispatched! Order removed from queue.':'🔵 Partial dispatch saved!');
  // Re-render orders tab badge
  renderStockPage();
}

function wmsFulfillAll(){
  const smIds = Object.keys(stockOrders||{}).filter(function(id){
    return stockOrders[id]&&stockOrders[id].submittedAt&&!stockOrders[id].fulfilledAt;
  });
  smIds.forEach(function(id){wmsFulfillOrder(id);});
}

function wmsStartAudit(){
  const date=document.getElementById('wms-na-date')?.value;

  if(!date||!auditor){toast('⚠️ Date and Auditor required.');return;}
  const items=[];
  cats.forEach(function(cat){
    if(catF&&cat.label!==catF) return;
    cat.items.forEach(function(item){
      const raw=stockData[item.name];
      const stk=raw&&typeof raw==='object'?raw:{box:0,bunch:typeof raw==='number'?raw:0};
      const bpb=item.packRate||cat.bunchesPerBox||25;
      const cur=(stk.box||0)*bpb+(stk.bunch||0);
      items.push({name:item.name,emoji:item.emoji,cat:cat.label,catColor:cat.color,system:cur,physical:null,status:'pending',reason:'',notes:''});
    });
  });
  wmsCurrentAudit={id:ref,date:wmsFmtDate(date),rawDate:date,auditor,notes,status:'progress',items,matched:0,adjusted:0,skipped:0,net:0};
  WMS_AUDITS.unshift(wmsCurrentAudit);
  wmsGoAudit('count');

        +' style="'+inpStyle+'"/>'
        +'</td>'
        +'<td style="padding:8px 10px;text-align:center" id="wms-diff-'+sid+'">'+wmsAuditDiffHtml(diff)+'</td>'
        +'<td style="padding:8px 10px;text-align:center" id="wms-stat-'+sid+'">'+wmsAuditStatCell(item.status)+'</td>'
        +'</tr>';
    });
    if(catRows){
      rows+='<tr style="background:#f8fafc"><td colspan="5" style="padding:7px 14px;font-size:11px;font-weight:700;color:'+cat.color+';text-transform:uppercase;letter-spacing:0.05em">▸ '+cat.label+'</td></tr>';
      rows+=catRows;
    }
  });

  tbody.innerHTML = rows||'<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text2)">No products match filter.</td></tr>';
}

function wmsAuditDiffHtml(diff){
  if(diff===null) return '<span style="color:#cbd5e1;font-size:12px">—</span>';
  if(diff===0) return '<span style="color:#059669;font-weight:700;font-size:13px">✅ 0</span>';
  if(diff>0) return `<span style="background:#dcfce7;color:#059669;font-weight:800;padding:2px 9px;border-radius:6px;font-size:12px">+${diff}</span>`;
  return `<span style="background:#fee2e2;color:#dc2626;font-weight:800;padding:2px 9px;border-radius:6px;font-size:12px">${diff}</span>`;
}

function wmsAuditStatCell(s){
  if(s==='pending') return '<span style="color:#94a3b8;font-size:12px">—</span>';
  if(s==='matched') return '<span style="background:#dcfce7;color:#15803d;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700">✅ Match</span>';
  if(s==='excess') return '<span style="background:#dcfce7;color:#15803d;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700">📈 Excess</span>';
  if(s==='short') return '<span style="background:#fee2e2;color:#dc2626;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700">📉 Short</span>';
  if(s==='resolved') return '<span style="background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700">🔧 Resolved</span>';
  if(s==='skipped') return '<span style="background:#f1f5f9;color:#64748b;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700">⏭️ Skipped</span>';
  return '';
}

function wmsOnCountChange(inp){
  const name=inp.dataset.name;
  const val=parseInt(inp.value);
  const sid=name.replace(/\W+/g,'_');
  const item=wmsCurrentAudit.items.find(i=>i.name===name);if(!item) return;
  if(isNaN(val)||inp.value===''){
    item.physical=null;item.status='pending';
    inp.style.cssText+='border-color:var(--border);background:#fff';
  } else {
    item.physical=val;
    const diff=val-item.system;
    item.status=diff===0?'matched':diff>0?'excess':'short';
    inp.style.cssText+=diff===0?'border-color:#10b981;background:#f0fdf4':diff>0?'border-color:#10b981;background:#ecfdf5':'border-color:#ef4444;background:#fef2f2';
  }
  const diff=item.physical!==null?item.physical-item.system:null;
  const diffEl=document.getElementById('wms-diff-'+sid);
  const statEl=document.getElementById('wms-stat-'+sid);
  if(diffEl) diffEl.innerHTML=wmsAuditDiffHtml(diff);
  if(statEl) statEl.innerHTML=wmsAuditStatCell(item.status);
}

function wmsFinishCounting(){
  const counted=wmsCurrentAudit.items.filter(i=>i.physical!==null).length;
  if(!counted){toast('⚠️ Count at least one product.');return;}
  if(counted<wmsCurrentAudit.items.length){
    if(!confirm('Some products uncounted. Continue? They will be marked Skipped.')) return;
    wmsCurrentAudit.items.forEach(function(i){if(i.physical===null) i.status='skipped';});
  }
  wmsGoAudit('summary');
}

function wmsStartResolve(){
  wmsResolveItems=wmsCurrentAudit.items.filter(i=>i.status==='short'||i.status==='excess');
  if(!wmsResolveItems.length){toast('No mismatches to resolve.');return;}
  wmsResolveIdx=0;wmsGoAudit('resolve');
}

function wmsAuditResolve(body){
  const item=wmsResolveItems[wmsResolveIdx];
  const diff=item.physical-item.system;
  const isShort=diff<0;

  const dots=wmsResolveItems.map(function(m,i){
    const w=i===wmsResolveIdx?28:10;
    const bg=m.status==='resolved'?'#059669':m.status==='skipped'?'#94a3b8':i===wmsResolveIdx?'#4f46e5':'#e8edf5';
    return `<div style="width:${w}px;height:8px;border-radius:99px;background:${bg};transition:all 0.3s;cursor:pointer" onclick="wmsJumpResolve(${i})"></div>`;
  }).join('');

  const opts=isShort?[
    {val:'short_box',ico:'📦',lbl:'Short in Box',sub:'Damaged or missing box'},
    {val:'human_error',ico:'👤',lbl:'Human Error',sub:'Miscounting or entry mistake'},
  ]:[
    {val:'excess_box',ico:'📦',lbl:'Excess in Box',sub:'Extra box received'},
    {val:'excess_stems',ico:'🌿',lbl:'Excess Stems',sub:'Extra stems in boxes'},
  ];

  body.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="font-size:14px;font-weight:700;color:var(--text)">🔧 Resolve Mismatches</div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:12px;color:var(--text2)">${wmsResolveIdx+1} / ${wmsResolveItems.length}</span>
        <button type="button" class="btn btn-ghost btn-sm" onclick="wmsGoAudit('summary')">← Summary</button>
      </div>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px">${dots}</div>
    <div style="max-width:540px;margin:0 auto">
    <div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,0.08)">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)">
        <div style="width:48px;height:48px;border-radius:12px;background:#f8fafc;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">${item.emoji}</div>
        <div><div style="font-size:17px;font-weight:800;color:var(--text)">${item.name}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:3px">${item.cat}</div></div>
      </div>
      <div style="border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;background:${isShort?'#fef2f2':'#f0fdf4'};border:1.5px solid ${isShort?'#fca5a5':'#86efac'}">
        <div style="font-size:32px">${isShort?'📉':'📈'}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:800;color:${isShort?'#dc2626':'#059669'}">${isShort?'Short':'Excess'}: ${Math.abs(diff)} Bn</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">System: ${item.system} Bn → Physical: ${item.physical} Bn</div>
        </div>
        <div style="font-size:28px;font-weight:900;color:${isShort?'#dc2626':'#059669'}">${diff>0?'+':''}${diff}</div>
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Reason *</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
        ${opts.map(function(o){
          const sel=item.reason===o.val;
          const selCls=sel?(isShort?'border-color:#dc2626;background:#fef2f2':'border-color:#059669;background:#f0fdf4'):'';
          return `<div style="border:2px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;text-align:center;transition:all 0.18s;${selCls}" data-rval="${o.val}" ${sel?'data-selected="1"':''} onclick="wmsSelectReason(this,'${isShort?'short':'excess'}')">
            <div style="font-size:24px;margin-bottom:6px">${o.ico}</div>
            <div class="reason-lbl" style="font-size:12px;font-weight:700;color:var(--text)">${o.lbl}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:2px">${o.sub}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Notes (optional)</div>
        <textarea id="wms-res-notes" rows="3" placeholder="Describe what happened in detail..." style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:Inter,sans-serif;resize:none;outline:none">${item.notes||''}</textarea>
      </div>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn btn-ghost btn-sm" onclick="wmsSkipResolve()" style="flex:1">⏭️ Skip</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="wmsPrevResolve()" style="flex:1" ${wmsResolveIdx===0?'disabled style="opacity:0.4"':''}>← Prev</button>
        <button type="button" class="btn btn-purple" onclick="wmsApplyResolve()" style="flex:2">✅ Apply & Next</button>
      </div>
    </div></div>`;
}

function wmsSelectReason(el, side){
  document.querySelectorAll('[data-rval]').forEach(function(o){
    o.style.borderColor='var(--border)';
    o.style.background='#fff';
    o.removeAttribute('data-selected');
  });
  el.style.borderColor=side==='short'?'#dc2626':'#059669';
  el.style.background=side==='short'?'#fef2f2':'#f0fdf4';
  el.setAttribute('data-selected','1');
}

function wmsApplyResolve(){
  const item=wmsResolveItems[wmsResolveIdx];
  const sel=document.querySelector('[data-rval][data-selected="1"]');
  const notes=document.getElementById('wms-res-notes')?.value.trim()||'';
  if(!sel){toast('⚠️ Select a reason.');return;}
  item.reason=sel.dataset.rval;
  item.notes=notes;
  item.status='resolved';

  // Update live stock immediately
  if(!stockData[item.name]||typeof stockData[item.name]!=='object') stockData[item.name]={box:0,bunch:0};
  const bpb=getCatBpbForProduct(item.name);
  stockData[item.name].box=Math.floor(item.physical/bpb);
  stockData[item.name].bunch=item.physical%bpb;
  saveStockToDB();

  const diff=item.physical-item.system;
  const reasonLbl=sel.querySelector('.reason-lbl')?.textContent||sel.querySelector('div:nth-child(2)')?.textContent||item.reason;
  WMS_HIST.unshift({
    type:'adjust',
    desc:'Adjustment — '+item.name+' ('+reasonLbl+')',
    meta:'Audit '+wmsCurrentAudit.id+' · By '+currentUser.name,
    qty:(diff>0?'+':'')+diff+' Bn'
  });
  toast('✅ '+item.name+' updated — '+(diff>0?'+':'')+diff+' Bn in Live Stock!');
  wmsNextResolve();
}

function wmsSkipResolve(){wmsResolveItems[wmsResolveIdx].status='skipped';wmsNextResolve();}
function wmsNextResolve(){if(wmsResolveIdx<wmsResolveItems.length-1){wmsResolveIdx++;wmsGoAudit('resolve');}else{wmsFinishResolve();}}
function wmsPrevResolve(){if(wmsResolveIdx>0){wmsResolveIdx--;wmsGoAudit('resolve');}}
function wmsJumpResolve(i){wmsResolveIdx=i;wmsGoAudit('resolve');}

function wmsFinishResolve(){
  const a=wmsCurrentAudit;
  a.status='complete';
  a.matched=a.items.filter(i=>i.status==='matched').length;
  a.adjusted=a.items.filter(i=>i.status==='resolved').length;
  a.skipped=a.items.filter(i=>i.status==='skipped'||i.status==='short'||i.status==='excess').length;
  a.net=a.items.filter(i=>i.physical!==null).reduce((x,i)=>x+(i.physical-i.system),0);
  WMS_HIST.unshift({type:'audit',desc:'Audit Complete — '+a.id,meta:a.adjusted+' adjustments · By '+a.auditor,qty:(a.net>=0?'+':'')+a.net+' Bn net'});
  wmsGoAudit('complete');
}

        <button type="button" class="btn btn-ghost btn-sm" onclick="wmsGoAudit('summary')">📄 View Report</button>
        <button type="button" class="btn btn-green btn-sm" onclick="wmsExportAuditCSV()">⬇️ Download CSV</button>
      </div>

function wmsExportAuditCSV(){
  if(!wmsCurrentAudit){toast('No audit selected.');return;}
  const a=wmsCurrentAudit;
  let csv='Green WMS — Audit Report\nAudit ID,'+a.id+'\nDate,'+a.date+'\nAuditor,'+a.auditor+'\n\n';
  csv+='Category,Product,System (Bn),Physical (Bn),Difference,Status,Reason,Notes\n';
  a.items.forEach(function(i){
    const diff=i.physical!==null?i.physical-i.system:'';
    csv+=`"${i.cat}","${i.name}",${i.system},${i.physical!==null?i.physical:''},"${diff}","${i.status}","${i.reason}","${i.notes}"\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const el=document.createElement('a');el.href=URL.createObjectURL(blob);
  el.download='Audit_'+a.id+'.csv';el.click();
  toast('⬇️ CSV Downloaded!');
}

function wmsWireReportFilters(){
  const month = document.getElementById('wms-rpt-month');
  const auditor = document.getElementById('wms-rpt-auditor');
  const status = document.getElementById('wms-rpt-status');
  if(month) month.addEventListener('change', function(){window.wmsReportFilters.month=this.value;wmsRenderReports(document.getElementById('wms-body'));});
  if(auditor) auditor.addEventListener('change', function(){window.wmsReportFilters.auditor=this.value;wmsRenderReports(document.getElementById('wms-body'));});
  if(status) status.addEventListener('change', function(){window.wmsReportFilters.status=this.value;wmsRenderReports(document.getElementById('wms-body'));});
}

function wmsRenderHistory(body){

    +'<div style="position:absolute;top:0;left:0;right:0;height:3px;background:#059669"></div>'

    +'</div>'

    const fmtDate=date!=='unknown'?new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):date;
    const fullOrders=dayOrders.filter(function(h){return h.status==='full';}).length;

function wmsDownloadDayExcel(date){
  const hist=window.wmsFulfillHistory||[];
  const dayOrders=hist.filter(function(h){return h.fulfilledAt&&h.fulfilledAt.startsWith(date);});
  if(!dayOrders.length){toast('No data for this date.');return;}

  const fmtDate=new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});

  // Group by salesman
  const bySM={};
  dayOrders.forEach(function(h){
    const key=h.smId||h.smName||'Unknown';
    if(!bySM[key]) bySM[key]={name:h.smName||h.smId||'Unknown',orders:[]};
    bySM[key].orders.push(h);
  });

  // Try XLSX (SheetJS) if available
  if(typeof XLSX!=='undefined'){
    const wb=XLSX.utils.book_new();

    // Summary sheet first
    const summaryRows=[
      ['Greena WMS — Dispatch Report'],
      ['Date: '+fmtDate],
      ['Generated: '+new Date().toLocaleString('en-GB')],
      [],
      ['Salesman','Total Bn','Orders','Full','Partial']
    ];
    Object.values(bySM).forEach(function(sm){
      const totalBn=sm.orders.reduce(function(a,o){return a+(o.totalBn||0);},0);
      const full=sm.orders.filter(function(o){return o.status==='full';}).length;
      const partial=sm.orders.filter(function(o){return o.status==='partial';}).length;
      summaryRows.push([sm.name,totalBn,sm.orders.length,full,partial]);
    });
    summaryRows.push([]);
    const grandTotal=dayOrders.reduce(function(a,h){return a+(h.totalBn||0);},0);
    summaryRows.push(['GRAND TOTAL',grandTotal,dayOrders.length,'','']);
    const summaryWs=XLSX.utils.aoa_to_sheet(summaryRows);
    summaryWs['!cols']=[{wch:20},{wch:12},{wch:10},{wch:8},{wch:8}];
    XLSX.utils.book_append_sheet(wb,summaryWs,'Summary');

    // One sheet per salesman
    Object.values(bySM).forEach(function(sm){
      const rows=[
        ['Salesman: '+sm.name],
        ['Date: '+fmtDate],
        [],
        ['Category','Product','Dispatched Bn','Box Equivalent']
      ];

      // Aggregate all items
      const allItems={};
      sm.orders.forEach(function(ord){
        Object.entries(ord.items||{}).forEach(function(e){
          if(!allItems[e[0]]) allItems[e[0]]=0;
          allItems[e[0]]+=e[1];
        });
      });

      cats.forEach(function(cat){
        const catItems=cat.items.filter(function(i){return allItems[i.name];});
        if(!catItems.length) return;
        catItems.forEach(function(item){
          const bn=allItems[item.name];
          const bpb=getCatBpbForProduct(item.name);
          rows.push([cat.label,item.name,bn,+(bn/bpb).toFixed(1)]);
        });
      });

      rows.push([]);
      const totalBn=sm.orders.reduce(function(a,o){return a+(o.totalBn||0);},0);
      rows.push(['','TOTAL',totalBn,'']);
      rows.push([]);
      rows.push(['Dispatch Times:',sm.orders.map(function(o){
        return new Date(o.fulfilledAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      }).join(', '),'','']);

      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:18},{wch:22},{wch:14},{wch:14}];
      // Safe sheet name — max 31 chars, no special chars
      const sheetName=sm.name.replace(/[\\\/\?\*\[\]:]/g,'').substring(0,31);
      XLSX.utils.book_append_sheet(wb,ws,sheetName);
    });

    XLSX.writeFile(wb,'Dispatch_'+date+'.xlsx');
    toast('⬇️ Excel downloaded — '+Object.keys(bySM).length+' sheets!');
    return;
  }

  // Fallback: CSV if XLSX not available
  let csv='Greena WMS — Dispatch Report\nDate: '+fmtDate+'\n\n';
  Object.values(bySM).forEach(function(sm){
    csv+='Salesman: '+sm.name+'\nCategory,Product,Dispatched Bn,Box Equivalent\n';
    const allItems={};
    sm.orders.forEach(function(ord){
      Object.entries(ord.items||{}).forEach(function(e){
        if(!allItems[e[0]]) allItems[e[0]]=0;
        allItems[e[0]]+=e[1];
      });
    });
    cats.forEach(function(cat){
      const catItems=cat.items.filter(function(i){return allItems[i.name];});
      catItems.forEach(function(item){
        const bn=allItems[item.name];
        csv+='"'+cat.label+'","'+item.name+'",'+bn+','+(bn/getCatBpbForProduct(item.name)).toFixed(1)+'\n';
      });
    });
    csv+=',TOTAL,'+sm.orders.reduce(function(a,o){return a+(o.totalBn||0);},0)+',\n\n';
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Dispatch_'+date+'.csv';a.click();
  toast('⬇️ Downloaded (CSV — XLSX not available)');
}

function wmsDeleteDayHistory(date){
  if(!confirm('Delete all dispatch records for '+date+'?')) return;
  window.wmsFulfillHistory=(window.wmsFulfillHistory||[]).filter(function(h){
    return !h.fulfilledAt||!h.fulfilledAt.startsWith(date);
  });
  fetch(SB_URL+'/rest/v1/greena_settings',{
    method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{key:'wmsFulfillHistory',value:JSON.stringify(window.wmsFulfillHistory)}])
  }).catch(function(){});
  toast('🗑️ Records deleted for '+date);
  wmsRenderHistory(document.getElementById('wms-body'));
}

function wmsDeleteHistoryRecord(id){
  if(!confirm('Delete this dispatch record? This cannot be undone.')) return;
  const hist=(window.wmsFulfillHistory||[]).find(function(h){return h.id===id;});
  window.wmsFulfillHistory=(window.wmsFulfillHistory||[]).filter(function(h){return h.id!==id;});
  fetch(SB_URL+'/rest/v1/greena_settings',{
    method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{key:'wmsFulfillHistory',value:JSON.stringify(window.wmsFulfillHistory)}])
  }).catch(function(){});
  toast('🗑️ Record deleted.');
  wmsRenderHistory(document.getElementById('wms-body'));
}




function showDrillDown(productName, smId, smName, period){
  // Collect all raw order records for this product + salesman
  const rows=[];
  const bpb=getCatBpbForProduct(productName);

  // From regular orders
  regularOrders.filter(function(o){return o.submittedAt;}).forEach(function(ord){
    if(smId!=='all'&&ord.userId!==smId) return;
    const qty=ord.items&&ord.items[productName];
    if(!qty||(!qty.box&&!qty.bunch)) return;
    const bunches=(qty.box||0)*bpb+(qty.bunch||0);
    if(!bunches) return;
    rows.push({date:ord.date,type:'Regular',smName:ord.userName,box:qty.box||0,bunch:qty.bunch||0,bunches:bunches});
  });

  // From arrivals
  const histDB=lsGet('g_history',[]);
  [...arrivalsDB,...histDB].forEach(function(arr){
    Object.keys(arr.orders||{}).forEach(function(sid){
      if(smId!=='all'&&sid!==smId) return;
      const smOrder=arr.orders[sid];
      if(!smOrder||sid==='_submittedAt') return;
      const qty=smOrder[productName];
      if(!qty||(!qty.box&&!qty.bunch)) return;
      const bunches=(qty.box||0)*bpb+(qty.bunch||0);
      if(!bunches) return;
      const smNameActual=creds[sid]?creds[sid].name:sid;
      rows.push({date:arr.arrDate,type:'Arrival',smName:smNameActual,box:qty.box||0,bunch:qty.bunch||0,bunches:bunches});
    });
  });

  if(!rows.length){toast('⚠️ No data found.');return;}

  // Filter by selected period if not showing all
  function getWeekKey(dateStr){
    const d=new Date(dateStr);
    const day=d.getDay();
    const diffToFri=((day-5)+7)%7;
    const fri=new Date(d);fri.setDate(d.getDate()-diffToFri);
    const thu=new Date(fri);thu.setDate(fri.getDate()+6);
    const fmt=function(dt){return dt.getDate()+' '+'JanFebMarAprMayJunJulAugSepOctNovDec'.match(/.{3}/g)[dt.getMonth()];};
    const jan1=new Date(fri.getFullYear(),0,1);
    const wn=Math.ceil(((fri-jan1)/86400000+jan1.getDay()+1)/7);
    return 'W'+String(wn).padStart(2,'0')+' ('+fmt(fri)+' - '+fmt(thu)+')';
  }
  function getMonthKey(dateStr){
    const d=new Date(dateStr);
    return 'JanFebMarAprMayJunJulAugSepOctNovDec'.match(/.{3}/g)[d.getMonth()]+' '+d.getFullYear();
  }

  // Filter to selected period
  const filtRows=rows.filter(function(r){
    const pk=window.analyticsTab==='weekly'?getWeekKey(r.date):getMonthKey(r.date);
    return pk===period;
  }).sort(function(a,b){return new Date(a.date)-new Date(b.date);});

  if(!filtRows.length){toast('⚠️ No data for this period.');return;}

  const totalBn=filtRows.reduce(function(a,r){return a+r.bunches;},0);
  const src=lsGet('g_photos',{})[productName]||photos[productName]||'';

  let html='<div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem">'
    +(src?'<img src="'+src+'" style="width:40px;height:40px;border-radius:8px;object-fit:cover"/>':'<span style="font-size:28px">🌸</span>')
    +'<div>'
    +'<div style="font-size:15px;font-weight:700;color:var(--text)">'+productName+'</div>'
    +'<div style="font-size:12px;color:var(--text2)">'+(smId==='all'?'All Salesman':smName)+' · '+period+'</div>'
    +'</div>'
    +'<div style="margin-left:auto;text-align:right">'
    +'<div style="font-size:20px;font-weight:800;color:#15803d">'+totalBn+'</div>'
    +'<div style="font-size:10px;color:var(--text2)">Total Bunches</div>'
    +'</div>'
    +'</div>'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
    +'<thead><tr style="background:linear-gradient(90deg,#1e1b4b,#312e81)">'
    +'<th style="padding:8px 12px;text-align:left;color:#fff;font-size:11px">📅 Date</th>'
    +(smId==='all'?'<th style="padding:8px 12px;text-align:left;color:#fff;font-size:11px">👤 Salesman</th>':'')
    +'<th style="padding:8px 12px;text-align:center;color:#fff;font-size:11px">Type</th>'
    +'<th style="padding:8px 12px;text-align:center;color:#fff;font-size:11px">Box</th>'
    +'<th style="padding:8px 12px;text-align:center;color:#fff;font-size:11px">Bunch</th>'
    +'<th style="padding:8px 12px;text-align:center;color:#fff;font-size:11px">🌸 Bunches</th>'
    +'</tr></thead><tbody>';

  filtRows.forEach(function(r){
    html+='<tr style="border-bottom:1px solid #f1f5f9">'
      +'<td style="padding:8px 12px;font-weight:500">'+fmtDate(r.date)+'</td>'
      +(smId==='all'?'<td style="padding:8px 12px;color:var(--text2)">'+r.smName+'</td>':'')
      +'<td style="padding:8px 12px;text-align:center">'
      +'<span style="background:'+(r.type==='Arrival'?'#dbeafe':'#dcfce7')+';color:'+(r.type==='Arrival'?'#1e40af':'#15803d')+';padding:2px 10px;border-radius:99px;font-size:10px;font-weight:700">'+r.type+'</span>'
      +'</td>'
      +'<td style="padding:8px 12px;text-align:center;color:#5b21b6;font-weight:600">'+(r.box||'—')+'</td>'
      +'<td style="padding:8px 12px;text-align:center;color:#15803d;font-weight:600">'+(r.bunch||'—')+'</td>'
      +'<td style="padding:8px 12px;text-align:center;font-weight:700;color:#15803d">'+r.bunches+'</td>'
      +'</tr>';
  });

  // Total row
  const tBox=filtRows.reduce(function(a,r){return a+r.box;},0);
  const tBunch=filtRows.reduce(function(a,r){return a+r.bunch;},0);
  html+='<tfoot><tr style="background:#f8fafc;border-top:2px solid var(--border)">'
    +'<td colspan="'+(smId==='all'?'3':'2')+'" style="padding:8px 12px;font-weight:700">Total</td>'
    +'<td style="padding:8px 12px;text-align:center;font-weight:700;color:#5b21b6">'+tBox+'</td>'
    +'<td style="padding:8px 12px;text-align:center;font-weight:700;color:#15803d">'+tBunch+'</td>'
    +'<td style="padding:8px 12px;text-align:center;font-weight:700;color:#15803d">'+totalBn+'</td>'
    +'</tr></tfoot></tbody></table>';

  showModal('<h3>📊 Order History</h3>'+html);
}

function getCatBpbForProduct(productName){
  for(var i=0;i<cats.length;i++){
    var cat=cats[i];
    for(var j=0;j<cat.items.length;j++){
      if(cat.items[j].name===productName) return cat.items[j].packRate||cat.bunchesPerBox||25;
    }
  }
  return 25;
}

function anWeekKey(dateStr){
  if(!dateStr) return null;
  try{
    const d=new Date(dateStr);if(isNaN(d)) return null;
    const day=d.getDay();
    const diffToFri=((day-5)+7)%7;
    const fri=new Date(d);fri.setDate(d.getDate()-diffToFri);
    const thu=new Date(fri);thu.setDate(fri.getDate()+6);
    const fmt=function(dt){return dt.getDate()+' '+'JanFebMarAprMayJunJulAugSepOctNovDec'.match(/.{3}/g)[dt.getMonth()];};
    const jan1=new Date(fri.getFullYear(),0,1);
    const wn=Math.ceil(((fri-jan1)/86400000+jan1.getDay()+1)/7);
    return 'W'+String(wn).padStart(2,'0')+' ('+fmt(fri)+' – '+fmt(thu)+')';
  }catch(e){return null;}
}

function anMonthKey(dateStr){
  if(!dateStr) return null;
  try{
    const d=new Date(dateStr);if(isNaN(d)) return null;
    return 'JanFebMarAprMayJunJulAugSepOctNovDec'.match(/.{3}/g)[d.getMonth()]+' '+d.getFullYear();
  }catch(e){return null;}
}

function anFmtDate(d){
  if(!d) return '—';
  try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}
}

// ── ORDERS REPORT ───────────────────────────────────────────────
if(!window.anOrdersState) window.anOrdersState={period:'weekly',week:'',month:'',sm:'all',source:'all'};

function anRenderOrders(body,el){
  const state=window.anOrdersState;
  const photos=lsGet('g_photos',{})||{};

  // ── DATA COLLECTION ──────────────────────────────────────────
  // allData[name][week/month][smId] = {bn, ordBn, arrBn}
  // ordBn = regular+wms orders, arrBn = arrival orders
  const allData={};
  const allWeeks=new Set(), allMonths=new Set();

  function addEntry(name,qty,smId,smName,dateStr,src){
    if(!qty||(!qty.box&&!qty.bunch)) return;
    if(!name||!dateStr) return;
    const wk=anWeekKey(dateStr), mo=anMonthKey(dateStr);
    if(!wk||!mo) return;
    allWeeks.add(wk); allMonths.add(mo);
    const bpb=getCatBpbForProduct(name);
    const bn=(qty.box||0)*bpb+(qty.bunch||0);
    if(!bn) return;
    if(!allData[name]) allData[name]={weeks:{},months:{}};
    ['weeks/'+wk,'months/'+mo].forEach(function(key){
      const[type,period]=key.split('/');
      if(!allData[name][type][period]) allData[name][type][period]={};
      if(!allData[name][type][period][smId]) allData[name][type][period][smId]={bn:0,ordBn:0,arrBn:0,name:smName};
      allData[name][type][period][smId].bn+=bn;
      if(src==='arrival') allData[name][type][period][smId].arrBn+=bn;
      else allData[name][type][period][smId].ordBn+=bn;
    });
  }

  // 1. Regular Orders
  if(state.source==='all'||state.source==='regular'){
    regularOrders.filter(function(o){return o.submittedAt;}).forEach(function(ord){
      const smName=ord.userName||creds[ord.userId]?.name||ord.userId;
      Object.entries(ord.items||{}).forEach(function(e){
        addEntry(e[0],e[1],ord.userId,smName,ord.date,'regular');
      });
    });
  }

  // 2. Arrivals + History
  if(state.source==='all'||state.source==='arrival'){
    const histDB=window._historyDB||lsGet('g_history',[]);
    [...arrivalsDB,...histDB].forEach(function(arr){
      Object.keys(arr.orders||{}).forEach(function(sid){
        if(sid==='_submittedAt') return;
        const smOrder=arr.orders[sid];
        if(!smOrder) return;
        const smName=creds[sid]?creds[sid].name:sid;
        Object.entries(smOrder).forEach(function(e){
          if(e[0]==='_submittedAt') return;
          addEntry(e[0],e[1],sid,smName,arr.arrDate,'arrival');
        });
      });
    });
  }

  // 3. WMS Stock History
  if(state.source==='all'||state.source==='wms'){
    (window._stockHistoryDB||[]).forEach(function(h){
      if(!h.userId||!h.doneAt) return;
      const smName=creds[h.userId]?.name||h.userName||h.userId;
      Object.entries(h.items||{}).forEach(function(e){
        addEntry(e[0],e[1],h.userId,smName,h.stockDate||h.doneAt,'wms');
      });
    });
  }

  // ── PERIOD SETUP ─────────────────────────────────────────────
  const weeksSorted=[...allWeeks].sort(function(a,b){return b.localeCompare(a);});
  const monthsSorted=[...allMonths].sort(function(a,b){return b.localeCompare(a);});
  if(!state.week&&weeksSorted.length) state.week=weeksSorted[0];
  if(!state.month&&monthsSorted.length) state.month=monthsSorted[0];
  const periods=state.period==='weekly'?weeksSorted:monthsSorted;
  const selPeriod=state.period==='weekly'?state.week:state.month;

  const smList=Object.keys(creds).sort().map(function(id){return {id,name:creds[id]?.name||id};});
  const catFilter=state.cat||'';
  const showArrOrd=!!state.showArrOrd; // show arrival vs ordered split

  // Topbar
  const actions=document.getElementById('an-topbar-actions');
  if(actions) actions.innerHTML='<button type="button" onclick="anDownloadOrdersExcel()" style="background:#fff;border:1.5px solid #e2e8f0;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;color:#475569">⬇️ Excel</button>';

  // ── CONTROLS BAR ─────────────────────────────────────────────
  let html='<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,0.05)">'
    // Weekly/Monthly
    +'<div style="display:flex;gap:6px">'
    +['weekly','monthly'].map(function(p){
      const active=state.period===p;
      return '<button type="button" data-anperiod="'+p+'" style="padding:7px 14px;border-radius:8px;border:1.5px solid '+(active?'transparent':'#e2e8f0')+';font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;background:'+(active?'linear-gradient(135deg,#4f46e5,#6366f1)':'#f8fafc')+';color:'+(active?'#fff':'#64748b')+'">'+(p==='weekly'?'📅 Weekly':'📆 Monthly')+'</button>';
    }).join('')
    +'</div>'
    // Source filter
    +'<div style="display:flex;gap:5px;flex-wrap:wrap">'
    +[['all','All'],['regular','🛒 Regular'],['arrival','🌸 Arrival'],['wms','📦 WMS']].map(function(s){
      const active=state.source===s[0];
      return '<button type="button" data-ansource="'+s[0]+'" style="padding:6px 10px;border-radius:8px;border:1.5px solid '+(active?'#4f46e5':'#e2e8f0')+';font-size:11px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;background:'+(active?'#ede9fe':'#f8fafc')+';color:'+(active?'#4f46e5':'#64748b')+'">'+s[1]+'</button>';
    }).join('')
    +'</div>'
    // Category filter
    +'<div><div style="font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:3px">CATEGORY</div>'
    +'<select id="an-cat-sel" style="border:1.5px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:12px;font-family:Inter,sans-serif;background:#fff;outline:none">'
    +'<option value="">All Categories</option>'
    +cats.map(function(c){return '<option value="'+c.label+'"'+(catFilter===c.label?' selected':'')+'>'+c.label+'</option>';}).join('')
    +'</select></div>'
    // SM filter
    +'<div><div style="font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:3px">SALESMAN</div>'
    +'<select id="an-sm-sel" style="border:1.5px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:12px;font-family:Inter,sans-serif;background:#fff;outline:none">'
    +'<option value="all">All</option>'
    +smList.map(function(s){return '<option value="'+s.id+'"'+(state.sm===s.id?' selected':'')+'>'+s.name+'</option>';}).join('')
    +'</select></div>'
    // Arrival vs Ordered toggle
    +(state.source==='all'?
      '<button type="button" data-antoggle="arrord" style="padding:6px 12px;border-radius:8px;border:1.5px solid '+(showArrOrd?'#059669':'#e2e8f0')+';font-size:11px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;background:'+(showArrOrd?'#dcfce7':'#f8fafc')+';color:'+(showArrOrd?'#15803d':'#64748b')+';align-self:flex-end">🔀 Ord vs Arr</button>'
    :'')
    +'</div>';

  // Period tabs
  if(periods.length){
    html+='<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch">';
    periods.slice(0,15).forEach(function(p){
      const active=p===selPeriod;
      html+='<button type="button" data-anperiodsel="'+p+'" style="padding:8px 14px;border-radius:10px;border:1.5px solid '+(active?'transparent':'#e2e8f0')+';font-size:12px;font-weight:'+(active?'700':'500')+';cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap;flex-shrink:0;background:'+(active?'linear-gradient(135deg,#1e1b4b,#312e81)':'#fff')+';color:'+(active?'#fff':'#475569')+'">'+p+'</button>';
    });
    html+='</div>';
  }

  // ── PERIOD DATA ───────────────────────────────────────────────
  const periodData={};
  let grandBn=0, grandOrdBn=0, grandArrBn=0;
  let grandProds=0, topProd='', topBn=0;
  const smTotals={}, smNames={};
  const catCols={}; // catLabel → {bn, ordBn, arrBn}

  const filteredCats=cats.filter(function(c){return !catFilter||c.label===catFilter;});

  Object.entries(allData).forEach(function(e){
    const name=e[0], d=e[1];
    // Check if product belongs to filtered cat
    const itemCat=cats.find(function(c){return c.items.find(function(i){return i.name===name;});});
    if(!itemCat) return;
    if(catFilter&&itemCat.label!==catFilter) return;

    const pData=state.period==='weekly'?d.weeks[selPeriod]:d.months[selPeriod];
    if(!pData) return;
    const filtered={};
    Object.entries(pData).forEach(function(e2){
      if(state.sm==='all'||e2[0]===state.sm){
        filtered[e2[0]]=e2[1];
        smNames[e2[0]]=e2[1].name;
      }
    });
    const totalBn=Object.values(filtered).reduce(function(a,v){return a+v.bn;},0);
    const totalOrd=Object.values(filtered).reduce(function(a,v){return a+v.ordBn;},0);
    const totalArr=Object.values(filtered).reduce(function(a,v){return a+v.arrBn;},0);
    if(totalBn===0) return;
    periodData[name]=filtered;
    grandBn+=totalBn; grandOrdBn+=totalOrd; grandArrBn+=totalArr;
    grandProds++;
    if(totalBn>topBn){topBn=totalBn;topProd=name;}
    if(!catCols[itemCat.label]) catCols[itemCat.label]={bn:0,ordBn:0,arrBn:0};
    catCols[itemCat.label].bn+=totalBn;
    catCols[itemCat.label].ordBn+=totalOrd;
