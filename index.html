function renderForecastTab(allData,weeksSorted,monthsSorted,allPhotos){
  const smId=window.analyticsSM||'all';
  const last4=weeksSorted.slice(0,4);
  if(!last4.length) return '<div class="no-data"><span class="ico">🔮</span><p>Not enough data.</p></div>';
  function getWB(d,wk){if(smId==='all')return(d.weeks&&d.weeks[wk]&&d.weeks[wk].bunches)||0;const m=d.bySmWeek||{};const k=Object.keys(m).find(function(k){return k.split('|||')[0]===smId;});return k&&m[k]&&m[k][wk]?m[k][wk].bunches||0:0;}
  const products=Object.entries(allData).map(function(e){
    const name=e[0],d=e[1];
    const wv=last4.map(function(w){return getWB(d,w);});
    const wa=Math.round(wv.reduce(function(a,v){return a+v;},0)/last4.length);
    const wf=Math.round(wa*1.1);
    const bpb=getCatBpbForProduct(name);
    const trend=wv.length>=2?wv[0]-wv[wv.length-1]:0;
    return{name,wv,wa,wf,wb:bpb>0?Math.ceil(wf/bpb):0,mf:Math.round(wf*4.33),mb:bpb>0?Math.ceil(wf*4.33/bpb):0,bpb,trend};
  }).filter(function(p){return p.wa>0;}).sort(function(a,b){return b.wf-a.wf;});
  if(!products.length) return '<div class="no-data"><span class="ico">🔮</span><p>No data for forecast.</p></div>';
  const gwf=products.reduce(function(a,p){return a+p.wf;},0);
  const gwb=products.reduce(function(a,p){return a+p.wb;},0);
  const gmf=products.reduce(function(a,p){return a+p.mf;},0);
  const gmb=products.reduce(function(a,p){return a+p.mb;},0);
  let html='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.2rem">'
    +[{i:'📅',l:'Next Week Bn',v:'~'+gwf,c:'#4f46e5'},{i:'📦',l:'Week Boxes',v:gwb,c:'#0369a1'},{i:'📆',l:'Next Month Bn',v:'~'+gmf,c:'#059669'},{i:'🏭',l:'Month Boxes',v:gmb,c:'#be185d'}]
    .map(function(c){return '<div style="background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow-sm)"><div style="font-size:20px">'+c.i+'</div><div style="font-size:18px;font-weight:800;color:'+c.c+'">'+c.v+'</div><div style="font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase">'+c.l+'</div></div>';}).join('')+'</div>';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;flex-wrap:wrap;gap:8px"><div style="font-size:12px;color:var(--text2)">Last '+last4.length+' weeks avg + 10% buffer</div><button type="button" id="an-dl-forecast" style="padding:8px 16px;border-radius:10px;border:1.5px solid #059669;background:#fff;color:#059669;font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">⬇️ Download Forecast</button></div>';
  html+='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1rem;box-shadow:var(--shadow-sm)"><div style="padding:10px 16px;background:linear-gradient(90deg,#1e1b4b,#312e81)"><span style="font-size:13px;font-weight:700;color:#fff">🔮 Procurement Forecast</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#fafafa;border-bottom:2px solid var(--border)"><th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2)">#</th><th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2)">Product</th>'+last4.map(function(w){return '<th style="padding:8px 8px;text-align:center;font-size:10px;font-weight:700;color:#64748b;white-space:nowrap">'+w.split(' ')[0]+'</th>';}).join('')+'<th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#0369a1">Avg/Wk</th><th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#be185d">Forecast Bn</th><th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#1e40af">Boxes</th><th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#92400e">Trend</th></tr></thead><tbody>';
  let rn=1;
  cats.forEach(function(cat){
    const cp=products.filter(function(p){return cat.items.find(function(i){return i.name===p.name;});});
    if(!cp.length) return;
    const cwf=cp.reduce(function(a,p){return a+p.wf;},0),cwb=cp.reduce(function(a,p){return a+p.wb;},0);
    html+='<tr style="background:linear-gradient(90deg,#1e1b4b,#312e81)"><td colspan="'+(last4.length+3)+'" style="padding:7px 14px"><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:'+cat.color+'"></span><span style="font-size:11px;font-weight:700;color:#fff">'+cat.label+'</span></div><div style="display:flex;gap:10px"><span style="font-size:10px;color:rgba(255,255,255,0.8)">~'+cwf+' Bn</span><span style="font-size:10px;color:rgba(255,255,255,0.8)">'+cwb+' Boxes</span></div></div></td><td colspan="2"></td></tr>';
    cp.forEach(function(p){
      const src=allPhotos[p.name]||photos[p.name]||'';
      const ti=p.trend>20?'📈':p.trend<-20?'📉':'📊';
      const tc=p.trend>20?'#15803d':p.trend<-20?'#dc2626':'#64748b';
      html+='<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:8px 14px;color:var(--text2);font-size:11px">'+rn+'</td><td style="padding:8px 14px"><div style="display:flex;align-items:center;gap:8px">'+(src?'<img src="'+src+'" style="width:24px;height:24px;border-radius:4px;object-fit:cover"/>':'<span>🌸</span>')+'<span style="font-weight:500">'+p.name+'</span><span style="font-size:9px;color:var(--text2);background:#f1f5f9;padding:1px 5px;border-radius:4px">'+p.bpb+'Bn/Box</span></div></td>'+p.wv.map(function(v){return '<td style="padding:8px 8px;text-align:center;color:var(--text2)">'+(v||'—')+'</td>';}).join('')+'<td style="padding:8px 8px;text-align:center;font-weight:600;color:#0369a1">'+p.wa+'</td><td style="padding:8px 8px;text-align:center"><span style="background:#fce7f3;color:#be185d;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">~'+p.wf+'</span></td><td style="padding:8px 8px;text-align:center"><span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">'+p.wb+'</span></td><td style="padding:8px 8px;text-align:center;font-weight:700;color:'+tc+'">'+ti+' '+(p.trend>0?'+':'')+p.trend+'</td></tr>';
      rn++;
    });
  });
  html+='<tfoot><tr style="background:#f8fafc;border-top:2px solid var(--border)"><td colspan="'+(last4.length+3)+'" style="padding:10px 14px;font-weight:700">Grand Total</td><td style="padding:10px 8px;text-align:center;font-weight:700;color:#be185d">~'+gwf+'</td><td style="padding:10px 8px;text-align:center;font-weight:700;color:#1e40af">'+gwb+'</td><td></td></tr></tfoot></tbody></table></div></div>';
  const rising=products.filter(function(p){return p.trend>20;}).slice(0,3);
  const falling=products.filter(function(p){return p.trend<-20;}).slice(0,3);
  if(rising.length||falling.length){
    html+='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:1rem;box-shadow:var(--shadow-sm)"><div style="font-size:13px;font-weight:700;margin-bottom:10px">⚠️ Demand Alerts</div><div style="display:flex;flex-direction:column;gap:8px">';
    rising.forEach(function(p){html+='<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px"><span>📈</span><span style="font-weight:600;font-size:12px">'+p.name+'</span><span style="font-size:11px;color:#15803d">Rising +'+p.trend+' Bn</span></div>';});
    falling.forEach(function(p){html+='<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px"><span>📉</span><span style="font-weight:600;font-size:12px">'+p.name+'</span><span style="font-size:11px;color:#dc2626">Falling '+p.trend+' Bn</span></div>';});
    html+='</div></div>';
  }
  return html;
}

function renderAIReport(body,allData,weeksSorted,monthsSorted){
  const smList=Object.keys(creds).filter(function(id){return creds[id]&&creds[id].name;})
    .sort().map(function(id){return {id:id,name:creds[id].name||id};});
  if(!window.aiReportType) window.aiReportType='weekly';
  if(!window.aiReportSM) window.aiReportSM='all';

  let h='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:1rem;box-shadow:var(--shadow-sm)">'
    +'<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">🤖 AI Report Settings</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'
    +['weekly','monthly','salesman'].map(function(t){
      const labels={weekly:'📅 Weekly',monthly:'📆 Monthly',salesman:'👤 Salesman'};
      const active=window.aiReportType===t;
      return '<button type="button" class="ai-rpt-type" data-type="'+t+'" style="padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;'+(active?'background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;border-color:transparent':'background:#f8fafc;color:#64748b')+'">'+labels[t]+'</button>';
    }).join('')
    +'</div>';

  if(window.aiReportType==='salesman'){
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      +'<span style="font-size:12px;font-weight:600;color:var(--text2)">Salesman:</span>'
      +'<select id="ai-sm-sel" style="border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;font-family:Inter,sans-serif;background:#fff">'
      +'<option value="all" '+(window.aiReportSM==='all'?'selected':'')+'>All Salesman</option>'
      +smList.map(function(s){return '<option value="'+s.id+'" '+(window.aiReportSM===s.id?'selected':'')+'>'+s.name+'</option>';}).join('')
      +'</select></div>';
  }

  h+='<button type="button" id="ai-generate-btn" style="padding:10px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">🤖 Generate Report</button>'
    +'</div><div id="ai-report-output"></div>';

  body.innerHTML=h;

  body.querySelectorAll('.ai-rpt-type').forEach(function(btn){
    btn.addEventListener('click',function(){
      window.aiReportType=this.dataset.type;
      if(this.dataset.type!=='salesman') window.aiReportSM='all';
      renderAIReport(body,allData,weeksSorted,monthsSorted);
    });
  });
  const smSel=body.querySelector('#ai-sm-sel');
  if(smSel) smSel.addEventListener('change',function(){window.aiReportSM=this.value;});
  body.querySelector('#ai-generate-btn').addEventListener('click',function(){
    generateAIReport(body,allData,weeksSorted,monthsSorted,smList);
  });
}

async function generateAIReport(body,allData,weeksSorted,monthsSorted,smList){
  const output=document.getElementById('ai-report-output');
  output.innerHTML='<div style="text-align:center;padding:2rem;color:#7c3aed"><div style="font-size:32px;margin-bottom:8px">🤖</div><div style="font-size:14px;font-weight:600">Analyzing data...</div></div>';

  const type=window.aiReportType||'weekly';
  const smId=window.aiReportSM||'all';
  const last2W=weeksSorted.slice(0,2);
  const last2M=monthsSorted.slice(0,2);
  const w1=last2W[0],w2=last2W[1];
  const m1=last2M[0],m2=last2M[1];

  function getBn(d,p,isW){const m=isW?d.weeks:d.months;return(m&&m[p]&&m[p].bunches)||0;}
  function getSmBn(d,p,sid,isW){
    const m=isW?d.bySmWeek:d.bySmMonth;
    const k=Object.keys(m||{}).find(function(k){return k.split('|||')[0]===sid;});
    return k&&m[k]&&m[k][p]?m[k][p].bunches||0:0;
  }

  // ── Build data string ─────────────────────────────────────────
  let dataStr='';
  const isWeekly=type==='weekly'||type==='salesman';
  const p1=isWeekly?w1:m1;
  const p2=isWeekly?w2:m2;

  // Product demand data
  const productRows=[];
  cats.forEach(function(cat){
    cat.items.forEach(function(item){
      const d=allData[item.name];
      if(!d) return;
      const cur=getBn(d,p1,isWeekly);
      const prev=p2?getBn(d,p2,isWeekly):0;
      if(!cur&&!prev) return;
      const chg=prev>0?Math.round((cur-prev)/prev*100):cur>0?100:0;
      productRows.push({name:item.name,cat:cat.label,cur,prev,chg});
    });
  });
  productRows.sort(function(a,b){return b.cur-a.cur;});

  // Arrival data
  const histDB=window._historyDB||lsGet('g_history',[]);
  const allArrivals=[...arrivalsDB,...histDB];

  function getArrWeek(arr){ return arr.arrDate?getWeekKeyStatic(arr.arrDate):null; }
  function getWeekKeyStatic(dateStr){
    if(!dateStr) return null;
    const d=new Date(dateStr);
    if(isNaN(d)) return null;
    const day=d.getDay();
    const diffToFri=((day-5)+7)%7;
    const fri=new Date(d);fri.setDate(d.getDate()-diffToFri);
    const jan1=new Date(fri.getFullYear(),0,1);
    const wn=Math.ceil(((fri-jan1)/86400000+jan1.getDay()+1)/7);
    return 'W'+String(wn).padStart(2,'0');
  }

  // Current week arrivals by origin
  const w1num=w1?w1.split(' ')[0]:'';
  const w2num=w2?w2.split(' ')[0]:'';
  const arrW1={},arrW2={};
  allArrivals.forEach(function(arr){
    const wk=getWeekKeyStatic(arr.arrDate);
    const target=wk===w1num?arrW1:wk===w2num?arrW2:null;
    if(!target) return;
    // Try to get origin from arrival name or category
    Object.entries(arr.arrivals||{}).forEach(function(e){
      const name=e[0],qty=e[1];
      if(!qty) return;
      const bn=(qty.box||0)*25+(qty.bunch||0);
      if(!target[name]) target[name]=0;
      target[name]+=bn;
    });
  });

  // Category wise arrival totals
  const catArrW1={},catArrW2={};
  cats.forEach(function(cat){
    cat.items.forEach(function(item){
      catArrW1[cat.label]=(catArrW1[cat.label]||0)+(arrW1[item.name]||0);
      catArrW2[cat.label]=(catArrW2[cat.label]||0)+(arrW2[item.name]||0);
    });
  });

  // Missing salesman check
  const allSMIds=Object.keys(creds).filter(function(id){return creds[id]&&creds[id].name;});
  const orderedW1=new Set();
  // Regular orders
  regularOrders.filter(function(o){return o.submittedAt&&getWeekKeyStatic(o.date)===w1num;})
    .forEach(function(o){orderedW1.add(o.userId);});
  // Arrival orders
  allArrivals.filter(function(a){return getWeekKeyStatic(a.arrDate)===w1num;})
    .forEach(function(arr){
      Object.keys(arr.orders||{}).forEach(function(sid){
        const o=arr.orders[sid];
        if(o&&Object.values(o).some(function(q){return q&&((q.box||0)+(q.bunch||0)>0);})) orderedW1.add(sid);
      });
    });
  // Stock orders
  Object.keys(stockOrders||{}).forEach(function(sid){
    if(stockOrders[sid]&&stockOrders[sid].submittedAt) orderedW1.add(sid);
  });
  const missingSM=allSMIds.filter(function(id){return !orderedW1.has(id);})
    .map(function(id){return creds[id].name||id;});
  const orderedSM=allSMIds.filter(function(id){return orderedW1.has(id);})
    .map(function(id){return creds[id].name||id;});

  // Build data string for AI
  dataStr='PERIOD: '+(p1||'N/A')+' vs '+(p2||'N/A')+'\n\n';

  dataStr+='ARRIVALS THIS WEEK BY CATEGORY:\n';
  Object.entries(catArrW1).forEach(function(e){
    if(e[1]>0){
      const prev=catArrW2[e[0]]||0;
      const chg=prev>0?Math.round((e[1]-prev)/prev*100):0;
      dataStr+=e[0]+': '+e[1]+' Bn | Prev: '+prev+' Bn | '+(chg>=0?'+':'')+chg+'%\n';
    }
  });

  dataStr+='\nPRODUCT DEMAND (Top 20):\n';
  dataStr+='Product | Category | Current | Previous | Change%\n';
  productRows.slice(0,20).forEach(function(p){
    dataStr+=p.name+' | '+p.cat+' | '+p.cur+' | '+p.prev+' | '+(p.chg>=0?'+':'')+p.chg+'%\n';
  });

  dataStr+='\nSALESMAN STATUS:\n';
  dataStr+='Ordered ('+orderedSM.length+'): '+orderedSM.join(', ')+'\n';
  dataStr+='Did NOT order ('+missingSM.length+'): '+(missingSM.length?missingSM.join(', '):'All ordered!')+'\n';

  // Chart data — top 10 products
  const chartProducts=productRows.slice(0,10);

  // AI prompt
  const prompts={
    weekly:'You are an analytics expert for a wholesale flower business in Saudi Arabia. Write a professional weekly report (250-300 words) analyzing: 1) Arrivals this week by category vs last week with key observations, 2) Top 3 products with strong demand growth, 3) Products with notable decline (include absolute numbers), 4) Salesman participation — note who did not order and impact, 5) Specific procurement recommendations for next week. Be precise with numbers. Professional English.',
    monthly:'You are an analytics expert for a wholesale flower business in Saudi Arabia. Write a professional monthly report (250-300 words) analyzing: 1) Monthly demand trend vs previous month, 2) Best performing categories and products, 3) Declining products, 4) Salesman participation patterns, 5) Strategic recommendations for next month. Be precise with numbers. Professional English.',
    salesman:'You are an analytics expert for a wholesale flower business in Saudi Arabia. Write a professional salesman performance report (250-300 words) covering: 1) Salesman who ordered this week vs last, 2) Salesman who did NOT place any orders (from regular, arrival, and stock systems), 3) Top performing salesman with their demand numbers, 4) Salesman needing follow-up, 5) Management action recommendations. Be precise with numbers. Professional English.'
  };

  try{
    const res=await fetch('/.netlify/functions/ai-report',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:prompts[type]+'\n\nDATA:\n'+dataStr}]})
    });
    const data=await res.json();
    const text=data.content&&data.content[0]&&data.content[0].text;
    if(!text) throw new Error('No response');

    const labels={weekly:'📅 Weekly Report',monthly:'📆 Monthly Report',salesman:'👤 Salesman Report'};
    const subLabel=type==='salesman'&&smId!=='all'?(creds[smId]?creds[smId].name:smId):'';

    // Build chart HTML
    const maxVal=Math.max(...chartProducts.map(function(p){return Math.max(p.cur,p.prev);}),1);
    let chartHtml='<div style="padding:16px">'
      +'<div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em">📊 Top 10 Products — '+p1+' vs '+(p2||'N/A')+'</div>';

    chartProducts.forEach(function(p){
      const w1pct=Math.round(p.cur/maxVal*100);
      const w2pct=Math.round(p.prev/maxVal*100);
      const color=p.chg>=0?'#059669':'#dc2626';
      chartHtml+='<div style="margin-bottom:10px">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">'
        +'<span style="font-size:11px;font-weight:600;color:var(--text)">'+p.name+'</span>'
        +'<span style="font-size:11px;font-weight:700;color:'+color+'">'+(p.chg>=0?'+':'')+p.chg+'%</span>'
        +'</div>'
        +'<div style="display:flex;flex-direction:column;gap:2px">'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +'<span style="font-size:9px;color:var(--text2);width:24px">W1</span>'
        +'<div style="flex:1;background:#f1f5f9;border-radius:4px;height:8px"><div style="width:'+w1pct+'%;background:linear-gradient(90deg,#4f46e5,#6366f1);height:100%;border-radius:4px;transition:width 0.5s ease"></div></div>'
        +'<span style="font-size:10px;font-weight:600;color:#4f46e5;width:40px;text-align:right">'+p.cur+' Bn</span>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +'<span style="font-size:9px;color:var(--text2);width:24px">W2</span>'
        +'<div style="flex:1;background:#f1f5f9;border-radius:4px;height:8px"><div style="width:'+w2pct+'%;background:#e2e8f0;height:100%;border-radius:4px"></div></div>'
        +'<span style="font-size:10px;color:var(--text2);width:40px;text-align:right">'+p.prev+' Bn</span>'
        +'</div>'
        +'</div></div>';
    });
    chartHtml+='<div style="display:flex;gap:16px;margin-top:8px">'
      +'<div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:8px;border-radius:2px;background:linear-gradient(90deg,#4f46e5,#6366f1)"></div><span style="font-size:10px;color:var(--text2)">Current Week</span></div>'
      +'<div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:8px;border-radius:2px;background:#e2e8f0"></div><span style="font-size:10px;color:var(--text2)">Previous Week</span></div>'
      +'</div></div>';

    // Missing salesman badge
    const missingHtml=missingSM.length>0
      ?'<div style="padding:12px 16px;background:#fef3c7;border-top:1px solid #fcd34d">'
        +'<div style="font-size:11px;font-weight:700;color:#92400e;margin-bottom:6px">⚠️ Did Not Order This Week ('+missingSM.length+')</div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
        +missingSM.map(function(n){return '<span style="background:#fff;border:1px solid #fcd34d;color:#92400e;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600">'+n+'</span>';}).join('')
        +'</div></div>'
      :'<div style="padding:10px 16px;background:#f0fdf4;border-top:1px solid #86efac"><div style="font-size:11px;font-weight:700;color:#15803d">✅ All salesman placed orders this week!</div></div>';

    output.innerHTML='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)">'
      +'<div style="padding:12px 16px;background:linear-gradient(135deg,#7c3aed,#8b5cf6);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'
      +'<div><div style="font-size:14px;font-weight:700;color:#fff">'+labels[type]+(subLabel?' — '+subLabel:'')+'</div>'
      +'<div style="font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px">'+p1+' | Claude AI • '+new Date().toLocaleString('en-GB')+'</div></div>'
      +'<button type="button" id="ai-copy-btn" style="padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.4);background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">📋 Copy</button>'
      +'</div>'
      // Chart
      +'<div style="border-bottom:1.5px solid var(--border)">'+chartHtml+'</div>'
      // Missing salesman
      +missingHtml
      // AI text
      +'<div style="padding:20px;font-size:14px;line-height:1.9;color:var(--text);white-space:pre-wrap;font-family:Inter,sans-serif">'+text+'</div>'
      +'</div>';

    output.querySelector('#ai-copy-btn').addEventListener('click',function(){
      navigator.clipboard.writeText(text).then(function(){toast('Report copied!');});
    });

  }catch(e){
    output.innerHTML='<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:14px;padding:1.5rem;text-align:center"><div style="font-size:24px;margin-bottom:8px">⚠️</div><div style="font-size:14px;font-weight:600;color:#dc2626">Could not generate report</div><div style="font-size:12px;color:#64748b;margin-top:4px">Check your internet and try again.</div></div>';
    console.error('AI Report:',e);
  }
}


function downloadForecastExcel(allData,weeksSorted){
  const smId=window.analyticsSM||'all';
  const smName=smId==='all'?'All Salesman':(creds[smId]?creds[smId].name:smId);
  const last4=weeksSorted.slice(0,4);
  function getWB(d,wk){if(smId==='all') return(d.weeks&&d.weeks[wk]&&d.weeks[wk].bunches)||0;const m=d.bySmWeek||{};const k=Object.keys(m).find(function(k){return k.split('|||')[0]===smId;});return k&&m[k]&&m[k][wk]?m[k][wk].bunches||0:0;}
  const today=new Date().toLocaleDateString('en-GB');
  let csv='Greena Procurement Forecast\nGenerated: '+today+'\nSalesman: '+smName+'\n\n';
  csv+='Category,Product,Bn/Box,'+last4.join(',')+',Avg/Week,Next Week Bn,Week Boxes,Next Month Bn,Month Boxes,Trend\n';
  cats.forEach(function(cat){
    cat.items.forEach(function(item){
      const d=allData[item.name];if(!d) return;
      const wv=last4.map(function(w){return getWB(d,w);});
      const wa=Math.round(wv.reduce(function(a,v){return a+v;},0)/Math.max(last4.length,1));
      if(!wa) return;
      const wf=Math.round(wa*1.1),bpb=getCatBpbForProduct(item.name);
      const trend=wv.length>=2?wv[0]-wv[wv.length-1]:0;
      csv+=cat.label+','+item.name+','+bpb+','+wv.join(',')+','+wa+',~'+wf+','+Math.ceil(wf/bpb)+',~'+Math.round(wf*4.33)+','+Math.ceil(wf*4.33/bpb)+',"'+(trend>0?'Rising +'+trend:trend<0?'Falling '+trend:'Stable')+'"\n';
    });
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Forecast_'+smName.replace(/\s/g,'_')+'_'+today.replace(/\//g,'-')+'.csv';
  a.click();
  toast('Forecast downloaded!');
}

function downloadAnalyticsExcel(isAllSM){
  const smId=window.analyticsSM||'all';
  const smName=isAllSM?'All Salesman':(creds[smId]?creds[smId].name:smId);
  const period=window.analyticsTab==='weekly'?window.analyticsWeek:window.analyticsMonth;
  if(!period){toast('Select a period first.');return;}
  const blob=new Blob(['Analytics\nPeriod: '+period+'\nSalesman: '+smName+'\n'],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Analytics_'+smName.replace(/\s/g,'_')+'_'+period.replace(/[\s()]/g,'_')+'.csv';
  a.click();
  toast('Downloaded!');
}
