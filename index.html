<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greena System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#4f46e5;--purple-dark:#3730a3;--purple-mid:#6366f1;--purple-light:#818cf8;
  --pink:#ec4899;--pink-soft:#fdf2f8;--pink-light:#fce7f3;
  --bg:#f4f6fb;--white:#ffffff;--text:#0f172a;--text2:#64748b;
  --border:#e8edf5;--border2:#cbd5e1;
  --green:#059669;--green-bg:#ecfdf5;
  --amber:#d97706;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --shadow-sm:0 1px 4px rgba(0,0,0,0.06);
  --shadow:0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.1);
  --radius:18px;--radius-sm:10px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

/* LOGIN */
.login-page{position:fixed;inset:0;background:linear-gradient(135deg,#0f0d2e 0%,#1e1b4b 50%,#312e81 100%);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-card{background:rgba(255,255,255,0.96);backdrop-filter:blur(24px);border-radius:28px;padding:2.8rem 2.4rem;width:100%;max-width:400px;box-shadow:0 32px 64px rgba(0,0,0,0.3),0 0 0 1px rgba(255,255,255,0.08)}
.login-logo{font-family:'Outfit',sans-serif;font-size:48px;font-weight:900;background:linear-gradient(135deg,#4f46e5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px;text-align:center;margin-bottom:4px}
.login-sub{font-size:11px;color:var(--text2);margin-bottom:2rem;text-align:center;letter-spacing:0.12em;text-transform:uppercase;font-weight:500}
.lf{text-align:left;margin-bottom:14px}
.lf label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em}
.lf input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--text);font-family:'Inter',sans-serif;background:#f8fafc;transition:all 0.2s}
.lf input:focus{outline:none;border-color:var(--purple-mid);background:var(--white);box-shadow:0 0 0 4px rgba(99,102,241,0.1)}
.login-btn{width:100%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;letter-spacing:0.02em;transition:all 0.2s;box-shadow:0 4px 16px rgba(79,70,229,0.4)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,70,229,0.45)}
.login-btn:active{transform:translateY(0)}
.login-err{color:#dc2626;font-size:12px;margin-top:10px;min-height:18px;text-align:center}

/* APP */
.app{display:none}.app.show{display:block}

/* NAVBAR */
.navbar{background:linear-gradient(90deg,#0f0d2e,#1e1b4b,#2d2a6e);padding:0 1.5rem;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 24px rgba(15,13,46,0.5)}
.nav-brand{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,#fff 0%,#c7d2fe 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px;cursor:pointer}
.nav-right{display:flex;align-items:center;gap:10px}
.user-chip{font-size:12px;color:rgba(255,255,255,0.9);font-weight:600;background:rgba(255,255,255,0.1);padding:6px 14px;border-radius:99px;border:1px solid rgba(255,255,255,0.15)}
.btn-logout{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.85);border-radius:10px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:all 0.2s}
.btn-logout:hover{background:rgba(255,255,255,0.18)}

/* DASHBOARD */
.dashboard{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:720px;width:100%}
.dash-card{background:var(--white);border:1.5px solid rgba(232,237,245,0.9);border-radius:20px;padding:1.5rem 1.5rem 1.2rem;text-align:left;cursor:pointer;transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.dash-card:hover{border-color:rgba(99,102,241,0.3);transform:translateY(-4px);box-shadow:0 20px 40px rgba(79,70,229,0.12),0 4px 12px rgba(0,0,0,0.06)}
.dash-card .dc-icon-wrap{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:22px;background:linear-gradient(135deg,rgba(79,70,229,0.1),rgba(124,58,237,0.08))}
.dash-card .dc-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.dash-card .dc-sub{font-size:12px;color:var(--text2)}
.dash-card .dc-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--border2);font-size:16px;transition:all 0.2s}
.dash-card:hover .dc-arrow{color:var(--purple);transform:translateY(-50%) translateX(2px)}
.notif-badge{position:absolute;top:14px;right:14px;background:#dc2626;color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 8px rgba(220,38,38,0.4)}

/* PAGE */
.page{display:none}.page.show{display:block}
.page-content{padding:1.5rem;max-width:1100px;margin:0 auto}

/* TOP BAR */
.top-bar{background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(232,237,245,0.9);padding:12px 1.5rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:62px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.back-btn{background:rgba(241,245,249,0.8);border:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;padding:7px 12px;border-radius:10px;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;transition:all 0.15s}
.back-btn:hover{background:#e2e8f0;color:var(--text)}
.top-bar-title{font-size:15px;font-weight:700;color:var(--text);flex:1}
.nav-tabs-bar{display:flex;gap:4px;flex-wrap:wrap}
.ntab{padding:7px 16px;font-size:12px;border-radius:10px;border:none;background:rgba(241,245,249,0.8);cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;color:var(--text2);transition:all 0.2s}
.ntab:hover{background:#e2e8f0;color:var(--text)}
.ntab.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(79,70,229,0.3)}

/* REGULAR ORDER */
.date-btns{display:flex;gap:10px;margin-bottom:1.2rem}
.date-btn{flex:1;padding:12px 16px;border:1.5px solid var(--border);border-radius:14px;background:var(--white);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text2);transition:all 0.2s;text-align:center;box-shadow:var(--shadow-sm)}
.date-btn:hover{border-color:var(--purple-mid)}
.date-btn.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(79,70,229,0.3)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:1.2rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:8px 18px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;transition:all 0.2s;flex-shrink:0}
.cat-tab.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,0.3)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:1.5rem}
.prod-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;padding:1rem;box-shadow:var(--shadow-sm);transition:all 0.2s}
.prod-card:hover{box-shadow:var(--shadow);border-color:rgba(99,102,241,0.2)}
.prod-img{width:100%;height:130px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#f1f5f9}
.prod-img-placeholder{width:100%;height:130px;border-radius:12px;margin-bottom:10px;background:linear-gradient(135deg,#f1f5f9,#e8edf5);display:flex;align-items:center;justify-content:center;font-size:36px}
.prod-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px}
.prod-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prod-inp-wrap{background:#f8fafc;border-radius:10px;padding:6px 8px;border:1.5px solid var(--border);transition:all 0.15s}
.prod-inp-wrap:focus-within{border-color:var(--purple-mid);background:var(--white)}
.prod-inp-wrap label{display:block;font-size:9px;font-weight:700;color:var(--text2);letter-spacing:0.08em;margin-bottom:2px}
.prod-inp{width:100%;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--text);font-family:'Inter',sans-serif;outline:none;text-align:center}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;transition:all 0.2s}
.btn-purple{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,0.3)}
.btn-purple:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,70,229,0.4)}
.btn-green{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,0.3)}
.btn-green:hover{transform:translateY(-1px)}
.btn-red{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn-ghost{background:var(--white);border:1.5px solid var(--border);color:var(--text2)}
.btn-ghost:hover{background:#f1f5f9;color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-blue{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}

/* CARDS */
.mgmt-card,.card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow-sm);margin-bottom:1rem}
.card-header{display:flex;align-items:center;gap:10px;cursor:pointer;padding:0.8rem 1rem;border-radius:12px;transition:background 0.15s}
.card-header:hover{background:#f8fafc}
.card-title{font-size:14px;font-weight:700;color:var(--text);flex:1}
.card-badge{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:2px 10px}
.card-body{display:none}.card-body.show{display:block}
.arrow{color:var(--text2);font-size:18px;transition:transform 0.2s;display:inline-block}
.arrow.open{transform:rotate(90deg)}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}

/* ARRIVAL ITEMS */
.arrival-list{display:flex;flex-direction:column;gap:8px}
.arrival-item{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;transition:all 0.2s}
.arrival-item.active-arrival{border-color:rgba(79,70,229,0.25);box-shadow:0 2px 12px rgba(79,70,229,0.08)}
.arrival-item-header{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;transition:background 0.15s}
.arrival-item-header:hover{background:#fafbff}

/* TABS */
.user-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.2rem}
.user-tab{padding:8px 18px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text2);transition:all 0.2s}
.user-tab.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,0.25)}
.dt-tabs,.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dt-tabs::-webkit-scrollbar,.dtabs::-webkit-scrollbar{display:none}
.dt-tab,.dtab{padding:8px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap;transition:all 0.2s;flex-shrink:0}
.dt-tab.active,.dtab.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,0.25)}
.dt-tab.open-tab{border-color:rgba(5,150,105,0.3)}
.date-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.date-tab{padding:8px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap;transition:all 0.2s;font-family:'Inter',sans-serif}
.date-tab.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent}

/* ORDERS TABLE */
.orders-table{width:100%;border-collapse:collapse;font-size:12px}
.orders-table th{padding:10px 14px;text-align:center;background:#1e1b4b;color:#fff;font-size:11px;font-weight:700}
.orders-table th:first-child{text-align:left}
.orders-table td{padding:9px 14px;text-align:center;border-bottom:1px solid #f1f5f9}
.orders-table tbody tr:hover{background:#f8fafc}
/* ARRIVAL ORDERS/HISTORY TABLE */
.orders-wrap{overflow-x:auto;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.04);border:1.5px solid #e8e3f0;-webkit-overflow-scrolling:touch}
.orders-tbl{border-collapse:collapse;font-size:12px;width:100%;background:#fff;min-width:420px}
.orders-tbl thead tr:first-child th{background:linear-gradient(90deg,#1e1b4b,#312e81);color:rgba(255,255,255,0.95);padding:10px 10px;font-weight:700;font-size:11px;letter-spacing:0.03em;white-space:nowrap;text-align:center;border-right:1px solid rgba(255,255,255,0.1)}
.orders-tbl thead tr:first-child th:first-child{text-align:left;padding-left:12px}
.orders-tbl thead tr:nth-child(2) th{background:#2d2a6e;color:rgba(255,255,255,0.8);padding:5px 8px;font-size:10px;font-weight:600;text-align:center;border-right:1px solid rgba(255,255,255,0.08);border-bottom:2px solid rgba(255,255,255,0.15)}
.orders-tbl tbody td{padding:8px 8px;border-bottom:1px solid #f1f5f9;border-right:1px solid #f5f3ff;text-align:center;white-space:nowrap;color:var(--text2);font-size:12px}
.orders-tbl tbody td:first-child{text-align:left;color:var(--text);font-weight:500;white-space:nowrap;padding-left:10px;position:sticky;left:0;background:var(--white);z-index:2;border-left:1.5px solid #e8e3f0;box-shadow:2px 0 6px rgba(0,0,0,0.04)}
.orders-tbl tbody tr:hover td{background:#fafbff}
.orders-tbl tbody tr:hover td:first-child{background:#f5f3ff}
.orders-tbl .cat-row td{background:linear-gradient(90deg,#f0eeff,#f5f3ff);color:#4338ca;font-weight:700;font-size:11px;text-align:left;padding:7px 12px;border-bottom:1px solid #e0e7ff;border-top:2px solid #c7d2fe;letter-spacing:0.04em;position:sticky;left:0}
.orders-tbl .grand-row td{background:linear-gradient(90deg,#1e1b4b,#312e81);color:rgba(255,255,255,0.95);font-weight:700;font-size:12px;border-right:1px solid rgba(255,255,255,0.1)}
.orders-tbl .grand-row td:first-child{background:#1e1b4b;position:sticky;left:0;z-index:2}
.obox{color:#5b21b6;font-weight:700}.obunch{color:#059669;font-weight:700}
.zero{color:#d1c4e9}.over{color:#dc2626;font-weight:700;background:#fff5f5}
.total-col{font-weight:700;background:#f5f3ff}
.arrived-col{background:#f0fdf4;color:#15803d;font-weight:600}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
input[type=date],input[type=number],input[type=text],input[type=password],select,textarea{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);background:var(--white);transition:all 0.2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple-mid);box-shadow:0 0 0 3px rgba(99,102,241,0.1)}

/* STATUS BADGES */
.status-open{background:#dcfce7;color:#15803d;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700}
.status-closed{background:#f1f5f9;color:#64748b;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700}
.status-deadline{background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700}
.badge{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700}
.b-amber{background:#fef3c7;color:#92400e}
.b-green{background:#dcfce7;color:#15803d}
.b-purple{background:#ede9fe;color:#5b21b6}
.b-red{background:#fee2e2;color:#dc2626}

/* NO DATA */
.no-data{text-align:center;padding:3rem 2rem;color:var(--text2)}
.no-data .ico,.no-data .icon{font-size:48px;display:block;margin-bottom:12px;opacity:0.5}
.no-data p{font-size:14px;font-weight:500}

/* SUMMARY */
.sum-box{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1.5px solid #a7f3d0;border-radius:16px;padding:1.2rem;margin-top:1rem}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(167,243,208,0.4)}
.sum-row:last-child{border:none;font-weight:700;padding-top:12px}
.sum-total{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;border-top:2px solid #a7f3d0;margin-top:6px}

/* SHIPMENT */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:10px}
.st{font-size:18px;font-weight:700;color:var(--text)}
.ss{font-size:13px;color:var(--text2);margin-top:2px}
/* CREATE ARRIVAL FORM */
.date-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-items:end}
.date-field{display:flex;flex-direction:column;gap:6px}
.date-field label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em}
.date-field input[type=date],.date-field select,.date-field-select{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);background:var(--white);transition:all 0.2s;outline:none;width:100%}
.date-field input[type=date]:focus,.date-field select:focus,.date-field-select:focus{border-color:var(--purple-mid);box-shadow:0 0 0 3px rgba(99,102,241,0.1)}
.mgmt-card h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:1.2rem;display:flex;align-items:center;gap:8px}
.origins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.origin-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow-sm)}
.origin-card:hover{border-color:rgba(99,102,241,0.3);transform:translateY(-3px);box-shadow:var(--shadow)}
.origin-card .flag{font-size:32px;margin-bottom:8px;display:block}
.origin-card .name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.origin-card .sub{font-size:11px;color:var(--text2)}
.vendors-list,.vendor-list{display:flex;flex-direction:column;gap:10px}
.vendor-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:1rem 1.2rem;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.vendor-card:hover{border-color:rgba(99,102,241,0.3);transform:translateX(4px);box-shadow:var(--shadow)}
.conf-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm)}
.conf-head{background:linear-gradient(90deg,#1e1b4b,#312e81);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.conf-head .flag{font-size:22px}
.conf-head .name{font-size:14px;font-weight:700;color:#fff;flex:1}
.conf-head .tb{font-size:12px;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.1);padding:2px 10px;border-radius:99px}
.s-badge{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700}
.s-conf{background:#dcfce7;color:#15803d}.s-pend{background:#fef3c7;color:#92400e}
.inp-conf{width:70px;border:1.5px solid var(--border);border-radius:8px;padding:5px;font-size:13px;text-align:center;font-family:'Inter',sans-serif}
.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}

/* PERM LABELS */
.perm-label{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--text2);background:#f8fafc;padding:5px 10px;border-radius:8px;border:1.5px solid var(--border);margin:3px;cursor:pointer;transition:all 0.15s}
.perm-label:hover{background:#f1f5f9}
.perm-label input{accent-color:var(--purple)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,13,46,0.6);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--white);border-radius:22px;padding:1.8rem;width:100%;max-width:480px;box-shadow:0 24px 48px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:1.2rem}
.mf{margin-bottom:1rem}.mf label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
.mf input,.mf select,.mf textarea{width:100%}
.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:1.2rem}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MISC */
.sync-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block;margin-right:6px}
.unit-inp{width:64px;border:1.5px solid var(--border);border-radius:8px;padding:6px;font-size:14px;text-align:center;font-family:'Inter',sans-serif;outline:none;transition:all 0.15s}
.unit-inp:focus{border-color:var(--purple-mid)}
.over-warn{font-size:10px;color:#dc2626;font-weight:600;display:block;margin-top:3px}
.inp-qty{width:80px;border:1.5px solid var(--border);border-radius:8px;padding:7px;font-size:14px;text-align:center;font-family:'Inter',sans-serif;outline:none}
.inp-price{width:100px;border:1.5px solid var(--border);border-radius:8px;padding:7px;font-size:13px;font-family:'Inter',sans-serif;outline:none}
.diff-p{color:#059669;font-weight:700}.diff-n{color:#dc2626;font-weight:700}.diff-z{color:#94a3b8}
.sm-inp{border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none}
.sm-inp:focus{border-color:var(--purple-mid)}
.product-tag{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;border:1.5px solid var(--border);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:500;margin:3px}
.product-tag button{background:none;border:none;cursor:pointer;color:var(--text2);font-size:14px;padding:0;line-height:1}
.open-tab{border-color:rgba(5,150,105,0.4) !important}
.mgmt-card h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:1rem}
.va{display:flex;align-items:center;justify-content:center;border-radius:99px;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}

/* USER TABS */
.dt-tab.open-tab{border-color:rgba(5,150,105,0.3);color:#059669}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* RESPONSIVE */
@media(max-width:480px){
  .dash-grid{grid-template-columns:repeat(2,1fr)}
  .prod-grid{grid-template-columns:repeat(2,1fr)}

  .navbar{padding:0 1rem}
  .orders-tbl{font-size:11px}

  .orders-tbl thead tr:nth-child(2) th{padding:4px 4px;font-size:9px}
  .orders-tbl tbody td{padding:6px 5px;font-size:11px}
  .orders-tbl tbody td:first-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
  .dt-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .dt-tab,.dtab{padding:6px 12px;font-size:11px;flex-shrink:0}
  .ntab{padding:5px 11px;font-size:11px}
  .top-bar{padding:8px 1rem;gap:6px;top:56px}
  .arrival-item-header{padding:10px 12px;gap:7px}
}
/* Mobile touch fixes */

function renderDashboard(){
  const grid=document.getElementById('dash-grid');
  const acc=currentUser.access||{};
  const isAdmin=currentUser.role==='admin';
  const today2=getToday(), tomorrow2=getTomorrow();

  // Notification counts
  const regNotif=(isAdmin||(currentUser.regularAccess&&currentUser.regularAccess.viewOrders))
    ? regularOrders.filter(o=>(o.date===today2||o.date===tomorrow2)&&o.submittedAt&&o.userId!==currentUser.id).length : 0;
  const arrNotif=arrivalsDB.filter(a=>a.status==='open'&&!isExpired(a.deadline)).length;
  const shipNotif=procOrders.filter(o=>o.items&&o.items.some(i=>i.status==='placed')).length;

  const icons=[
    {id:'regularOrder',icon:'🛒',title:'Regular Order',sub:'Place daily orders',notif:regNotif,action:()=>{showPage('regular');renderRegularOrder();}},
    {id:'arrival',icon:'🌸',title:'Arrival Management',sub:'Arrivals & salesman orders',notif:arrNotif,action:()=>{showPage('arrival');renderArrivalPage();}},
    {id:'shipment',icon:'📦',title:'Shipment Orders',sub:'Procurement & PO',notif:shipNotif,action:()=>{showPage('shipment');renderShipPage('home');}},
    {id:'stock',icon:'📊',title:'WMS',sub:'Warehouse Management System',notif:0,action:function(){if(currentUser.role==='admin'||currentUser.stockAccess){showPage('stock');renderStockPage();}else{toast('⚠️ No access.');}}},
  {id:'myHistory',icon:'📜',title:'My History',sub:'Past orders & arrivals',notif:0,action:()=>{showPage('myhistory');renderMyHistory();}},
  {id:'analytics',icon:'📊',title:'Analytics',sub:'Demand forecast & trends',notif:0,action:function(){showPage('analytics');renderAnalytics();}},
    {id:'admin',icon:'⚙️',title:'Admin',sub:'Users & access control',notif:0,action:()=>{showPage('admin');renderAdminPage();}},
  ];
  grid.innerHTML='';
  icons.forEach(function(ic){
    const hasAccess=isAdmin
      ||(ic.id==='admin'?false
      :ic.id==='stock'?(currentUser.stockAccess||false)
      :acc[ic.id]);
    const div=document.createElement('div');
    div.className='dash-card'+(hasAccess?'':' locked');
    if(!hasAccess) div.style.cssText='opacity:0.35;cursor:not-allowed';
    div.innerHTML='<div class="dc-icon-wrap">'+ic.icon+'</div><div class="dc-title">'+ic.title+'</div><div class="dc-sub">'+ic.sub+'</div><span class="dc-arrow">›</span>'
      ; // no badge on dashboard cards
    if(ic.id==='admin'){if(isAdmin) div.onclick=ic.action;}
    else if(hasAccess) div.onclick=ic.action;
    grid.appendChild(div);
  });
}

function getToday(){const d=new Date();const offset=d.getTimezoneOffset();const local=new Date(d.getTime()-offset*60000);return local.toISOString().split('T')[0];}
function getTomorrow(){const d=new Date();const offset=d.getTimezoneOffset();d.setDate(d.getDate()+1);const local=new Date(d.getTime()-offset*60000);return local.toISOString().split('T')[0];}
function fmtDateReg(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}

function regEditOrder(e){
  if(e){e.preventDefault();e.stopPropagation();}
  window._regSubmitting=false;
  window._clearBusy=false;
  window._mcActive=false;
  const ord=regularOrders.find(function(o){return o.userId===currentUser.id&&o.date===selRegDate;});
  if(ord){ord.submittedAt=null;saveRegOrderToDB(ord);}
  renderRegularOrder();
}

function regClearOrder(e){
  if(e){e.preventDefault();e.stopPropagation();}
  if(window._clearBusy) return;
  window._clearBusy=true;
  setTimeout(function(){window._clearBusy=false;},3000);
  mobileConfirm('This will delete your current order.',function(){
    const ord=regularOrders.find(function(o){return o.userId===currentUser.id&&o.date===selRegDate;});
    if(ord){
      // Restore stock for previously submitted items
      if(ord._prevItems) restoreStock(ord._prevItems);
      saveStockToDB();
      try{fetch(SB_URL+'/rest/v1/greena_regular_orders?id=eq.'+encodeURIComponent(ord.id),{method:'DELETE',headers:SB_H});}catch(ex){}
      regularOrders=regularOrders.filter(function(o){return !(o.userId===currentUser.id&&o.date===selRegDate);});
      lsSet('g_regular_orders',regularOrders);
    }
    document.querySelectorAll('.prod-inp').forEach(function(inp){inp.value='';});
    toast('✅ Order cleared!');
    setTimeout(function(){renderRegularOrder();},50);
  },function(){});
}

function regSubmitOrder(e){
  if(e){e.preventDefault();e.stopPropagation();}
  if(window._regSubmitting) return;
  window._regSubmitting=true;
  setTimeout(function(){window._regSubmitting=false;},2000);
  const btn=e&&e.target;
  if(btn&&btn.disabled) return;
  if(btn) btn.disabled=true;
  document.querySelectorAll('.prod-inp').forEach(function(inp){
    const val=parseInt(inp.value)||0;
    if(val>0) saveRegLine(inp.dataset.item,inp.dataset.type,val);
  });
  const ord=regularOrders.find(function(o){return o.userId===currentUser.id&&o.date===selRegDate;});
  const hasItems=ord&&Object.values(ord.items||{}).some(function(v){return v&&(v.box>0||v.bunch>0);});
  if(!hasItems){toast('⚠️ Enter at least one qty!');if(btn)btn.disabled=false;return;}

  // Deduct from stock — restore old first if re-submit
  const oldItems=ord._prevItems||{};
  deductStock(oldItems, ord.items);
  ord._prevItems=JSON.parse(JSON.stringify(ord.items));

  ord.submittedAt=new Date().toISOString();
  saveRegOrderToDB(ord);
  saveStockToDB();
  toast('✅ Order submitted for '+fmtDateReg(selRegDate)+'!');
  renderRegularOrder();
}

function renderRegularOrder(){
  window._regSubmitting=false;
  window._clearBusy=false;
  window._mcActive=false;
  if(!selRegDate) selRegDate=getToday();
  if(!selRegCat&&regCats.length) selRegCat=regCats[0].id;

  const canPlace=currentUser.role==='admin'||(currentUser.regularAccess&&currentUser.regularAccess.placeOrder);
  const canView=currentUser.role==='admin'||(currentUser.regularAccess&&currentUser.regularAccess.viewOrders);
  const vBtn=document.getElementById('btn-view-reg-orders');
  if(vBtn){
    vBtn.style.display=canView?'':'none';
    // Update badge
    const badgeEl=document.getElementById('reg-order-badge');
    if(badgeEl&&canView){
      const today2=getToday(),tomorrow2=getTomorrow();
      const newOrders=regularOrders.filter(o=>(o.date===today2||o.date===tomorrow2)&&o.submittedAt&&o.userId!==currentUser.id).length;
      if(newOrders>0){badgeEl.textContent=newOrders;badgeEl.style.display='inline';}
      else{badgeEl.style.display='none';}
    }
  }

  const myOrder=regularOrders.find(o=>o.userId===currentUser.id&&o.date===selRegDate)||{items:{}};

      +'<table style="width:100%;border-collapse:collapse;font-size:12px"><tbody>';

      // Stock indicator — only show if stock is tracked for this product
      const stockQty=stockData[item.name];
      const totalSMCount=Object.keys(creds).filter(function(id){return creds[id]&&creds[id].name;}).length||15;
      const stockDefined=stockQty!==undefined;

function saveRegLine(itemName,type,val){
  let ord=regularOrders.find(function(o){return o.userId===currentUser.id&&o.date===selRegDate;});
  if(!ord){ord={id:'ro_'+Date.now(),userId:currentUser.id,userName:currentUser.name,date:selRegDate,items:{},submittedAt:null};regularOrders.push(ord);}
  if(!ord.items[itemName]) ord.items[itemName]={box:0,bunch:0};
  ord.items[itemName][type]=val;
  lsSet('g_regular_orders',regularOrders);
  // Debounce Supabase save — only save after 1s of no typing
  if(window._regSaveTimer) clearTimeout(window._regSaveTimer);
  window._regSaveTimer=setTimeout(function(){saveRegOrderToDB(ord);},1000);
}

async function renderRegOrdView(){

  let html='<div class="dtabs">';
  dates.forEach(function(d){html+='<button type="button" class="dtab'+(regOrdViewDate===d?' active':'')+'" data-rod="'+d+'">📅 '+fmtDateReg(d)+'</button>';});
  html+='</div>';
  if(regOrdViewDate){
    const canDone=currentUser.role==='admin'||!!currentUser.canViewOrders;
    const dayOrds=regularOrders.filter(o=>o.date===regOrdViewDate&&!o.fulfilledAt);
    const cons={};
    const userNames=[...new Set(dayOrds.map(o=>o.userName))].sort();
    dayOrds.forEach(function(ord){
      Object.entries(ord.items||{}).forEach(function([name,qty]){
        if(!(qty.box||0)&&!(qty.bunch||0)) return;
        if(!cons[name]) cons[name]={box:0,bunch:0,users:{}};
        cons[name].box+=(qty.box||0);cons[name].bunch+=(qty.bunch||0);

        cons[name].users[ord.userName].box+=(qty.box||0);
        cons[name].users[ord.userName].bunch+=(qty.bunch||0);
      });
    });
    const rows=Object.entries(cons);
    if(!rows.length){html+='<div class="no-data"><span class="ico">📭</span><p>No orders for this date.</p></div>';}
    else{
      html+='<div class="orders-wrap"><table class="orders-tbl"><thead><tr><th style="text-align:left;min-width:140px;position:sticky;left:0;background:#1e1b4b">Product</th>';

          +(currentUser.role==='admin'&&uid?'<br><button type="button" onclick="deleteRegOrderAdmin(\''+uid+'\',\''+regOrdViewDate+'\')" style="background:rgba(239,68,68,0.15);border:none;color:#fca5a5;border-radius:4px;padding:2px 6px;font-size:9px;cursor:pointer;margin-top:3px">🗑️ Del</button>':'')
          +(canDone&&uid?'<br><button type="button" onclick="markRegOrderDone(\''+uid+'\',\''+regOrdViewDate+'\')" style="background:#4f46e5;border:none;color:#fff;border-radius:5px;padding:3px 10px;font-size:10px;cursor:pointer;font-weight:700;margin-top:3px">Done</button>':'')
          +'</th>';
      });
      html+='<th colspan="2" style="text-align:center;min-width:100px;background:#312e81">Total</th></tr>';
      // Sub-header row
      html+='<tr><th style="position:sticky;left:0;background:#3730a3"></th>';
      userNames.forEach(function(){html+='<th class="obox" style="text-align:center;font-size:10px;border-left:2px solid rgba(255,255,255,0.15)">Box</th><th class="obunch" style="text-align:center;font-size:10px;border-right:2px solid rgba(255,255,255,0.15)">Bunch</th>';});
      html+='<th class="obox" style="text-align:center;font-size:10px">Box</th><th class="obunch" style="text-align:center;font-size:10px">Bunch</th></tr></thead><tbody>';

      // Group by category
      const allPhotos=lsGet('g_photos',{});
      const productNames=Object.keys(cons);
      const usedCats=[];
      const uncategorized=[];

      cats.forEach(function(cat){
        const catProducts=cat.items.filter(function(i){return productNames.includes(i.name);});
        if(catProducts.length>0) usedCats.push({cat:cat,products:catProducts.map(function(i){return i.name;})});
      });
      const categorizedNames=usedCats.reduce(function(a,c){return a.concat(c.products);},[]);
      productNames.forEach(function(n){if(!categorizedNames.includes(n)) uncategorized.push(n);});

      function renderRow(name){
        const data=cons[name];
        const src=allPhotos[name]||photos[name]||'';
        let row='<tr><td style="position:sticky;left:0;background:var(--white);z-index:2"><div style="display:flex;align-items:center;gap:6px">'
          +(src?'<img src="'+src+'" style="width:22px;height:22px;border-radius:4px;object-fit:cover;flex-shrink:0"/>':'<span style="font-size:14px">🌸</span>')
          +'<span style="font-weight:500;font-size:12px">'+name+'</span></div></td>';
        userNames.forEach(function(u){const o=data.users[u]||{box:0,bunch:0};

          +'<td class="total-col '+(data.bunch>0?'obunch':'zero')+'" style="text-align:center">'+(data.bunch||'—')+'</td></tr>';
        return row;
      }

      // Render category groups
      usedCats.forEach(function(uc){
        const catTotalBox=uc.products.reduce(function(a,n){return a+(cons[n]?.box||0);},0);
        const catTotalBunch=uc.products.reduce(function(a,n){return a+(cons[n]?.bunch||0);},0);

          +'<span style="width:8px;height:8px;border-radius:50%;background:'+uc.cat.color+';display:inline-block;flex-shrink:0"></span>'
          +'<span>'+uc.cat.label+'</span>'
          +(catTotalBox>0?'<span style="font-size:10px;background:rgba(79,70,229,0.12);color:#4f46e5;padding:1px 7px;border-radius:99px;font-weight:600">'+catTotalBox+' Box</span>':'')
          +(catTotalBunch>0?'<span style="font-size:10px;background:rgba(5,150,105,0.12);color:#059669;padding:1px 7px;border-radius:99px;font-weight:600">'+catTotalBunch+' Bunch</span>':'')
          +'</div></td></tr>';
        uc.products.forEach(function(name){html+=renderRow(name);});
      });
      if(uncategorized.length){
        html+='<tr class="cat-row"><td colspan="'+(userNames.length*2+3)+'">Other</td></tr>';
        uncategorized.forEach(function(name){html+=renderRow(name);});
      }

      const tb=rows.reduce(function(a,r){return a+r[1].box;},0);
      const tn=rows.reduce(function(a,r){return a+r[1].bunch;},0);
      html+='<tfoot><tr class="grand-row"><td colspan="'+(userNames.length*2+1)+'" style="position:sticky;left:0;background:#1e1b4b">🌸 Grand Total</td><td style="text-align:center">'+tb+'</td><td style="text-align:center">'+tn+'</td></tr></tfoot></tbody></table></div>';
    }
  }
  el.innerHTML=html;
  el.querySelectorAll('.dtab[data-rod]').forEach(btn=>btn.addEventListener('click',function(){regOrdViewDate=this.dataset.rod;renderRegOrdView();}));
  el.querySelectorAll('[data-delusr]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      deleteRegOrderAdmin(this.dataset.delusr,this.dataset.deldate);
    });
  });
}


async function markRegOrderDone(userId,date){
  const ord=regularOrders.find(function(o){return o.userId===userId&&o.date===date;});
  if(!ord){toast('⚠️ Order not found.');return;}
  if(ord.fulfilledAt){
    // Undo — no confirm needed
    ord.fulfilledAt=null;
    try{await fetch(SB_URL+'/rest/v1/greena_regular_orders?id=eq.'+encodeURIComponent(ord.id),{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},SB_H),body:JSON.stringify({fulfilled_at:null})});}catch(e){}
    toast('↩️ Unmarked.');
    lsSet('g_regular_orders',regularOrders);
    renderRegOrdView();
  }else{
    mobileConfirm('Mark this order as Done? It will be removed from View Orders.',function(){
      ord.fulfilledAt=new Date().toISOString();
      fetch(SB_URL+'/rest/v1/greena_regular_orders?id=eq.'+encodeURIComponent(ord.id),{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},SB_H),body:JSON.stringify({fulfilled_at:ord.fulfilledAt})}).catch(function(){});
      toast('✅ Done!');
      lsSet('g_regular_orders',regularOrders);
      renderRegOrdView();
    });
  }
}

function markArrOrderDone(arrId,userId){
  const arr=arrivalsDB.find(function(a){return a.id===arrId;});
  if(!arr){toast('⚠️ Not found.');return;}
  if(!arr.fulfilledOrders) arr.fulfilledOrders={};
  if(arr.fulfilledOrders[userId]){
    // Undo — no confirm needed
    delete arr.fulfilledOrders[userId];
    toast('↩️ Unmarked.');
    arrSaveAll();
    renderAdminOrdersTab();
  }else{
    mobileConfirm('Mark this order as Done? It will be removed from View Orders.',function(){
      arr.fulfilledOrders[userId]=new Date().toISOString();
      toast('✅ Done!');
      arrSaveAll();
      renderAdminOrdersTab();
    });
  }
}

function dlRegularOrders(){
  if(!regOrdViewDate){toast('⚠️ Select date.');return;}
  const dayOrds=regularOrders.filter(function(o){return o.date===regOrdViewDate&&!o.fulfilledAt;});
  if(!dayOrds.length){toast('⚠️ No orders.');return;}

  // Only include salesman who actually ordered something
  const smList=[...new Set(dayOrds.filter(function(o){
    return Object.values(o.items||{}).some(function(q){return q&&((q.box||0)+(q.bunch||0)>0);});
  }).map(function(o){return o.userName;}))].sort();

  // Build product data
  const cons={};
  dayOrds.forEach(function(ord){
    Object.entries(ord.items||{}).forEach(function(e){
      const n=e[0],q=e[1];
      if(!q||(!q.box&&!q.bunch)) return;
      if(!cons[n]) cons[n]={box:0,bunch:0,users:{}};
      cons[n].box+=(q.box||0);
      cons[n].bunch+=(q.bunch||0);
      if(!cons[n].users[ord.userName]) cons[n].users[ord.userName]={box:0,bunch:0};
      cons[n].users[ord.userName].box+=(q.box||0);
      cons[n].users[ord.userName].bunch+=(q.bunch||0);
    });
  });

  // Header row — Box + Bunch per salesman
  let csv='Greena — Regular Orders\n';
  csv+='Date,'+fmtDateReg(regOrdViewDate)+'\n\n';

  function smVal(b,bn){if(b>0&&bn>0)return b+' Box + '+bn+' Bunch';if(b>0)return b+' Box';if(bn>0)return bn+' Bunch';return '-';}
  csv+='Category,Product,'+smList.map(function(u){return '"'+u+'"';}).join(',')+',"Total"\n';

  const productNames=Object.keys(cons);
  const smGrand={};
  smList.forEach(function(u){smGrand[u]={box:0,bunch:0};});

  cats.forEach(function(cat){
    const catProducts=cat.items.filter(function(i){return productNames.includes(i.name);});
    if(!catProducts.length) return;
    const smCat={};smList.forEach(function(u){smCat[u]={box:0,bunch:0};});
    let catBox=0,catBunch=0;
    catProducts.forEach(function(item){
      const d=cons[item.name];
      const smVals=smList.map(function(u){
        const ud=d.users[u]||{box:0,bunch:0};
        smCat[u].box+=(ud.box||0);smCat[u].bunch+=(ud.bunch||0);
        return '"'+smVal(ud.box||0,ud.bunch||0)+'"';
      }).join(',');
      csv+='"'+cat.label+'","'+item.name+'",'+smVals+',"'+smVal(d.box||0,d.bunch||0)+'"\n';
      catBox+=d.box||0;catBunch+=d.bunch||0;
    });
    const smCatVals=smList.map(function(u){
      smGrand[u].box+=smCat[u].box;smGrand[u].bunch+=smCat[u].bunch;
      return '"'+smVal(smCat[u].box,smCat[u].bunch)+'"';
    }).join(',');
    csv+='"'+cat.label+' SUBTOTAL","",'+smCatVals+',"'+smVal(catBox,catBunch)+'"\n\n';
  });

  const catNames=cats.reduce(function(a,c){return a.concat(c.items.map(function(i){return i.name;}));}, []);
  const uncatProducts=productNames.filter(function(n){return !catNames.includes(n);});
  if(uncatProducts.length){
    uncatProducts.forEach(function(name){
      const d=cons[name];
      const smVals=smList.map(function(u){const ud=d.users[u]||{box:0,bunch:0};return '"'+smVal(ud.box,ud.bunch)+'"';}).join(',');
      csv+='"Other","'+name+'",'+smVals+',"'+smVal(d.box||0,d.bunch||0)+'"\n';
    });
    csv+='\n';
  }

  const smGrandVals=smList.map(function(u){return '"'+smVal(smGrand[u].box,smGrand[u].bunch)+'"';}).join(',');
  const gtBox=smList.reduce(function(a,u){return a+(smGrand[u].box||0);},0);
  const gtBunch=smList.reduce(function(a,u){return a+(smGrand[u].bunch||0);},0);
  csv+='"GRAND TOTAL","",'+smGrandVals+',"'+smVal(gtBox,gtBunch)+'"\n';


  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='RegOrders_'+regOrdViewDate+'.csv';
  a.click();
  toast('✅ Downloaded!');
}

// Arrival page router
function renderArrivalPage(tab){
  _currentAdminTab = tab || 'arrivals';
  // Update tabs in top bar
  const tabsEl = document.getElementById('arr-tabs');
  if(tabsEl){
    if(currentUser.role==='admin'){
      const tabs=[
        {id:'arrivals',label:'📦 Arrivals'},{id:'orders',label:'📋 Orders'},
        {id:'history',label:'🗓️ History'},{id:'catalog',label:'🗂️ Catalog'},
        {id:'users',label:'👥 Users'},{id:'settings',label:'⚙️ Settings'},
      ];
      tabsEl.innerHTML=tabs.map(function(tb){
        var badge='';
        if(tb.id==='orders'){
          var cnt=arrivalsDB.reduce(function(a,arr){return a+Object.keys(arr.orders||{}).filter(function(uid){return Object.values(arr.orders[uid]||{}).some(function(v){return v&&(v.box>0||v.bunch>0);});}).length;},0);
          if(cnt>0) badge='<span style="background:#e53935;color:#fff;border-radius:99px;padding:1px 6px;font-size:9px;font-weight:700;margin-left:4px">'+cnt+'</span>';
        }
        return '<button type="button" class="ntab'+(_currentAdminTab===tb.id?' active':'')+'" data-arrtab="'+tb.id+'">'+tb.label+badge+'</button>';
      }).join('');
      tabsEl.querySelectorAll('[data-arrtab]').forEach(btn=>{
        btn.addEventListener('click',function(){renderArrivalPage(this.dataset.arrtab);});
      });
    } else {
      tabsEl.innerHTML='';
    }
    if(_currentAdminTab==='myhistory') renderUserHistory();
  }
  // tab-body must exist for flowers system functions
  const tabBody = document.getElementById('tab-body');
  if(!tabBody) return;
  tabBody.innerHTML='';
  if(currentUser.role==='admin'){
    if(_currentAdminTab==='arrivals') renderArrivalsTab();
    else if(_currentAdminTab==='orders') renderAdminOrdersTab();

function _hash(obj){return JSON.stringify(obj);}

  return el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT');

async function syncAll(){
  if(!currentUser) return;
  const page=_currentPage();

  // ── 1. SYNC CREDS (permissions) ──────────────────────────────
  try{
    const r=await fetch(SB_URL+'/rest/v1/greena_creds?select=id,data',{headers:SB_H});
    if(r.ok){
      const rows=await r.json();
      const newHash=_hash(rows);
      if(newHash!==_lastCredsHash){
        _lastCredsHash=newHash;
        rows.forEach(function(row){if(row.id&&row.data)creds[row.id]=row.data;});
        lsSet('g_creds',creds);
        if(currentUser&&currentUser.role!=='admin'&&creds[currentUser.id]){
          // Force update current user session with new permissions
          const fresh=creds[currentUser.id];
          const oldAccess=JSON.stringify(currentUser.access);
          const newAccess=JSON.stringify(fresh.access);
          Object.assign(currentUser,fresh);
          currentUser.id=currentUser.id||currentUser.id;
          lsSet('g_session',currentUser);
          // Always re-render dashboard when creds change
          renderDashboard();
          if(page==='arrival'&&!_isTyping()) renderArrivalPage(_currentAdminTab);
        }
        if(currentUser&&currentUser.role==='admin'&&page==='admin') renderAdminPage();
      }
    }
  }catch(e){}

  // ── 2. SYNC CATS ──────────────────────────────────────────────
  try{
    const r=await fetch(SB_URL+'/rest/v1/greena_cats?id=eq.main',{headers:SB_H});
    if(r.ok){
      const rows=await r.json();
      const newHash=_hash(rows);
      if(newHash!==_lastCatsHash&&rows.length&&rows[0].data){
        _lastCatsHash=newHash;
        cats=rows[0].data;regCats=cats;lsSet('g_cats',cats);
        if(page==='regular'&&!_isTyping()) renderRegularOrder();
      }
    }
  }catch(e){}

  // ── 3. SYNC ARRIVALS ──────────────────────────────────────────
  try{
    const r=await fetch(SB_URL+'/rest/v1/greena_arrivals?select=id,data',{headers:SB_H});
    if(r.ok){
      const rows=await r.json();
      const newHash=_hash(rows);
      if(newHash!==_lastArrivalsHash){
        _lastArrivalsHash=newHash;
        arrivalsDB=rows.map(function(r){return r.data;}).filter(function(a){return a&&!a.archived;});
        lsSet('g_arrivals_db',arrivalsDB);
        autoArchiveExpired();
        if(page==='arrival'&&!_isTyping()) renderArrivalPage(_currentAdminTab);
        if(page==='home') renderDashboard();
      }
    }
  }catch(e){}

  // ── 4. SYNC REGULAR ORDERS ────────────────────────────────────
  try{
    const r=await fetch(SB_URL+'/rest/v1/greena_regular_orders?select=*&order=date.desc&limit=500',{headers:SB_H});
    if(r.ok){
      const rows=await r.json();
      const newHash=_hash(rows);
      if(newHash!==_lastRegHash){
        _lastRegHash=newHash;
        regularOrders=rows.map(function(r){return {id:r.id,userId:r.user_id,userName:r.user_name,date:r.date,items:r.items||{},submittedAt:r.submitted_at,fulfilledAt:r.fulfilled_at||null};});
        lsSet('g_regular_orders',regularOrders);
        if(page==='reg-orders') renderRegOrdView();
        // Update badge
        const badge=document.getElementById('reg-order-badge');
        if(badge){
          const t2=getToday(),tm=getTomorrow();
          const cnt=regularOrders.filter(function(o){return (o.date===t2||o.date===tm)&&o.submittedAt&&o.userId!==currentUser.id;}).length;
          badge.textContent=cnt;badge.style.display=cnt>0?'inline':'none';
        }
      }
    }
  }catch(e){}
}

function startPolling(){
  if(_pollTimer) return;
  // Immediate first sync
  syncAll();
  _pollTimer=setInterval(syncAll,3000);
}
function stopPolling(){if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}}

function saveArrivalDates(arrId){
  const idx=arrivalsDB.findIndex(function(a){return a.id===arrId;});
  if(idx<0){toast('⚠️ Arrival not found.');return;}
  const newDate=document.getElementById('edit-date-'+arrId)?.value;
  const newDeadline=document.getElementById('edit-deadline-'+arrId)?.value;
  const newDivide=parseInt(document.getElementById('edit-divide-'+arrId)?.value)||15;
  if(!newDate){toast('⚠️ Select arrival date.');return;}
  arrivalsDB[idx].arrDate=newDate;
  arrivalsDB[idx].deadline=newDeadline||null;
  arrivalsDB[idx].divideBy=newDivide;
  lsSet('g_arrivals_db',arrivalsDB);
  // Save to Supabase
  fetch(SB_URL+'/rest/v1/greena_arrivals',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:arrivalsDB[idx].id,data:arrivalsDB[idx]}])
  }).then(function(){toast('✅ Dates saved!');})
  .catch(function(){toast('✅ Dates saved locally!');});
  renderArrivalPage(_currentAdminTab);
}

function createArrival(){

  const newArr={id,arrDate:ad,deadline:dl,status:'open',divideBy:divBy,origin:origin,arrivals:{},orders:{},credSnapshot:{},createdAt:new Date().toISOString()};

function autoSaveArrQty(input){
  const arrId=input.dataset.arrid;
  if(!arrId) return;
  if(window._arrQtyTimer) clearTimeout(window._arrQtyTimer);
  window._arrQtyTimer=setTimeout(function(){
    saveArrivalQty(arrId);
  },1000);
}

function saveArrivalQty(arrId){
  const idx=arrivalsDB.findIndex(function(a){return a.id===arrId;});if(idx<0)return;
  cats.forEach(function(cat){cat.items.forEach(function(item){
    const b=parseInt(document.getElementById('abox-'+arrId+'-'+eid(item.name))?.value)||0;
    const u=parseInt(document.getElementById('abun-'+arrId+'-'+eid(item.name))?.value)||0;
    if(b>0||u>0){
      arrivalsDB[idx].arrivals[item.name]={box:b,bunch:u};
    } else {
      // Zero = remove product from arrival
      delete arrivalsDB[idx].arrivals[item.name];
    }
  });});
  lsSet('g_arrivals_db',arrivalsDB);
  // ⚡ Sync WMS stock whenever arrival qty saved
  if(arrivalsDB[idx].status==='open') syncArrivalToWmsStock(arrivalsDB[idx]);
  fetch(SB_URL+'/rest/v1/greena_arrivals',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:arrivalsDB[idx].id,data:arrivalsDB[idx]}])
  }).then(function(){toast('✅ Quantities saved!');}).catch(function(){toast('✅ Saved locally!');});
}
function publishArrival(arrId){
  // Save qty first without re-render
  const idx=arrivalsDB.findIndex(function(a){return a.id===arrId;});if(idx<0)return;
  cats.forEach(function(cat){cat.items.forEach(function(item){
    const b=parseInt(document.getElementById('abox-'+arrId+'-'+eid(item.name))?.value)||0;
    const u=parseInt(document.getElementById('abun-'+arrId+'-'+eid(item.name))?.value)||0;
    if(b||u) arrivalsDB[idx].arrivals[item.name]={box:b,bunch:u};
  });});
  arrivalsDB[idx].status='open';
  arrivalsDB[idx].credSnapshot=Object.fromEntries(Object.entries(creds).map(function(e){return [e[0],{name:e[1].name}];}));

  // ⚡ AUTO-ADD STOCK TO WMS when arrival is published
  syncArrivalToWmsStock(arrivalsDB[idx]);

  lsSet('g_arrivals_db',arrivalsDB);
  fetch(SB_URL+'/rest/v1/greena_arrivals',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:arrivalsDB[idx].id,data:arrivalsDB[idx]}])
  }).then(function(){toast('✅ Published!');}).catch(function(){toast('✅ Published (offline)!');});
  renderArrivalPage(_currentAdminTab);
}
function closeArrival(id){
  const idx=arrivalsDB.findIndex(function(a){return a.id===id;});if(idx<0)return;
  if(!confirm('Close this arrival and move to History?')) return;
  const arr=arrivalsDB[idx];
  arr.status='closed';
  arr.archived=true;
  arr.archivedOn=new Date().toISOString();

  // Build history snapshot
  const histDB=window._historyDB||lsGet('g_history',[]);
  const alreadyIn=histDB.find(function(h){return h.id===arr.id;});
  if(!alreadyIn){
    const snap={
      id:arr.id,arrDate:arr.arrDate,deadline:arr.deadline,
      divideBy:arr.divideBy||15,
      archivedOn:arr.archivedOn,
      arrivals:JSON.parse(JSON.stringify(arr.arrivals||{})),
      orders:JSON.parse(JSON.stringify(arr.orders||{})),
      credSnapshot:arr.credSnapshot&&Object.keys(arr.credSnapshot).length
        ?JSON.parse(JSON.stringify(arr.credSnapshot))
        :Object.fromEntries(Object.entries(creds).map(function(e){return [e[0],{name:e[1].name}];}))
    };
    histDB.unshift(snap);
    window._historyDB=histDB;
    lsSet('g_history',histDB);
    // Save to history in Supabase
    fetch(SB_URL+'/rest/v1/greena_history',{method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify([{id:snap.id,data:snap}])}).catch(function(){});
  }

  // Remove from active arrivals
  arrivalsDB=arrivalsDB.filter(function(a){return a.id!==id;});
  lsSet('g_arrivals_db',arrivalsDB);
  // Delete from arrivals table in Supabase
  fetch(SB_URL+'/rest/v1/greena_arrivals?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:SB_H}).catch(function(){});

  toast('✅ Arrival closed and moved to History!');
  renderArrivalPage(_currentAdminTab);
}
function reopenArrival(id){
  const idx=arrivalsDB.findIndex(function(a){return a.id===id;});if(idx<0)return;
  arrivalsDB[idx].status='open';
  lsSet('g_arrivals_db',arrivalsDB);
  fetch(SB_URL+'/rest/v1/greena_arrivals',{method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify([{id:arrivalsDB[idx].id,data:arrivalsDB[idx]}])}).catch(function(){});
  toast(t('toastReopened'));renderArrivalPage(_currentAdminTab);
}
function deleteArrival(id){

function handlePhotoInput(inp){

  const name=allItems().find(i=>eid(i.name)===en);

function handlePhoto(name,e,inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    photos[name]=ev.target.result;
    // Save to localStorage
    try{localStorage.setItem('g_photos',JSON.stringify(photos));}catch{toast('⚠️ Storage full!');}
    // Save to Supabase so all devices can see
    savePhotoToDB(name, ev.target.result);
    // Update UI
    const el=document.getElementById('pi-'+e);
    if(el){
      if(el.tagName==='DIV'){
        const img=document.createElement('img');
        img.className='item-img';img.id='pi-'+e;
        img.src=ev.target.result;img.alt=name;
        el.parentNode.replaceChild(img,el);
      } else el.src=ev.target.result;
    }
    toast('✅ Photo saved: '+name);
  };
  r.readAsDataURL(f);
}

async function deletePhoto(name, e){
  if(!confirm('Delete photo for "'+name+'"?')) return;
  delete photos[name];
  // Remove from localStorage
  try{localStorage.setItem('g_photos', JSON.stringify(photos));}catch{}
  // Remove from Supabase
  try{
    await fetch(`${SB_URL}/rest/v1/fl_photos?item_name=eq.${encodeURIComponent(name)}`,{method:'DELETE',headers:SB_H});
  } catch(err){ console.error(err); }
  // Update UI — replace img with emoji
  const el=document.getElementById('pi-'+e);
  if(el){
    const item=allItems().find(i=>i.name===name)||{emoji:'🌸'};
    const ph=document.createElement('div');
    ph.className='item-ph'; ph.id='pi-'+e;
    ph.textContent=item.emoji;
    el.parentNode.replaceChild(ph, el);
  }
  // Remove delete button
  const btn=el?.parentNode?.querySelector('button[title="Delete photo"]');
  if(btn) btn.remove();
  toast('🗑️ Photo deleted!');
}
function renderAdminOrdersTab(){
  let tb=document.getElementById('tab-body');if(!tb){renderArrivalPage('orders');return;}
  if(!arrivalsDB.length){tb.innerHTML='<div class="no-data"><span class="icon">📋</span><p>No arrivals yet.</p></div>';return;}
  const sorted=[...arrivalsDB].sort(function(a,b){return new Date(b.arrDate)-new Date(a.arrDate);}).filter(function(arr){
    // Hide arrival if ALL salesmen who ordered are marked done
    const credData=arr.credSnapshot&&Object.keys(arr.credSnapshot).length?arr.credSnapshot:creds;
    const orderedIds=Object.keys(arr.orders||{}).filter(function(uid){return Object.values(arr.orders[uid]||{}).some(function(v){return v&&(v.box>0||v.bunch>0);});});
    if(!orderedIds.length) return true; // no orders yet — keep showing
    return orderedIds.some(function(uid){return !(arr.fulfilledOrders&&arr.fulfilledOrders[uid]);});
  });
  if(!adminOrderTab||!sorted.find(function(a){return a.id===adminOrderTab;})) adminOrderTab=sorted[0].id;
  const sel=sorted.find(function(a){return a.id===adminOrderTab;});
  const totalOrders=sel?Object.keys(sel.orders||{}).filter(function(uid){return Object.values(sel.orders[uid]||{}).some(function(v){return v&&(v.box>0||v.bunch>0);});}).length:0;

  let html='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1rem">'
    +'<span style="font-size:12px;font-weight:700;color:var(--text2)">📅 Arrival Date:</span>'
    +'<select id="orders-date-sel" style="border:1.5px solid var(--border);border-radius:9px;padding:7px 14px;font-size:13px;font-family:Inter,sans-serif;min-width:200px">'
    +sorted.map(function(arr){
      const cnt=Object.keys(arr.orders||{}).filter(function(uid){return Object.values(arr.orders[uid]||{}).some(function(v){return v&&(v.box>0||v.bunch>0);});}).length;
      const open=arr.status==='open'&&!isExpired(arr.deadline);
      return '<option value="'+arr.id+'" '+(adminOrderTab===arr.id?'selected':'')+'>'+fmtDate(arr.arrDate)+' — '+(open?'Open':'Closed')+' ('+cnt+' orders)</option>';
    }).join('')
    +'</select>'
    +(totalOrders>0?'<span style="font-size:12px;color:var(--text2)"><strong>'+totalOrders+'</strong> salesman ordered</span>':'')
    +'</div>'
    +'<div id="orders-content"></div>';

  tb.innerHTML=html;
  tb.querySelector('#orders-date-sel').addEventListener('change',function(){
    adminOrderTab=this.value;renderAdminOrdersTab();

function renderOrdersTable(containerId, arrObj, showDownload){
  const el=document.getElementById(containerId);if(!el)return;
  const credData=arrObj.credSnapshot&&Object.keys(arrObj.credSnapshot).length?arrObj.credSnapshot:creds;
  // Include all salesmen who ordered + all from credData, minus admin and fulfilled
  const orderedIds=Object.keys(arrObj.orders||{}).filter(function(uid){
    return uid!=='admin'&&Object.values(arrObj.orders[uid]||{}).some(function(v){return v&&(v.box>0||v.bunch>0);});
  });
  const credIds=Object.keys(credData).filter(function(id){return id!=='admin';});

  const smIds=allIds.filter(function(id){return !(arrObj.fulfilledOrders&&arrObj.fulfilledOrders[id]);});

      +(_canDone?'<br><button type="button" onclick="markArrOrderDone(\''+arrObj.id+'\',\''+sid+'\')" style="background:'+(_isFulfilled?'#059669':'#4f46e5')+';border:none;color:#fff;border-radius:5px;padding:3px 10px;font-size:10px;cursor:pointer;font-weight:700;margin-top:3px">'+(_isFulfilled?'✅ Done':'Done')+'</button>':'')
      +'</th>';

      const a=getA(arrObj.arrivals,item.name);
      const rB=smIds.reduce(function(x,s){return x+getO(arrObj.orders,s,item.name).box;},0);
      const rBu=smIds.reduce(function(x,s){return x+getO(arrObj.orders,s,item.name).bunch;},0);
      const overBox=rB>a.box&&a.box>0;
      const overBunch=rBu>a.bunch&&a.bunch>0;
      cAB+=a.box;cABu+=a.bunch;cTB+=rB;cTBu+=rBu;
      gAB+=a.box;gABu+=a.bunch;gTB+=rB;gTBu+=rBu;

      html+='<tr>'
        +'<td><div style="display:flex;align-items:center;gap:6px">'
        +(photos[item.name]?'<img src="'+photos[item.name]+'" style="width:22px;height:22px;border-radius:4px;object-fit:cover;flex-shrink:0"/>'
          :'<span style="font-size:14px">'+item.emoji+'</span>')
        +'<span>'+item.name+'</span>'
        +(overBox||overBunch?'<span style="color:#e74c3c;font-size:10px" title="Over arrival">⚠️</span>':'')
        +'</div></td>'
        +'<td class="arrived-col '+(a.box>0?'obox':'zero')+'">'+( a.box||'—')+'</td>'
        +'<td class="arrived-col '+(a.bunch>0?'obunch':'zero')+'">'+( a.bunch||'—')+'</td>';

      smIds.forEach(function(sid){
        const o=getO(arrObj.orders,sid,item.name);
        const ob=o.box,ou=o.bunch;
        const obOver=ob>a.box&&a.box>0;
        const ouOver=ou>a.bunch&&a.bunch>0;
        scB[sid]+=ob;scBu[sid]+=ou;
        smGrandB[sid]+=ob;smGrandBu[sid]+=ou;
        html+='<td class="'+(ob===0?'zero':'obox')+(obOver?' over':'')+'">'+( ob||'—')+'</td>'
          +'<td class="'+(ou===0?'zero':'obunch')+(ouOver?' over':'')+'">'+( ou||'—')+'</td>';
      });

      html+='<td class="total-col '+(rB>0?'obox':'zero')+(overBox?' over':'')+'">'+( rB||'—')+'</td>'
        +'<td class="total-col '+(rBu>0?'obunch':'zero')+(overBunch?' over':'')+'">'+( rBu||'—')+'</td></tr>';
    });

    // Subtotal row
    html+='<tr class="sub-row"><td style="padding-left:12px">↳ '+cat.label+' subtotal</td>'
      +'<td>'+( cAB||'—')+'</td><td>'+(cABu||'—')+'</td>';
    smIds.forEach(function(s){html+='<td>'+(scB[s]||'—')+'</td><td>'+(scBu[s]||'—')+'</td>';});
    html+='<td>'+(cTB||'—')+'</td><td>'+(cTBu||'—')+'</td></tr>';
  });

  // Grand total
  html+='<tr class="grand-row"><td>🌸 Grand Total</td>'
    +'<td>'+(gAB||'—')+'</td><td>'+(gABu||'—')+'</td>';
  smIds.forEach(function(s){html+='<td>'+(smGrandB[s]||'—')+'</td><td>'+(smGrandBu[s]||'—')+'</td>';});
  html+='<td>'+(gTB||'—')+'</td><td>'+(gTBu||'—')+'</td></tr>'
    +'</tbody></table></div>';

  el.innerHTML=html;

  // Events
  const dlBtn=el.querySelector('[data-dlid]');
  if(dlBtn) dlBtn.addEventListener('click',function(){downloadExcel(this.dataset.dlid);});
}


// ── AUTO-ARCHIVE: check & archive any arrival whose deadline has passed ────────
function autoArchiveExpired(){
  let changed=false;
  const histDB=lsGet('g_history',[]);
  arrivalsDB.forEach(function(arr){
    // Only archive if MANUALLY closed (status==='closed') — NOT by deadline
    if(arr.status==='closed'&&!arr.archived){
      arr.archived=true;
      const alreadyIn=histDB.find(function(h){return h.id===arr.id;});
      if(!alreadyIn){
        const snap={
          id:arr.id,arrDate:arr.arrDate,deadline:arr.deadline,
          divideBy:arr.divideBy||15,
          archivedOn:new Date().toISOString(),
          arrivals:JSON.parse(JSON.stringify(arr.arrivals||{})),
          orders:JSON.parse(JSON.stringify(arr.orders||{})),
          credSnapshot:arr.credSnapshot&&Object.keys(arr.credSnapshot).length
            ?JSON.parse(JSON.stringify(arr.credSnapshot))
            :Object.fromEntries(Object.entries(creds).map(function(e){return [e[0],{name:e[1].name}];}))
        };
        histDB.unshift(snap);
        // Save to Supabase
        try{
          fetch(SB_URL+'/rest/v1/greena_history',{method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify([{id:snap.id,data:snap}])});
          // Delete from arrivals table
          fetch(SB_URL+'/rest/v1/greena_arrivals?id=eq.'+encodeURIComponent(arr.id),{method:'DELETE',headers:SB_H});
        }catch(e){}
      }
      changed=true;
    }
  });
  if(changed){
    arrivalsDB=arrivalsDB.filter(function(a){return !a.archived;});
    window._historyDB=histDB;
    lsSet('g_history',histDB);
    lsSet('g_arrivals_db',arrivalsDB);
    // Async save to Supabase
    try{const _rows=arrivalsDB.map(function(a){return {id:a.id,data:a};});fetch(SB_URL+'/rest/v1/greena_arrivals',{method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(_rows)});}catch(e){}
  }
}

async function saveHistoryDates(arrId){
  const newArrDate=document.getElementById('eh-arrdate')?.value;
  const newDeadline=document.getElementById('eh-deadline')?.value;
  const reactivate=document.getElementById('eh-reactivate')?.checked;
  if(!newArrDate){toast('⚠️ Arrival date required.');return;}

  const histDB=window._historyDB||lsGet('g_history',[]);
  const idx=histDB.findIndex(function(a){return a.id===arrId;});
  if(idx<0){toast('⚠️ Not found.');return;}

  const arr=histDB[idx];
  arr.arrDate=newArrDate;
  arr.deadline=newDeadline||'';

  if(reactivate){
    // Remove from history
    arr.archived=false;
    histDB.splice(idx,1);
    window._historyDB=histDB;
    lsSet('g_history',histDB);
    // Save history to Supabase
    await fetch(SB_URL+'/rest/v1/greena_history?id=eq.'+encodeURIComponent(arrId),{method:'DELETE',headers:SB_H}).catch(function(){});
    // Add back to active arrivals
    arrivalsDB.push(arr);
    lsSet('g_arrivals_db',arrivalsDB);
    await fetch(SB_URL+'/rest/v1/greena_arrivals',{
      method:'POST',
      headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{id:arr.id,data:arr}])
    }).catch(function(){});
    toast('✅ Moved back to active arrivals!');
  } else {
    // Just update dates in history
    window._historyDB=histDB;
    lsSet('g_history',histDB);
    await fetch(SB_URL+'/rest/v1/greena_history',{
      method:'POST',
      headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{id:arr.id,data:arr}])
    }).catch(function(){});
    toast('✅ Dates updated!');
  }

  closeModal();
  renderHistoryTab();
}

async function reopenFromHistory(arrId){
  if(!confirm('Move this arrival back to Active Arrivals?')) return;
  const histDB=window._historyDB||lsGet('g_history',[]);
  const idx=histDB.findIndex(function(h){return h.id===arrId;});
  if(idx<0){toast('⚠️ Not found.');return;}
  const arr=histDB[idx];
  // Reset status
  arr.status='open';
  arr.archived=false;
  delete arr.archivedOn;
  // Remove from history
  histDB.splice(idx,1);
  window._historyDB=histDB;
  lsSet('g_history',histDB);
  // Delete from history in Supabase
  await fetch(SB_URL+'/rest/v1/greena_history?id=eq.'+encodeURIComponent(arrId),{method:'DELETE',headers:SB_H}).catch(function(){});
  // Add back to active arrivals
  arrivalsDB.push(arr);
  lsSet('g_arrivals_db',arrivalsDB);
  await fetch(SB_URL+'/rest/v1/greena_arrivals',{
    method:'POST',
    headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:arr.id,data:arr}])
  }).catch(function(){});
  toast('✅ Arrival moved back to Active!');
  window._selHistDate=null;
  renderHistoryTab();
}

async function renderHistoryTab(){
  autoArchiveExpired();
  let tb=document.getElementById('tab-body');
  if(!tb){renderArrivalPage('history');return;}

  // Load from Supabase fresh
  const rows=await sbGet('greena_history');
  let histDB=[];
  if(rows&&rows.length){
    histDB=rows.map(function(r){return r.data;}).filter(Boolean);
    window._historyDB=histDB;
    lsSet('g_history',histDB);
  } else {
    histDB=lsGet('g_history',[]);
    window._historyDB=histDB;
  }

  if(!histDB.length){
    tb.innerHTML='<div class="no-data"><span class="ico">🗓️</span><p>No history yet. Arrivals move here after deadline passes.</p></div>';
    return;
  }

  // Group by arrDate
  const byDate={};
  histDB.forEach(function(h){
    const d=h.arrDate||'unknown';
    if(!byDate[d]) byDate[d]=[];
    byDate[d].push(h);
  });

  let html='';
  let selHistDate=window._selHistDate||null;
  if(!selHistDate||!byDate[selHistDate]) selHistDate=Object.keys(byDate).sort().reverse()[0];
  window._selHistDate=selHistDate;

  // Date tabs
  html+='<div class="dt-tabs" style="margin-bottom:1rem">';
  Object.keys(byDate).sort().reverse().forEach(function(date){
    const count=byDate[date].length;
    html+='<button type="button" class="dt-tab'+(selHistDate===date?' active':'')+'" data-histdate="'+date+'">'
      +'📅 '+fmtDate(date)
      +'<span style="font-size:10px;margin-left:5px;opacity:0.8">('+count+')</span>'
      +'</button>';
  });
  html+='</div>';

  // Show selected date orders
  if(selHistDate&&byDate[selHistDate]){
    const arr=byDate[selHistDate][0]; // one arrival per date typically
    const credData=arr.credSnapshot&&Object.keys(arr.credSnapshot).length?arr.credSnapshot:creds;
    const smIds=Object.keys(credData).filter(function(id){return id!=='admin';});

    // Get products that have any data
    const allItems=cats.flatMap(function(c){return c.items;});
    const activeItems=allItems.filter(function(item){
      const a=arr.arrivals&&arr.arrivals[item.name];
      const anyOrder=smIds.some(function(sid){
        const o=arr.orders&&arr.orders[sid]&&arr.orders[sid][item.name];
        return o&&((o.box||0)+(o.bunch||0)>0);
      });
      return (a&&(a.box||a.bunch))||anyOrder;
    });

    if(!activeItems.length){
      html+='<div class="no-data"><span class="ico">📦</span><p>No products recorded for this arrival.</p></div>';
    } else {
      html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">'
        +'<span style="font-size:12px;color:var(--text2)">📅 Arrival: <strong>'+fmtDate(arr.arrDate)+'</strong></span>'
        +(arr.deadline?'<span style="font-size:12px;color:var(--text2)">⏰ Deadline: <strong>'+fmtDate(arr.deadline)+'</strong></span>':'')
        +'<span style="font-size:12px;color:var(--text2)">👥 Divide by: <strong>'+(arr.divideBy||15)+'</strong></span>'
        +'<div style="display:flex;gap:8px;margin-left:auto">'
        +'<button type="button" class="btn btn-ghost btn-sm" data-dlhist="'+arr.id+'">⬇️ Excel</button>'
        +'<button type="button" class="btn btn-sm" style="background:none;border:1.5px solid #059669;color:#059669;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer" data-reopenhist="'+arr.id+'">🔄 Reopen</button>'
        +'<button type="button" class="btn btn-sm" style="background:none;border:1.5px solid #e74c3c;color:#e74c3c;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer" data-delhist="'+arr.id+'">🗑️ Delete</button>'
        +'</div>'
        +'</div>';

      // Professional table
      html+='<div class="orders-wrap"><table class="orders-tbl"><thead><tr>'
        +'<th style="text-align:left;min-width:140px;position:sticky;left:0;background:#1e1b4b">Product</th>'
        +'<th colspan="2" style="background:#312e81;min-width:80px">Arrived</th>';

      smIds.forEach(function(sid){
        const name=(credData[sid]&&credData[sid].name)||sid;
        const short=name.length>8?name.substring(0,8)+'…':name;
        html+='<th colspan="2" style="min-width:80px">'+short+'</th>';
      });
      html+='<th colspan="2" style="background:#312e81;min-width:80px">Total</th></tr>';

      html+='<tr><th style="position:sticky;left:0;background:#3730a3"></th>'
        +'<th style="text-align:center;font-size:10px">Box</th>'
        +'<th style="text-align:center;font-size:10px">Bch</th>';
      smIds.forEach(function(){
        html+='<th style="text-align:center;font-size:10px">Box</th>'
          +'<th style="text-align:center;font-size:10px">Bch</th>';
      });
      html+='<th style="text-align:center;font-size:10px">Box</th>'
        +'<th style="text-align:center;font-size:10px">Bch</th>'
        +'</tr></thead><tbody>';

      // Group by category
      let gTB=0,gTBu=0,gAB=0,gABu=0;
      cats.forEach(function(cat){
        const catItems=cat.items.filter(function(item){return activeItems.find(function(ai){return ai.name===item.name;});});
        if(!catItems.length) return;

        catItems.forEach(function(item){
          const a=arr.arrivals&&arr.arrivals[item.name]?arr.arrivals[item.name]:{box:0,bunch:0};

          const aBunch=typeof a==='object'?a.bunch||0:0;
          let tB=0,tBu=0;
          gAB+=aBox;gABu+=aBunch;

          const src=lsGet('g_photos',{})[item.name]||'';

            +'<div style="display:flex;align-items:center;gap:6px">'
            +(src?'<img src="'+src+'" style="width:22px;height:22px;border-radius:4px;object-fit:cover;flex-shrink:0"/>'
              :'<span style="font-size:14px">'+item.emoji+'</span>')
            +'<span style="font-size:12px;font-weight:500">'+item.name+'</span>'
            +'</div></td>'
            +'<td class="arrived-col '+(aBox>0?'obox':'zero')+'">'+(aBox||'—')+'</td>'
            +'<td class="arrived-col '+(aBunch>0?'obunch':'zero')+'">'+(aBunch||'—')+'</td>';

          smIds.forEach(function(sid){
            const o=arr.orders&&arr.orders[sid]&&arr.orders[sid][item.name];
            const oBox=o?(typeof o==='number'?o:o.box||0):0;
            const oBunch=o&&typeof o==='object'?o.bunch||0:0;

          });
          gTB+=tB;gTBu+=tBu;
          html+='<td class="total-col '+(tB>0?'obox':'zero')+'">'+(tB||'—')+'</td>'
            +'<td class="total-col '+(tBu>0?'obunch':'zero')+'">'+(tBu||'—')+'</td></tr>';
        });
      });

      // Grand total row
      html+='<tr class="grand-row"><td style="position:sticky;left:0;background:#1e1b4b">🌸 Grand Total</td>'
        +'<td>'+(gAB||'—')+'</td><td>'+(gABu||'—')+'</td>';
      smIds.forEach(function(){html+='<td>—</td><td>—</td>';});
      html+='<td>'+gTB+'</td><td>'+gTBu+'</td></tr>'
        +'</tbody></table></div>';
    }
  }

  tb.innerHTML=html;

  // Date tab clicks
  tb.querySelectorAll('.dt-tab[data-histdate]').forEach(function(btn){
    btn.addEventListener('click',function(){
      window._selHistDate=this.dataset.histdate;
      renderHistoryTab();
    });
  });

  // Download
  tb.querySelectorAll('[data-dlhist]').forEach(function(btn){
    btn.addEventListener('click',function(){downloadExcel(this.dataset.dlhist);});
  });
  tb.querySelectorAll('[data-reopenhist]').forEach(function(btn){
    btn.addEventListener('click',function(){reopenFromHistory(this.dataset.reopenhist);});
  });

  // Delete history entry
  tb.querySelectorAll('[data-delhist]').forEach(function(btn){
    btn.addEventListener('click',function(){
      const hid=this.dataset.delhist;
      if(!confirm('Delete this history entry? This cannot be undone.')) return;
      window._historyDB=(window._historyDB||[]).filter(function(h){return h.id!==hid;});
      lsSet('g_history',window._historyDB);
      fetch(SB_URL+'/rest/v1/greena_history?id=eq.'+encodeURIComponent(hid),{
        method:'DELETE',headers:SB_H
      }).catch(function(){});
      window._selHistDate=null;
      toast('🗑️ History deleted!');
      renderHistoryTab();
    });
  });
}

        <td style="color:var(--purple);font-weight:600">${a.box||'-'}</td>

      smIds.forEach(sid=>{const o=getO(h.orders,sid,item.name);scB[sid]+=o.box;scBu[sid]+=o.bunch;smGB[sid]+=o.box;smGBu[sid]+=o.bunch;html+=`<td class="${o.box===0?'zero':''}">${o.box||'-'}</td><td class="${o.bunch===0?'zero':''}">${o.bunch||'-'}</td>`;});
      html+=`<td style="font-weight:600">${rB||'-'}</td><td style="font-weight:600">${rBu||'-'}</td></tr>`;
    });
    html+=`<tr class="sub-row"><td class="left">↳ ${cat.label} subtotal</td><td>${cAB||'-'}</td><td>${cABu||'-'}</td>`;
    smIds.forEach(s=>{html+=`<td>${scB[s]||'-'}</td><td>${scBu[s]||'-'}</td>`;});
    html+=`<td>${cTB||'-'}</td><td>${cTBu||'-'}</td></tr>`;
  });
  html+=`<tr class="grand-row"><td class="left">🌸 GRAND TOTAL</td><td>${gAB||'-'}</td><td>${gABu||'-'}</td>`;
  smIds.forEach(s=>{html+=`<td>${smGB[s]||'-'}</td><td>${smGBu[s]||'-'}</td>`;});
  html+=`<td>${gTB||'-'}</td><td>${gTBu||'-'}</td></tr></tbody></table></div>`;
  content.innerHTML=html;
}

function deleteHistory(idx){

  const h=historyDB[idx];
  if(h) deleteHistoryFromDB(h.id);
  historyDB.splice(idx,1);
  toast('🗑️ Deleted.');

function downloadHistoryExcel(idx){
  const historyDB=window._historyDB||[];
  const h=historyDB[idx];if(!h){toast('⚠️ Not found.');return;}
  const credData=h.credSnapshot||{};
  const smIds=Object.keys(credData);
  const avail=cats.flatMap(c=>c.items).filter(i=>{
    const a=getA(h.arrivals,i.name);
    const anyOrder=smIds.some(s=>{const o=getO(h.orders,s,i.name);return o.box>0||o.bunch>0;});
    return a.box>0||a.bunch>0||anyOrder;
  });
  if(!avail.length){toast('⚠️ No data.');return;}
  let csv=`Greena — Order Report\nArrival Date,${h.arrDate||''}\nDeadline,${h.deadline||''}\nArchived,${h.archivedOn||''}\n\n`;
  function smVal2(box,bunch){if(box>0&&bunch>0)return box+' Box + '+bunch+' Bunch';if(box>0)return box+' Box';if(bunch>0)return bunch+' Bunch';return '-';}
  csv+='Product,"Arrived",'+smIds.map(function(s){return '"'+(credData[s]?credData[s].name:s)+'"';}).join(',')+',"Total Ordered"\n';
  cats.forEach(cat=>{
    const cv=avail.filter(i=>cat.items.find(ci=>ci.name===i.name));
    if(!cv.length)return;
    csv+=`"--- ${cat.label} ---"\n`;
    let cAB=0,cABu=0,cTB=0,cTBu=0;const scB={},scBu={};smIds.forEach(s=>{scB[s]=0;scBu[s]=0;});
    cv.forEach(item=>{
      const a=getA(h.arrivals,item.name);
      const vals=smIds.flatMap(s=>{const o=getO(h.orders,s,item.name);scB[s]+=o.box;scBu[s]+=o.bunch;return[o.box,o.bunch];});
      const rB=smIds.reduce((x,s)=>x+getO(h.orders,s,item.name).box,0);
      const rBu=smIds.reduce((x,s)=>x+getO(h.orders,s,item.name).bunch,0);
      cAB+=a.box;cABu+=a.bunch;cTB+=rB;cTBu+=rBu;
      csv+=`"${item.name}",${a.box},${a.bunch},`+vals.join(',')+`,${rB},${rBu}\n`;
    });
    csv+='"'+cat.label+' SUBTOTAL","'+smVal2(cAB,cABu)+'",'+smIds.map(function(s){return '"'+smVal2(scB[s],scBu[s])+'"';}).join(',')+'"'+smVal2(cTB,cTBu)+'"\n\n';
  });
  const gAB=avail.reduce((x,i)=>x+getA(h.arrivals,i.name).box,0);
  const gABu=avail.reduce((x,i)=>x+getA(h.arrivals,i.name).bunch,0);
  const sgB={},sgBu={};smIds.forEach(s=>{sgB[s]=avail.reduce((x,i)=>x+getO(h.orders,s,i.name).box,0);sgBu[s]=avail.reduce((x,i)=>x+getO(h.orders,s,i.name).bunch,0);});
  csv+='"GRAND TOTAL","'+smVal2(gAB,gABu)+'",'+smIds.map(function(s){return '"'+smVal2(sgB[s],sgBu[s])+'"';}).join(',')+',"'+smVal2(Object.values(sgB).reduce(function(a,v){return a+v;},0),Object.values(sgBu).reduce(function(a,v){return a+v;},0))+'"\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Greena_History_${h.arrDate||'archive'}.csv`;a.click();
  toast(t('toastExcelDownloaded'));
}

function addCat(){const n=document.getElementById('new-cat-name').value.trim();const c=document.getElementById('new-cat-color').value;if(!n){toast('⚠️ Enter name.');return;}cats.push({id:'cat_'+Date.now(),label:n,color:c,items:[]});saveCatsToDB();toast(t('toastCatAdded'));renderCatalogTab();}

function savePackRate(input){
