function anWireOrderControls(body,el){
  const state=window.anOrdersState;
  body.querySelectorAll('[data-anperiod]').forEach(function(btn){
    btn.addEventListener('click',function(){state.period=this.dataset.anperiod;anRenderOrders(body,el);});
  });
  body.querySelectorAll('[data-ansource]').forEach(function(btn){
    btn.addEventListener('click',function(){state.source=this.dataset.ansource;anRenderOrders(body,el);});
  });
  body.querySelectorAll('[data-anperiodsel]').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(state.period==='weekly') state.week=this.dataset.anperiodsel;
      else state.month=this.dataset.anperiodsel;
      anRenderOrders(body,el);
    });
  });
  body.querySelectorAll('[data-catquick]').forEach(function(btn){
    btn.addEventListener('click',function(){state.cat=this.dataset.catquick;anRenderOrders(body,el);});
  });
  const catSel=body.querySelector('#an-cat-sel');
  if(catSel) catSel.addEventListener('change',function(){state.cat=this.value;anRenderOrders(body,el);});
  const smSel=body.querySelector('#an-sm-sel');
  if(smSel) smSel.addEventListener('change',function(){state.sm=this.value;anRenderOrders(body,el);});
  const toggle=body.querySelector('[data-antoggle="arrord"]');
  if(toggle) toggle.addEventListener('click',function(){state.showArrOrd=!state.showArrOrd;anRenderOrders(body,el);});
}



function anDownloadOrdersExcel(){
  const d=window._anOrdersData;if(!d) return;
  const {allSmIds,smSet,selPeriod,state,periodData}=d;
  const photos=lsGet('g_photos',{})||{};
  let csv='Greena Analytics — Orders Report\nPeriod,'+selPeriod+'\nSource,'+(state.source==='all'?'All (Regular+Arrival+WMS)':state.source)+'\n\n';
  csv+='Category,#,Product,'+allSmIds.map(function(id){return smSet[id]||id;}).join(',')+ ',Total Bunches\n';
  let rowNum=0;
  cats.forEach(function(cat){
    const catItems=cat.items.filter(function(i){return periodData[i.name];});
    if(!catItems.length) return;
    csv+=cat.label+'\n';
    catItems.forEach(function(item){
      rowNum++;
      const pData=periodData[item.name]||{};
      const rowBn=Object.values(pData).reduce(function(a,v){return a+v.bn;},0);
      csv+=','+rowNum+','+item.name+','+allSmIds.map(function(id){return pData[id]?pData[id].bn:0;}).join(',')+','+rowBn+'\n';
    });
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Orders_'+selPeriod.replace(/[^a-z0-9]/gi,'_')+'.csv';a.click();
  toast('⬇️ Excel downloaded!');
}

if(!window.anProcState) window.anProcState={origin:'',week:'',cargo:''};

function anRenderProcurement(body,el){
  const state=window.anProcState;
  const pos=procOrders||[];

  // Collect filter options
  const origins=[...new Set(pos.map(function(o){return o.originName||o.originId||'';}).filter(Boolean))].sort();
  const cargos=[...new Set(pos.map(function(o){return o.cargoAgency||'';}).filter(Boolean))].sort();
  const weeks=[...new Set(pos.map(function(o){return o.week||'';}).filter(Boolean))].sort();

  const filtered=pos.filter(function(o){
    if(state.origin&&(o.originName||o.originId)!==state.origin) return false;
    if(state.cargo&&(o.cargoAgency||'')!==state.cargo) return false;
    if(state.week&&(o.week||'')!==state.week) return false;

      const statusBg=po.status==='arrived'||po.status==='history'?'#dcfce7':po.status==='placed'?'#fef3c7':'#f1f5f9';

        +'</div></div>'
        +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        +'<span style="background:'+statusBg+';color:'+statusColor+';padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700">'+statusLbl+'</span>'
        +(short>0?'<span style="background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700">⚠️ Short: '+short+' Bn</span>':'')
        +'</div>'
        +'</div>'
        // Stats strip
        +'<div style="padding:10px 16px;background:#fafbff;display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid #f1f5f9">'
        +'<div style="font-size:12px"><span style="font-weight:700;color:#4f46e5">'+confRows.length+'</span> <span style="color:#94a3b8">products</span></div>'
        +'<div style="font-size:12px"><span style="font-weight:700;color:#059669">'+totalConfBn+'</span> <span style="color:#94a3b8">Conf. Bn</span></div>'
        +'<div style="font-size:12px"><span style="font-weight:700;color:#1e1b4b">'+orderedBn+'</span> <span style="color:#94a3b8">Ordered Bn</span></div>'
        +(farms.length?'<div style="font-size:12px"><span style="font-weight:700;color:#7c3aed">'+farms.length+'</span> <span style="color:#94a3b8">farms</span></div>':'')
        +'</div>'
        // Products (top 5)
        +(confRows.length?
          '<div style="padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap">'
          +confRows.slice(0,8).map(function(r){
            const bpb=getCatBpbForProduct(r.name);
            const bn=(r.confQtys||r.qtys||[]).reduce(function(a,q){return a+(parseInt(q)||0);},0)*bpb;
            return '<span style="background:#f1f5f9;color:#1e1b4b;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600">'+r.name+' · '+bn+' Bn</span>';
          }).join('')
          +(confRows.length>8?'<span style="color:#94a3b8;font-size:11px;padding:3px 0">+' +(confRows.length-8)+' more</span>':'')
          +'</div>'

    html+='</div>';
  }

  body.innerHTML=html;

  const origSel=body.querySelector('#an-proc-origin');

}

function _anLoadAndRenderLegacy(body){
  // Load stock history then render legacy inner
  Promise.all([
    fetch(SB_URL+'/rest/v1/greena_stock_history?select=*',{headers:SB_H})
      .then(function(r){return r.json();})
      .then(function(rows){window._stockHistoryDB=(rows||[]).map(function(r){return r.data;}).filter(Boolean);})
      .catch(function(){window._stockHistoryDB=[];})
  ]).then(function(){
    // Create a temp container and render legacy into it
    const tmp=document.createElement('div');
    tmp.id='analytics-content-tmp';
    document.body.appendChild(tmp);
    const realEl=document.getElementById('analytics-content');
    // Temporarily swap
    const saved=realEl.innerHTML;
    realEl.innerHTML='';
    _renderAnalyticsInner(realEl);
    // Extract just the content after topbar
    const inner=realEl.querySelector('#an-body');
    if(inner){
      body.innerHTML=inner.innerHTML;
    } else {
      // Fallback: get full rendered content
      body.innerHTML=realEl.innerHTML;
    }
    // Restore sidebar
    renderAnalytics();
    tmp.remove();
  });
}

function _renderAnalyticsInner(el){
  if(!window.analyticsTab) window.analyticsTab='weekly';
  if(!window.analyticsSM) window.analyticsSM='all';

  const smList=Object.keys(creds).filter(function(id){return creds[id]&&creds[id].name;})
    .sort().map(function(id){return {id:id,name:creds[id].name||id};});

  // Helper functions
  function getWeekKey(dateStr){
    if(!dateStr) return null;
    const d=new Date(dateStr);
    if(isNaN(d)) return null;
    const day=d.getDay();
    const diffToFri=((day-5)+7)%7;
    const fri=new Date(d);fri.setDate(d.getDate()-diffToFri);
    const thu=new Date(fri);thu.setDate(fri.getDate()+6);
    const fmt=function(dt){return dt.getDate()+' '+'JanFebMarAprMayJunJulAugSepOctNovDec'.match(/.{3}/g)[dt.getMonth()];};
    const jan1=new Date(fri.getFullYear(),0,1);
    const wn=Math.ceil(((fri-jan1)/86400000+jan1.getDay()+1)/7);
    return 'W'+String(wn).padStart(2,'0')+' ('+fmt(fri)+' - '+fmt(thu)+')';
  }
  function getMonthKey(dateStr){
    if(!dateStr) return null;
    const d=new Date(dateStr);
    if(isNaN(d)) return null;
    return 'JanFebMarAprMayJunJulAugSepOctNovDec'.match(/.{3}/g)[d.getMonth()]+' '+d.getFullYear();
  }

  // Collect all data
  const allData={};
  function addQty(name,qty,smId,smName,dateStr,source){
    if(!qty||(!qty.box&&!qty.bunch)) return;
    if(!name||!dateStr) return;
    const wk=getWeekKey(dateStr),mo=getMonthKey(dateStr);
    if(!wk||!mo) return;
    if(!allData[name]) allData[name]={weeks:{},months:{},bySmWeek:{},bySmMonth:{}};
    const d=allData[name];
    const bpb=getCatBpbForProduct(name);
    const bn=(qty.box||0)*bpb+(qty.bunch||0);
    // Weeks
    if(!d.weeks[wk]) d.weeks[wk]={box:0,bunch:0,bunches:0};
    d.weeks[wk].box+=(qty.box||0);d.weeks[wk].bunch+=(qty.bunch||0);d.weeks[wk].bunches+=bn;
    // Months
    if(!d.months[mo]) d.months[mo]={box:0,bunch:0,bunches:0};
    d.months[mo].box+=(qty.box||0);d.months[mo].bunch+=(qty.bunch||0);d.months[mo].bunches+=bn;
    // By SM week
    const sk=smId+'|||'+smName;
    if(!d.bySmWeek[sk]) d.bySmWeek[sk]={};
    if(!d.bySmWeek[sk][wk]) d.bySmWeek[sk][wk]={box:0,bunch:0,bunches:0};
    d.bySmWeek[sk][wk].box+=(qty.box||0);d.bySmWeek[sk][wk].bunch+=(qty.bunch||0);d.bySmWeek[sk][wk].bunches+=bn;
    // By SM month
    if(!d.bySmMonth[sk]) d.bySmMonth[sk]={};
    if(!d.bySmMonth[sk][mo]) d.bySmMonth[sk][mo]={box:0,bunch:0,bunches:0};
    d.bySmMonth[sk][mo].box+=(qty.box||0);d.bySmMonth[sk][mo].bunch+=(qty.bunch||0);d.bySmMonth[sk][mo].bunches+=bn;
  }

  // Regular orders
  regularOrders.filter(function(o){return o.submittedAt;}).forEach(function(ord){
    Object.entries(ord.items||{}).forEach(function(e){
      addQty(e[0],e[1],ord.userId,ord.userName,ord.date,'regular');
    });
  });
  // Arrivals
  const histDB=window._historyDB||lsGet('g_history',[]);
  [...arrivalsDB,...histDB].forEach(function(arr){
    Object.keys(arr.orders||{}).forEach(function(sid){
      if(sid==='_submittedAt') return;
      const smOrder=arr.orders[sid];
      if(!smOrder) return;
      const smName=creds[sid]?creds[sid].name:sid;
      Object.entries(smOrder).forEach(function(e){
        if(e[0]==='_submittedAt') return;
        addQty(e[0],e[1],sid,smName,arr.arrDate,'arrival');
      });
    });
  });
  // Stock history
  (window._stockHistoryDB||[]).forEach(function(h){
    Object.entries(h.items||{}).forEach(function(e){
      addQty(e[0],e[1],h.userId,h.userName,h.stockDate||h.doneAt,'stock');
    });
  });

  if(!Object.keys(allData).length){
    el.innerHTML='<div class="no-data"><span class="ico">📊</span><p>No order data yet. Start placing orders to see analytics.</p></div>';
    return;
  }

  // Sort periods
  const allWeeks=[...new Set(Object.values(allData).flatMap(function(d){return Object.keys(d.weeks);}))].sort(function(a,b){return b.localeCompare(a);});
  const allMonths=[...new Set(Object.values(allData).flatMap(function(d){return Object.keys(d.months);}))].sort(function(a,b){return b.localeCompare(a);});
  const weeksSorted=allWeeks;
  const monthsSorted=allMonths;

  if(!window.analyticsWeek||!weeksSorted.includes(window.analyticsWeek)) window.analyticsWeek=weeksSorted[0]||null;
  if(!window.analyticsMonth||!monthsSorted.includes(window.analyticsMonth)) window.analyticsMonth=monthsSorted[0]||null;

  // Build UI
  const smOptions='<option value="all">All Salesman</option>'
    +smList.map(function(s){return '<option value="'+s.id+'" '+(window.analyticsSM===s.id?'selected':'')+'>'+s.name+'</option>';}).join('');

  let html='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:1rem">'
    +'<select id="an-sm" style="border:1.5px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;font-family:Inter,sans-serif;min-width:160px">'+smOptions+'</select>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<button type="button" id="an-tab-weekly" style="padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;'+(window.analyticsTab==='weekly'?'background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent':'background:#f8fafc;color:#64748b')+'">📅 Weekly</button>'
    +'<button type="button" id="an-tab-monthly" style="padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;'+(window.analyticsTab==='monthly'?'background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent':'background:#f8fafc;color:#64748b')+'">📆 Monthly</button>'
    +'<button type="button" id="an-tab-forecast" style="padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;'+(window.analyticsTab==='forecast'?'background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-color:transparent':'background:#f8fafc;color:#64748b')+'">🔮 Forecast</button>'
    +'<button type="button" id="an-tab-ai" style="padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;'+(window.analyticsTab==='ai'?'background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;border-color:transparent':'background:#f8fafc;color:#64748b')+'">🤖 AI Report</button>'
    +'</div></div>';

  // Period tabs
  const periods=window.analyticsTab==='weekly'?weeksSorted:monthsSorted;
  const selPeriod=window.analyticsTab==='weekly'?window.analyticsWeek:window.analyticsMonth;

  if(window.analyticsTab!=='forecast'&&periods.length){
    html+='<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:1rem;scrollbar-width:none">';
    periods.forEach(function(p){
      html+='<button type="button" class="an-period-btn" data-period="'+p+'" style="flex-shrink:0;padding:6px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap;'+(p===selPeriod?'background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent':'background:#f8fafc;color:#64748b')+'">'+p+'</button>';
    });
    html+='</div>';
  }

  html+='<div id="an-body"></div>';
  el.innerHTML=html;

  // Events
  el.querySelector('#an-sm').addEventListener('change',function(){window.analyticsSM=this.value;_renderAnalyticsInner(el);});
  el.querySelector('#an-tab-weekly').addEventListener('click',function(){window.analyticsTab='weekly';_renderAnalyticsInner(el);});
  el.querySelector('#an-tab-monthly').addEventListener('click',function(){window.analyticsTab='monthly';_renderAnalyticsInner(el);});
  el.querySelector('#an-tab-forecast').addEventListener('click',function(){window.analyticsTab='forecast';_renderAnalyticsInner(el);});
  el.querySelector('#an-tab-ai').addEventListener('click',function(){window.analyticsTab='ai';_renderAnalyticsInner(el);});
  el.querySelectorAll('.an-period-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(window.analyticsTab==='weekly') window.analyticsWeek=this.dataset.period;
      else window.analyticsMonth=this.dataset.period;
      _renderAnalyticsInner(el);
    });
  });

  const body=document.getElementById('an-body');

  // AI Report tab
  if(window.analyticsTab==='ai'){

          box=bySmMap[sk][selPeriod].box||0;
          bunch=bySmMap[sk][selPeriod].bunch||0;

      if(bunches>0){

      {i:'🏆',l:'Top Product',v:topProduct.name.slice(0,12),c:'#be185d'},

    ].map(function(c){
      return '<div style="background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow-sm)">'
        +'<div style="font-size:20px">'+c.i+'</div>'
        +'<div style="font-size:18px;font-weight:800;color:'+c.c+'">'+c.v+'</div>'
        +'<div style="font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase">'+c.l+'</div>'
        +'</div>';
    }).join('')+'</div>';

  // Main table
  bodyHtml+='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:1rem">'
    +'<div style="padding:10px 16px;background:linear-gradient(90deg,#1e1b4b,#312e81);display:flex;align-items:center;justify-content:space-between">'

    +'<div style="display:flex;gap:8px">'
    +'<button type="button" id="an-dl-btn" style="padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">⬇️ Excel</button>'
    +'</div></div>'
    +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
    +'<thead><tr style="background:#fafafa;border-bottom:2px solid var(--border)">'
    +'<th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2)">#</th>'
    +'<th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2)">Product</th>';

  if(isAllSM){
    smList.forEach(function(sm){
      bodyHtml+='<th style="padding:8px 8px;text-align:center;font-size:10px;font-weight:700;color:var(--text2)">'+sm.name+'</th>';
    });
  }
  bodyHtml+='<th style="padding:8px 10px;text-align:center;font-size:11px;font-weight:700;color:#0369a1">Total Bn</th>'
    +'<th style="padding:8px 10px;text-align:center;font-size:11px;font-weight:700;color:var(--text2)">%</th>'
    +'</tr></thead><tbody>';

  let rowNum=1;
  const bySmMap2=window.analyticsTab==='weekly'?null:null;
  cats.forEach(function(cat){
    const catProds=products.filter(function(p){return p.cat.id===cat.id;});
    if(!catProds.length) return;
    const catTotal=catProds.reduce(function(a,p){return a+p.bunches;},0);
    bodyHtml+='<tr style="background:linear-gradient(90deg,#1e1b4b,#312e81)">'
      +'<td colspan="'+(isAllSM?smList.length+4:4)+'" style="padding:7px 14px">'

      +'<div style="display:flex;align-items:center;gap:8px">'

      +'<span style="font-size:11px;font-weight:700;color:#fff">'+cat.label+'</span>'
      +'</div>'
      +'<span style="font-size:11px;color:rgba(255,255,255,0.8);font-weight:600">'+catTotal+' Bn</span>'
      +'</div></td></tr>';

    catProds.sort(function(a,b){return b.bunches-a.bunches;}).forEach(function(p){
      const pct=grandTotal>0?Math.round(p.bunches/grandTotal*100):0;
      const src=allPhotos[p.name]||photos[p.name]||'';
      bodyHtml+='<tr style="border-bottom:1px solid #f1f5f9">'
        +'<td style="padding:8px 14px;color:var(--text2);font-size:11px">'+rowNum+'</td>'

        +(src?'<img src="'+src+'" style="width:24px;height:24px;border-radius:4px;object-fit:cover"/>':'<span>🌸</span>')
        +'<span style="font-weight:500">'+p.name+'</span>'
        +'</div></td>';

      if(isAllSM){
        const d=allData[p.name];
        const bySmMap3=window.analyticsTab==='weekly'?d.bySmWeek:d.bySmMonth;
        smList.forEach(function(sm){
          const sk=Object.keys(bySmMap3).find(function(k){return k.split('|||')[0]===sm.id;});
          const bn=sk&&bySmMap3[sk]&&bySmMap3[sk][selPeriod]?bySmMap3[sk][selPeriod].bunches||0:0;
          bodyHtml+='<td style="padding:8px 8px;text-align:center;font-weight:'+(bn>0?'600':'400')+';color:'+(bn>0?'#15803d':'#cbd5e1')+';cursor:'+(bn>0?'pointer':'default')+'" '
            +(bn>0?'onclick="showDrillDown(\''+p.name.replace(/'/g,"\\'")+'\',' +
            '\''+sm.id+'\',\''+sm.name.replace(/'/g,"\\'")+'\',\''+selPeriod.replace(/'/g,"\\'")+'\') " title="Click for details"':'')
            +'>'+(bn||'—')+'</td>';
        });
        bodyHtml+='<td style="padding:8px 10px;text-align:center;font-weight:700;color:#0369a1;cursor:pointer" onclick="showDrillDown(\''+p.name.replace(/'/g,"\\'")+'\',\'all\',\'All\',\''+selPeriod.replace(/'/g,"\\'")+'\')">'+p.bunches+'</td>';
      } else {
        bodyHtml+='<td style="padding:8px 10px;text-align:center;font-weight:700;color:#0369a1;cursor:pointer" onclick="showDrillDown(\''+p.name.replace(/'/g,"\\'")+'\',\''+smId+'\',\''+(creds[smId]?creds[smId].name:smId).replace(/'/g,"\\'")+'\',\''+selPeriod.replace(/'/g,"\\'")+'\')">'+p.bunches+'</td>';

        +'</td></tr>';

    });
  });

  bodyHtml+='<tfoot><tr style="background:#f8fafc;border-top:2px solid var(--border)">'
    +'<td colspan="'+(isAllSM?smList.length+3:3)+'" style="padding:10px 14px;font-weight:700">Grand Total</td>'
    +'<td style="padding:10px 10px;text-align:center;font-weight:800;color:#4f46e5;font-size:15px">'+grandTotal.toLocaleString()+'</td>'
    +'<td style="padding:10px 10px;text-align:center;font-weight:700">100%</td>'
    +'</tr></tfoot></tbody></table></div></div>';

  body.innerHTML=bodyHtml;
  body.querySelector('#an-dl-btn').addEventListener('click',function(){downloadAnalyticsExcel(isAllSM);});
}
function buildProcurementPlan(catRows){

    +'<div style="font-size:14px;font-weight:800;color:#1e1b4b;margin-bottom:14px">📦 Procurement Plan — Next Week</div>'

      +'</div></div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
      +'<thead><tr style="background:#f1f5f9">'
      +'<th style="padding:6px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text2)">Product</th>'
      +'<th style="padding:6px 8px;text-align:center;font-size:10px;font-weight:700;color:var(--text2)">W1</th>'
      +'<th style="padding:6px 8px;text-align:center;font-size:10px;font-weight:700;color:var(--text2)">W2</th>'
      +'<th style="padding:6px 8px;text-align:center;font-size:10px;font-weight:700;color:#be185d">Order Bn</th>'

        +'<td style="padding:7px 8px;text-align:center;color:var(--text2)">'+r.prev+'</td>'
        +'<td style="padding:7px 8px;text-align:center"><span style="background:#fce7f3;color:#be185d;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">'+r.recommended+'</span></td>'
        +'<td style="padding:7px 8px;text-align:center"><span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">'+r.boxes+'</span></td>'

      +'<td></td></tr>'

  });

  if(!hasData) html+='<div style="color:var(--text2);text-align:center;padding:1rem">No procurement data available.</div>';
  html+='</div>';
  return html;

function renderForecastTab(allData,weeksSorted,monthsSorted,allPhotos){
  const smId=window.analyticsSM||'all';
  const last4=weeksSorted.slice(0,4);
  if(!last4.length) return '<div class="no-data"><span class="ico">🔮</span><p>Not enough data.</p></div>';
  function getWB(d,wk){if(smId==='all')return(d.weeks&&d.weeks[wk]&&d.weeks[wk].bunches)||0;const m=d.bySmWeek||{};const k=Object.keys(m).find(function(k){return k.split('|||')[0]===smId;});return k&&m[k]&&m[k][wk]?m[k][wk].bunches||0:0;}
  const products=Object.entries(allData).map(function(e){
    const name=e[0],d=e[1];
    const wv=last4.map(function(w){return getWB(d,w);});
    const wa=Math.round(wv.reduce(function(a,v){return a+v;},0)/last4.length);
    const wf=Math.round(wa*1.1);
    const bpb=getCatBpbForProduct(name);
    const trend=wv.length>=2?wv[0]-wv[wv.length-1]:0;
    return{name,wv,wa,wf,wb:bpb>0?Math.ceil(wf/bpb):0,mf:Math.round(wf*4.33),mb:bpb>0?Math.ceil(wf*4.33/bpb):0,bpb,trend};
  }).filter(function(p){return p.wa>0;}).sort(function(a,b){return b.wf-a.wf;});
  if(!products.length) return '<div class="no-data"><span class="ico">🔮</span><p>No data for forecast.</p></div>';
  const gwf=products.reduce(function(a,p){return a+p.wf;},0);
  const gwb=products.reduce(function(a,p){return a+p.wb;},0);
  const gmf=products.reduce(function(a,p){return a+p.mf;},0);

  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;flex-wrap:wrap;gap:8px"><div style="font-size:12px;color:var(--text2)">Last '+last4.length+' weeks avg + 10% buffer</div><button type="button" id="an-dl-forecast" style="padding:8px 16px;border-radius:10px;border:1.5px solid #059669;background:#fff;color:#059669;font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">⬇️ Download Forecast</button></div>';
  html+='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1rem;box-shadow:var(--shadow-sm)"><div style="padding:10px 16px;background:linear-gradient(90deg,#1e1b4b,#312e81)"><span style="font-size:13px;font-weight:700;color:#fff">🔮 Procurement Forecast</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#fafafa;border-bottom:2px solid var(--border)"><th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2)">#</th><th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2)">Product</th>'+last4.map(function(w){return '<th style="padding:8px 8px;text-align:center;font-size:10px;font-weight:700;color:#64748b;white-space:nowrap">'+w.split(' ')[0]+'</th>';}).join('')+'<th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#0369a1">Avg/Wk</th><th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#be185d">Forecast Bn</th><th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#1e40af">Boxes</th><th style="padding:8px 8px;text-align:center;font-size:11px;font-weight:700;color:#92400e">Trend</th></tr></thead><tbody>';

    html+='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:1rem;box-shadow:var(--shadow-sm)"><div style="font-size:13px;font-weight:700;margin-bottom:10px">⚠️ Demand Alerts</div><div style="display:flex;flex-direction:column;gap:8px">';
    rising.forEach(function(p){html+='<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px"><span>📈</span><span style="font-weight:600;font-size:12px">'+p.name+'</span><span style="font-size:11px;color:#15803d">Rising +'+p.trend+' Bn</span></div>';});
    falling.forEach(function(p){html+='<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px"><span>📉</span><span style="font-weight:600;font-size:12px">'+p.name+'</span><span style="font-size:11px;color:#dc2626">Falling '+p.trend+' Bn</span></div>';});
    html+='</div></div>';
  }
  return html;
}

function renderAIReport(body,allData,weeksSorted,monthsSorted){
  const smList=Object.keys(creds).filter(function(id){return creds[id]&&creds[id].name;})
    .sort().map(function(id){return {id:id,name:creds[id].name||id};});
  if(!window.aiReportType) window.aiReportType='weekly';
  if(!window.aiReportSM) window.aiReportSM='all';

  let h='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:1rem;box-shadow:var(--shadow-sm)">'
    +'<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">🤖 AI Report Settings</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'
    +['weekly','monthly','salesman'].map(function(t){
      const labels={weekly:'📅 Weekly',monthly:'📆 Monthly',salesman:'👤 Salesman'};
      const active=window.aiReportType===t;
      return '<button type="button" class="ai-rpt-type" data-type="'+t+'" style="padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;'+(active?'background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;border-color:transparent':'background:#f8fafc;color:#64748b')+'">'+labels[t]+'</button>';
    }).join('')
    +'</div>';

  if(window.aiReportType==='salesman'){
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      +'<span style="font-size:12px;font-weight:600;color:var(--text2)">Salesman:</span>'
      +'<select id="ai-sm-sel" style="border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;font-family:Inter,sans-serif;background:#fff">'
      +'<option value="all" '+(window.aiReportSM==='all'?'selected':'')+'>All Salesman</option>'
      +smList.map(function(s){return '<option value="'+s.id+'" '+(window.aiReportSM===s.id?'selected':'')+'>'+s.name+'</option>';}).join('')
      +'</select></div>';
  }

  h+='<button type="button" id="ai-generate-btn" style="padding:10px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">🤖 Generate Report</button>'
    +'</div><div id="ai-report-output"></div>';

  body.innerHTML=h;

  body.querySelectorAll('.ai-rpt-type').forEach(function(btn){
    btn.addEventListener('click',function(){
      window.aiReportType=this.dataset.type;
      if(this.dataset.type!=='salesman') window.aiReportSM='all';
      renderAIReport(body,allData,weeksSorted,monthsSorted);
    });
  });
  const smSel=body.querySelector('#ai-sm-sel');
  if(smSel) smSel.addEventListener('change',function(){window.aiReportSM=this.value;});
  body.querySelector('#ai-generate-btn').addEventListener('click',function(){
    generateAIReport(body,allData,weeksSorted,monthsSorted,smList);
  });
}

async function generateAIReport(body,allData,weeksSorted,monthsSorted,smList){
  const output=document.getElementById('ai-report-output');
  output.innerHTML='<div style="text-align:center;padding:2rem;color:#7c3aed"><div style="font-size:32px;margin-bottom:8px">🤖</div><div style="font-size:14px;font-weight:600">Analyzing data...</div></div>';

  const type=window.aiReportType||'weekly';
  const smId=window.aiReportSM||'all';
  const last2W=weeksSorted.slice(0,2);
  const last2M=monthsSorted.slice(0,2);
  const w1=last2W[0]||'',w2=last2W[1]||'';
  const m1=last2M[0]||'',m2=last2M[1]||'';
  const isWeekly=type!=='monthly';
  const p1=isWeekly?w1:m1;
  const p2=isWeekly?w2:m2;
  const w1num=w1?w1.split(' ')[0]:'';
  const w2num=w2?w2.split(' ')[0]:'';

  function getBn(d,p,isW){const m=isW?d.weeks:d.months;return(m&&m[p]&&m[p].bunches)||0;}
  function getWeekKeyStatic(dateStr){
    if(!dateStr) return null;
    const d=new Date(dateStr);if(isNaN(d)) return null;
    const day=d.getDay();const diffToFri=((day-5)+7)%7;
    const fri=new Date(d);fri.setDate(d.getDate()-diffToFri);
    const jan1=new Date(fri.getFullYear(),0,1);
    const wn=Math.ceil(((fri-jan1)/86400000+jan1.getDay()+1)/7);
    return 'W'+String(wn).padStart(2,'0');
  }

  // Product rows by category
  const catRows={};
  const allProductRows=[];
  cats.forEach(function(cat){
    catRows[cat.label]=[];
    cat.items.forEach(function(item){
      const d=allData[item.name];if(!d) return;
      const cur=getBn(d,p1,isWeekly),prev=getBn(d,p2,isWeekly);
      if(!cur&&!prev) return;
      const chg=prev>0?Math.round((cur-prev)/prev*100):cur>0?100:0;
      const bpb=item.packRate||cat.bunchesPerBox||25;
      const avg=Math.round((cur+prev)/2);
      const recommended=Math.round(avg*1.1);
      const boxes=bpb>0?Math.ceil(recommended/bpb):0;
      const row={name:item.name,cat:cat.label,cur,prev,chg,bpb,avg,recommended,boxes};
      catRows[cat.label].push(row);
      allProductRows.push(row);
    });
    catRows[cat.label].sort(function(a,b){return b.cur-a.cur;});
  });
  allProductRows.sort(function(a,b){return b.cur-a.cur;});

  // Category totals
  const catTotals={};
  Object.entries(catRows).forEach(function(e){
    const rows=e[1];
    catTotals[e[0]]={
      cur:rows.reduce(function(a,r){return a+r.cur;},0),
      prev:rows.reduce(function(a,r){return a+r.prev;},0)
    };
  });

  // Missing salesman
  const allSMIds=Object.keys(creds).filter(function(id){return creds[id]&&creds[id].name;});
  const orderedSet=new Set();
  const histDB=window._historyDB||lsGet('g_history',[]);
  const allArrivals=[...arrivalsDB,...histDB];
  regularOrders.filter(function(o){return o.submittedAt&&getWeekKeyStatic(o.date)===w1num;})
    .forEach(function(o){orderedSet.add(o.userId);});
  allArrivals.filter(function(a){return getWeekKeyStatic(a.arrDate)===w1num;})
    .forEach(function(arr){
      Object.keys(arr.orders||{}).forEach(function(sid){
        const o=arr.orders[sid];
        if(o&&Object.values(o).some(function(q){return q&&((q.box||0)+(q.bunch||0)>0);})) orderedSet.add(sid);
      });
    });
  Object.keys(stockOrders||{}).forEach(function(sid){
    if(stockOrders[sid]&&stockOrders[sid].submittedAt) orderedSet.add(sid);
  });
  const missingSM=allSMIds.filter(function(id){return !orderedSet.has(id);}).map(function(id){return creds[id].name||id;});
  const orderedSM=allSMIds.filter(function(id){return orderedSet.has(id);}).map(function(id){return creds[id].name||id;});

  // Build data string for Claude
  let dataStr='PERIOD: '+p1+' vs '+p2+'\n\n';
  dataStr+='CATEGORY DEMAND SUMMARY:\n';
  Object.entries(catTotals).forEach(function(e){
    if(!e[1].cur&&!e[1].prev) return;
    const chg=e[1].prev>0?Math.round((e[1].cur-e[1].prev)/e[1].prev*100):100;
    dataStr+=e[0]+': '+e[1].cur+' Bn | Prev: '+e[1].prev+' Bn | '+(chg>=0?'+':'')+chg+'%\n';
  });

  dataStr+='\nTOP PRODUCTS BY CATEGORY:\n';
  cats.forEach(function(cat){
    const rows=catRows[cat.label];
    if(!rows.length) return;
    dataStr+='\n['+cat.label+']\n';
    rows.slice(0,5).forEach(function(r){
      dataStr+=r.name+' | '+r.cur+' Bn | Prev: '+r.prev+' | '+(r.chg>=0?'+':'')+r.chg+'%\n';
    });
  });

  dataStr+='\nSALESMAN STATUS:\n';
  dataStr+='Ordered: '+orderedSM.join(', ')+'\n';
  dataStr+='Missing: '+(missingSM.length?missingSM.join(', '):'None')+'\n';

  dataStr+='\nPROCUREMENT DATA (avg of 2 weeks +10%):\n';
  cats.forEach(function(cat){
    const rows=catRows[cat.label].filter(function(r){return r.avg>0;});
    if(!rows.length) return;
    dataStr+='\n['+cat.label+']\n';
    rows.forEach(function(r){
      dataStr+=r.name+': Avg='+r.avg+' Bn | Recommend='+r.recommended+' Bn | Boxes='+r.boxes+' ('+r.bpb+' Bn/Box)\n';
    });
  });

  const prompts={
    weekly:'You are an analytics expert for a wholesale flower business in Saudi Arabia. Write a professional weekly business report with EXACTLY these 5 sections:\n\n1. DEMAND OVERVIEW\nCategory-wise demand summary with numbers and % change vs last week.\n\n2. TOP PERFORMERS\nTop 3 products per category with % change and bunches.\n\n3. DECLINING PRODUCTS\nProducts with notable drops, absolute numbers.\n\n4. SALESMAN PARTICIPATION\nWho ordered, who did not, and business impact.\n\n5. PROCUREMENT PLAN FOR NEXT WEEK\nList EVERY product with stock > 0 from the procurement data. Format exactly like this for each category:\n[Category Name]\n- Product Name: Order X Bn (X Boxes) — reason\n\nUse the recommended quantities from the procurement data provided. Be specific. 350-400 words total.',
    monthly:'You are an analytics expert for a wholesale flower business in Saudi Arabia. Write a professional monthly business report (300-350 words) covering: 1) Monthly demand by category, 2) Best and worst performing products, 3) Salesman participation, 4) Next month procurement recommendations. No markdown tables. Plain text with numbered sections.',
    salesman:'You are an analytics expert for a wholesale flower business in Saudi Arabia. Write a professional salesman performance report (300-350 words) covering: 1) Who ordered vs who did not this week, 2) Impact of missing orders on business, 3) Top performers by demand volume, 4) Management action plan. No markdown tables. Plain text with numbered sections.'
  };

  try{
    const res=await fetch('/.netlify/functions/ai-report',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:prompts[type]+'\n\nDATA:\n'+dataStr}]})
    });
    const data=await res.json();
    const text=data.content&&data.content[0]&&data.content[0].text;
    if(!text) throw new Error('No response');

    // Chart — top 10 products all categories
    const chartProducts=allProductRows.slice(0,10);
    const maxVal=Math.max(...chartProducts.map(function(p){return Math.max(p.cur,p.prev);}),1);
    let chartHtml='<div style="padding:16px;border-bottom:1.5px solid var(--border)">'
      +'<div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em">📊 Top 10 Products — '+p1+' vs '+(p2||'N/A')+'</div>';
    chartProducts.forEach(function(p){
      const w1pct=Math.round(p.cur/maxVal*100);
      const w2pct=Math.round(p.prev/maxVal*100);
      const color=p.chg>=0?'#059669':'#dc2626';
      chartHtml+='<div style="margin-bottom:10px">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +'<span style="font-size:11px;font-weight:600;color:var(--text)">'+p.name+'</span>'
        +'<span style="font-size:9px;color:var(--text2);background:#f1f5f9;padding:1px 6px;border-radius:4px">'+p.cat+'</span>'
        +'</div>'
        +'<span style="font-size:11px;font-weight:700;color:'+color+'">'+(p.chg>=0?'+':'')+p.chg+'%</span>'
        +'</div>'
        +'<div style="display:flex;flex-direction:column;gap:3px">'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +'<span style="font-size:9px;color:#4f46e5;width:28px;font-weight:600">Now</span>'
        +'<div style="flex:1;background:#f1f5f9;border-radius:4px;height:10px"><div style="width:'+w1pct+'%;background:linear-gradient(90deg,#4f46e5,#6366f1);height:100%;border-radius:4px"></div></div>'
        +'<span style="font-size:10px;font-weight:700;color:#4f46e5;width:50px;text-align:right">'+p.cur+' Bn</span>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +'<span style="font-size:9px;color:var(--text2);width:28px">Prev</span>'
        +'<div style="flex:1;background:#f1f5f9;border-radius:4px;height:10px"><div style="width:'+w2pct+'%;background:#cbd5e1;height:100%;border-radius:4px"></div></div>'
        +'<span style="font-size:10px;color:var(--text2);width:50px;text-align:right">'+p.prev+' Bn</span>'
        +'</div></div></div>';
    });
    chartHtml+='<div style="display:flex;gap:16px;margin-top:8px">'
      +'<div style="display:flex;align-items:center;gap:4px"><div style="width:14px;height:10px;border-radius:2px;background:linear-gradient(90deg,#4f46e5,#6366f1)"></div><span style="font-size:10px;color:var(--text2)">Current</span></div>'
      +'<div style="display:flex;align-items:center;gap:4px"><div style="width:14px;height:10px;border-radius:2px;background:#cbd5e1"></div><span style="font-size:10px;color:var(--text2)">Previous</span></div>'
      +'</div></div>';

    // Missing salesman
    const missingHtml=missingSM.length>0
      ?'<div style="padding:12px 16px;background:#fef3c7;border-bottom:1.5px solid #fcd34d">'
        +'<div style="font-size:11px;font-weight:700;color:#92400e;margin-bottom:6px">⚠️ Did Not Order This Week ('+missingSM.length+'/'+allSMIds.length+')</div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
        +missingSM.map(function(n){return '<span style="background:#fff;border:1px solid #fcd34d;color:#92400e;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600">'+n+'</span>';}).join('')
        +'</div></div>'
      :'<div style="padding:10px 16px;background:#f0fdf4;border-bottom:1.5px solid #86efac"><div style="font-size:11px;font-weight:700;color:#15803d">✅ All salesman placed orders this week!</div></div>';

    const labels={weekly:'📅 Weekly Report',monthly:'📆 Monthly Report',salesman:'👤 Salesman Report'};

    output.innerHTML='<div style="background:#fff;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)">'
      +'<div style="padding:12px 16px;background:linear-gradient(135deg,#7c3aed,#8b5cf6);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'
      +'<div><div style="font-size:14px;font-weight:700;color:#fff">'+labels[type]+'</div>'
      +'<div style="font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px">'+p1+' | Claude AI • '+new Date().toLocaleString('en-GB')+'</div></div>'
      +'<button type="button" id="ai-copy-btn" style="padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.4);background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">📋 Copy</button>'
      +'<button type="button" id="ai-pdf-btn" style="padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.4);background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">⬇️ PDF</button>'
      +'</div>'
      +chartHtml
      +missingHtml
      +'<div style="padding:20px;font-size:14px;line-height:1.9;color:var(--text);white-space:pre-wrap;font-family:Inter,sans-serif">'+text+'</div>'
      // Procurement Plan — system generated
      +buildProcurementPlan(catRows)
      +'</div>';

    output.querySelector('#ai-copy-btn').addEventListener('click',function(){
      navigator.clipboard.writeText(text).then(function(){toast('Report copied!');});
    });
    output.querySelector('#ai-pdf-btn').addEventListener('click',function(){
      const subLabel2=type==='salesman'&&smId!=='all'?(creds[smId]?creds[smId].name:smId):'';
      const label=labels[type]+(subLabel2?' — '+subLabel2:'');

      // Build procurement plan text
      let procText='';
      if(type==='weekly'||type==='monthly'){
        procText+='\n\n─────────────────────────────────\nPROCUREMENT PLAN — NEXT WEEK\nBased on 2-week average + 10% buffer\n─────────────────────────────────\n';
        cats.forEach(function(cat){
          const rows=(catRows[cat.label]||[]).filter(function(r){return r.avg>0;});
          if(!rows.length) return;
          const cwf=rows.reduce(function(a,r){return a+r.recommended;},0);
          const cwb=rows.reduce(function(a,r){return a+r.boxes;},0);
          procText+='\n['+cat.label+'] — ~'+cwf+' Bn | '+cwb+' Boxes\n';
          rows.forEach(function(r){
            const trend=r.chg>10?'↑':r.chg<-10?'↓':'→';
            procText+='  '+r.name+': W1='+r.cur+' | W2='+r.prev+' | Order ~'+r.recommended+' Bn ('+r.boxes+' Boxes) '+trend+(r.chg>=0?'+':'')+r.chg+'%\n';
          });
        });
      }

      const printDiv=document.createElement('div');
      printDiv.id='ai-print-area';
      printDiv.innerHTML='<h2 style="font-size:18px;font-weight:800;color:#1e1b4b;margin-bottom:4px">'+label+'</h2>'
        +'<div style="font-size:11px;color:#64748b;margin-bottom:16px">'+p1+' | Claude AI | '+new Date().toLocaleString('en-GB')+'</div>'
        +(missingSM.length>0?'<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:6px;padding:10px;margin-bottom:14px;font-size:12px">⚠️ Did Not Order: '+missingSM.join(', ')+'</div>':'')
        +'<div style="font-size:13px;line-height:1.9;white-space:pre-wrap">'+text+procText+'</div>';
      document.body.appendChild(printDiv);

      // Add print style
      const style=document.createElement('style');
      style.id='ai-print-style';
      style.innerHTML='@media print{body > *:not(#ai-print-area){display:none!important}#ai-print-area{display:block!important;font-family:Inter,Arial,sans-serif;padding:30px;color:#1e1b4b}}@media screen{#ai-print-area{display:none}}';
      document.head.appendChild(style);

      window.print();

      // Cleanup after print
      setTimeout(function(){
        const el=document.getElementById('ai-print-area');
        const st=document.getElementById('ai-print-style');
        if(el) el.remove();
        if(st) st.remove();
      },1000);
    });

  }catch(e){
    output.innerHTML='<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:14px;padding:1.5rem;text-align:center"><div style="font-size:24px;margin-bottom:8px">⚠️</div><div style="font-size:14px;font-weight:600;color:#dc2626">Could not generate report</div><div style="font-size:12px;color:#64748b;margin-top:4px">Check your internet and try again.</div></div>';
    console.error('AI Report:',e);
  }
}



function downloadForecastExcel(allData,weeksSorted){
  const smId=window.analyticsSM||'all';
  const smName=smId==='all'?'All Salesman':(creds[smId]?creds[smId].name:smId);
  const last4=weeksSorted.slice(0,4);
  function getWB(d,wk){if(smId==='all') return(d.weeks&&d.weeks[wk]&&d.weeks[wk].bunches)||0;const m=d.bySmWeek||{};const k=Object.keys(m).find(function(k){return k.split('|||')[0]===smId;});return k&&m[k]&&m[k][wk]?m[k][wk].bunches||0:0;}
  const today=new Date().toLocaleDateString('en-GB');
  let csv='Greena Procurement Forecast\nGenerated: '+today+'\nSalesman: '+smName+'\n\n';
  csv+='Category,Product,Bn/Box,'+last4.join(',')+',Avg/Week,Next Week Bn,Week Boxes,Next Month Bn,Month Boxes,Trend\n';
  cats.forEach(function(cat){
    cat.items.forEach(function(item){
      const d=allData[item.name];if(!d) return;
      const wv=last4.map(function(w){return getWB(d,w);});
      const wa=Math.round(wv.reduce(function(a,v){return a+v;},0)/Math.max(last4.length,1));
      if(!wa) return;
      const wf=Math.round(wa*1.1),bpb=getCatBpbForProduct(item.name);
      const trend=wv.length>=2?wv[0]-wv[wv.length-1]:0;
      csv+=cat.label+','+item.name+','+bpb+','+wv.join(',')+','+wa+',~'+wf+','+Math.ceil(wf/bpb)+',~'+Math.round(wf*4.33)+','+Math.ceil(wf*4.33/bpb)+',"'+(trend>0?'Rising +'+trend:trend<0?'Falling '+trend:'Stable')+'"\n';
    });
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Forecast_'+smName.replace(/\s/g,'_')+'_'+today.replace(/\//g,'-')+'.csv';
  a.click();
  toast('Forecast downloaded!');
}

function downloadAnalyticsExcel(isAllSM){
  const smId=window.analyticsSM||'all';
  const smName=isAllSM?'All Salesman':(creds[smId]?creds[smId].name:smId);
  const period=window.analyticsTab==='weekly'?window.analyticsWeek:window.analyticsMonth;
  if(!period){toast('Select a period first.');return;}
  const blob=new Blob(['Analytics\nPeriod: '+period+'\nSalesman: '+smName+'\n'],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Analytics_'+smName.replace(/\s/g,'_')+'_'+period.replace(/[\s()]/g,'_')+'.csv';
  a.click();
  toast('Downloaded!');
}
